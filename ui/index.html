/* 代办列表的占位行：借真实 .todo 的骨架（勾选框 + 标题行 + 子项行 + 日期），
   不再是「一整屏转圈」，也不是相册方块。 */
function todoSkeleton(n){
  const row = `<div class="todo skrow">
      <span class="bx"></span>
      <div class="tx">
        <span class="ttl"><i class="sk" style="display:block;width:54%;height:12px"></i></span>
        <div class="sub"><div><span class="sdot"></span>
          <i class="sk" style="display:block;width:34%;height:9px"></i></div></div>
      </div>
      <span class="dt"><i class="sk" style="display:block;width:30px;height:9px"></i></span>
    </div>`;
  return row.repeat(n || 7);
}
function drawTodoSkeleton(){
  $('#content').innerHTML = `<div id="todoWrap">
    <div id="todoBody">${todoSkeleton()}</div>
    <div id="todoPager"><span class="pinfo"><span class="spinner"></span>正在读取代办 …</span></div>
  </div>`;
}

async function renderTodos(force){
  setHead('代办'); setDl(false);
  showBtn('#btnNew', true, '新建代办', 'i-plus');
  const c=$('#content');
  if(!state.todoView) state.todoView='all';
  if(!state.todoPage) state.todoPage=1;
  c.style.overflow='auto';
  const has = Array.isArray(state.todos);     // 有数据（哪怕是 0 条）就不再铺占位
  if(has){
    /* 有手上的列表就直接画：切回页签不闪，强制刷新也先保留旧内容 */
    drawTodoFilters(); drawTodoList();
  }else{
    /* 第一次进来：先把左侧筛选和「代办形状」的占位行画出来，再等接口 */
    state.todos = [];
    drawTodoFilters();
    drawTodoSkeleton();
  }
  if(!has || force){
    try{ const d = await api('/api/todos' + (force?'?refresh=1':'')); state.todos = d.todos || []; state.todosAt = d.at || 0; }
    catch(e){
      const m = String(e.message||'');
      if(m === 'strongauth'){
        // 待办在小米那边属于敏感服务：静默续期换来的票打不通，要重新扫码一次
        $('#left').style.display='none';
        c.innerHTML = `<div class="empty" style="padding:60px 20px">
          <div class="big2">${ICO('i-lock','xl')}</div>
          待办需要重新验证身份<br>
          <span style="color:var(--fg-4);font-size:12px">
            相册、笔记、录音都还能正常用；只有待办需要扫一次码</span>
          <div style="margin-top:18px;display:flex;gap:8px;justify-content:center">
            <button class="btn primary" id="todoDevice">设备登录</button>
            <button class="btn outline" id="todoRelogin">扫码登录</button>
          </div>
          <div style="color:var(--fg-4);font-size:11.5px;margin-top:12px;line-height:1.7">
            设备登录＝输一次账号密码 + 手机验证码<br>之后待办就不用再验证了</div></div>`;
        const bd = $('#todoDevice');
        if(bd) bd.onclick = async () => {
          bd.disabled = true; bd.textContent = '正在打开 …';
          try{ await fetch('/api/device_login', {method:'POST'}); }catch(e){}
          showLogin();
          setTimeout(()=>{ bd.disabled=false; bd.textContent='设备登录'; }, 2500);
        };
        const b = $('#todoRelogin');
        if(b) b.onclick = () => relogin();
        return;
      }
      if(m !== 'auth') c.innerHTML='<div class="empty">读取代办失败</div>';
      return;
    }
  }
  /* 页签已经切走（比如点完待办马上点相册），别再用迟到的结果覆盖当前页面 */
  if(TAB !== 'todo') return;
  drawTodoFilters();
  drawTodoList();
  /* 有缓存就先画出来，然后立刻做一次增量同步（只拉 syncToken 之后的变化）。
     在手机上新建/勾掉的代办，切回来一两百毫秒内就会补上，不用再点刷新。 */
  if(has && !force) setTimeout(refreshTodosQuiet, 0);
}

/* 新建/编辑代办后只刷新数据、原地重画：不跳空白页、不重新走骨架屏 */
async function refreshTodoState(){
  try{
    const d = await api('/api/todos?refresh=1');
    state.todos = d.todos || [];
    state.todosAt = d.at || 0;
    return true;
  }catch(e){
    toast('刷新代办失败：' + errMsg(e));
    return false;
  }
}

/* 拉一次代办最新数据：优先增量同步（syncToken），老缓存没有游标时才全量。
   不负责重画，调用方自己决定怎么画。 */
async function refreshTodoState(quiet){
  try{
    let d = await api('/api/todos?sync=1');
    if(!Array.isArray(d.todos)){
      // 老版本缓存没有 syncToken，退化成一次全量
      d = await api('/api/todos?refresh=1&since=' + encodeURIComponent(state.todosAt || 0));
    }
    state.todos = d.todos || [];
    state.todosAt = d.at || 0;
    return d;
  }catch(e){
    if(!quiet) toast('刷新代办失败：' + errMsg(e));
    return null;
  }
}

/* 先显示缓存列表，后台增量同步；只在还停在代办页、且没开编辑弹窗时更新 */
async function refreshTodosQuiet(){
  if(TAB !== 'todo') return;
  if($('#modal') && $('#modal').classList.contains('on')) return;
  const btn = $('#btnRefresh');
  if(btn) btn.classList.add('spin');
  try{
    const d = await refreshTodoState(true);
    if(!d) return;
    if(TAB !== 'todo' || ($('#modal') && $('#modal').classList.contains('on'))) return;
    drawTodoFilters();
    drawTodoList(true);
  }catch(e){
    /* 静默失败：下次切页签还会再同步 */
  }finally{
    if(btn) btn.classList.remove('spin');
  }
}

function drawTodoFilters(){
  const t = state.todos || [];
  const open = t.filter(x=>!x.done).length, done = t.length - open;
  $('#left').style.display=''; $('#left').classList.remove('gal');
  $('#left').innerHTML = `<div class="row${state.todoView==='all'?' on':''}" data-v="all">
      <span class="nm">全部</span><span class="ct">${t.length}</span></div>
    <div class="row${state.todoView==='open'?' on':''}" data-v="open">
      <span class="nm">未完成</span><span class="ct">${open}</span></div>
    <div class="row${state.todoView==='done'?' on':''}" data-v="done">
      <span class="nm">已完成</span><span class="ct">${done}</span></div>`;
  $$('#left .row').forEach(r=>r.onclick=()=>{
    state.todoView = r.dataset.v;
    state.todoPage = 1;
    drawTodoFilters(); drawTodoList();
  });
}

const TODO_PAGE_SIZE = 50;
function todoPagerHTML(view, total, page, pages){
  const label = view==='all' ? '全部' : view==='done' ? '已完成' : '未完成';
  const info = `${label} · 共 ${total} 条`;
  if(pages <= 1) return `<div id="todoPager"><span class="pinfo">${info}</span></div>`;
  const want = new Set([1, pages]);
  for(let p = page - 2; p <= page + 2; p++){
    if(p >= 1 && p <= pages) want.add(p);
  }
  const arr = [...want].sort((a,b)=>a-b);
  let nums = '', prev = 0;
  arr.forEach(p=>{
    if(prev && p - prev > 1) nums += '<span class="pgap">…</span>';
    nums += `<button class="pg${p===page?' on':''}" data-p="${p}">${p}</button>`;
    prev = p;
  });
  return `<div id="todoPager">
    <span class="pinfo">${info}</span>
    <span class="pctl">
      <button class="pgbtn" data-p="${page-1}"${page<=1?' disabled':''} title="上一页">‹</button>
      ${nums}
      <button class="pgbtn" data-p="${page+1}"${page>=pages?' disabled':''} title="下一页">›</button>
      <span class="pnote">第 ${page} / ${pages} 页</span>
    </span>
  </div>`;
}

function drawTodoList(keepScroll){
  const t = state.todos || [];
  const view = state.todoView || 'all';
  const isAll = view === 'all';
  const isDone = view === 'done';
  // 「全部」= 未完成在上、已完成在下，中间一条分隔
  let list = isAll ? t.filter(x=>!x.done).concat(t.filter(x=>!!x.done))
                   : t.filter(x=>!!x.done===isDone);
  const q = uxNorm((window.UX && UX.q) || '').trim();
  if(q) list = list.filter(x => uxNorm(uxTodoHay(x)).indexOf(q) >= 0);
  const doneN = t.filter(x=>!!x.done).length;
  const pages = Math.max(1, Math.ceil(list.length / TODO_PAGE_SIZE));
  const page = Math.min(Math.max(1, state.todoPage || 1), pages);
  state.todoPage = page;
  const start = (page - 1) * TODO_PAGE_SIZE;
  const rows = list.slice(start, start + TODO_PAGE_SIZE);
  const c = $('#content');
  const top0 = c.scrollTop;
  let body = '';
  if(isAll){
    const firstDone = list.findIndex(x=>!!x.done);
    if(firstDone < 0){
      body = rows.map(todoRow).join('');
    }else if(firstDone >= start && firstDone < start + rows.length){
      const k = firstDone - start;
      body = rows.slice(0, k).map(todoRow).join('');
      body += `<div class="todoSplit" id="todoSplitLine">已完成 <em>${doneN} 项</em></div>`;
      body += rows.slice(k).map(todoRow).join('');
    }else{
      body = rows.map(todoRow).join('');
    }
  }else{
    body = rows.map(todoRow).join('');
  }
  c.innerHTML = `<div id="todoWrap">
    ${uxTodoToolsHTML()}
    <div id="todoBody">${body}</div>
    ${list.length?'':`<div class="empty" style="padding:30px"><div class="big2">${ICO(isDone?'i-check':'i-todo','xl')}</div>${isDone?'还没有已完成的代办':isAll?'还没有代办':'没有未完成的代办，全部清空'}</div>`}
    ${todoPagerHTML(view, list.length, page, pages)}
  </div>`;
  c.scrollTop = keepScroll ? top0 : 0;
  bindTodoList();
  uxPaintTodoSel();
  $$('#todoPager .pg, #todoPager .pgbtn').forEach(b=>{
    if(b.disabled) return;
    b.onclick = () => {
      const p = Number(b.dataset.p);
      if(!p || p === state.todoPage) return;
      state.todoPage = p;
      drawTodoList();
    };
  });
}

function bindTodoList(){
  $$('#todoBody .bx').forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.onclick = async () => {
      const row = b.closest('.todo');
      const done = !row.classList.contains('done');
      b.disabled = true;
      try{
        await api('/api/todo_toggle', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:b.dataset.id, done})});
        const t = (state.todos||[]).find(x=>x.id===b.dataset.id);
        if(t){
          t.done = done;
          t.finished = done ? Date.now() : 0;
        }
        drawTodoFilters(); drawTodoList(true);
      }catch(e){
        toast('更新失败：' + errMsg(e));
      }finally{ b.disabled = false; }
    };
  });
  $$('#todoBody .edit').forEach(btn=>{
    if(btn.dataset.bound) return; btn.dataset.bound='1';
    btn.onclick = e => {
      e.stopPropagation();
      const t = (state.todos||[]).find(x=>x.id===btn.dataset.id);
      if(!t) return;
      openTodoEditor(t);
    };
  });
  $$('#todoBody .del').forEach(btn=>{
    if(btn.dataset.bound) return; btn.dataset.bound='1';
    btn.onclick = e => {
      e.stopPropagation();
      const row = btn.closest('.todo');
      const title = row.querySelector('.tx > .ttl').textContent;
      askConfirm(`删除代办「${title}」？`, '删除', async ()=>{
        try{
          await api('/api/todo_delete', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id:btn.dataset.id})});
          state.todos = (state.todos||[]).filter(x=>x.id!==btn.dataset.id);
          drawTodoFilters(); drawTodoList(true);
          toast('已删除', {type:'ok'});
        }catch(err){ toast('删除失败：' + (err.message||''), {type:'err'}); }
      });
    };
  });
  /* 多选框：点一下进入批量选择 */
  $$('#todoBody .tck').forEach(t=>{
    if(t.dataset.bound) return; t.dataset.bound='1';
    t.onclick = e => {
      e.stopPropagation();
      const id = t.dataset.id;
      if(UX.todoSel.has(id)) UX.todoSel.delete(id); else UX.todoSel.add(id);
      uxPaintTodoSel();
    };
  });
  uxBindTodoTools();
}

/* ---- 编辑代办：复用新建那个弹窗，但要带上已有的子项和完成状态 ---- */
let editingTodo = null;

function openTodoEditor(t){
  editingTodo = t;
  createKind = 'todo_edit';
  $('#mTitle').textContent = '编辑代办';
  $('#mTitleIn').value = t.title || '';
  $('#mTitleIn').placeholder = '要做什么？';
  $('#mBody').value = '';
  $('#mBody').style.display = 'none';
  $('#mTools').style.display = 'none';
  $('#msubWrap').style.display = '';
  $('#mSubs').innerHTML = '';
  (t.subs || []).forEach(s => addSubRow(s.text, s.done));
  $('#modal').dataset.id = t.id;
  $('#modal').classList.add('on');
  setTimeout(()=>$('#mTitleIn').focus(), 30);
}

async function submitTodoEdit(){
  const title = $('#mTitleIn').value.trim();
  if(!title){ $('#mTitleIn').focus(); toast('写点什么再保存'); return; }
  // 子项：读输入框，同时把原来的完成状态按顺序带回去
  const old = (editingTodo && editingTodo.subs) || [];
  const subs = [...document.querySelectorAll('#mSubs .msub')].map((row, i) => ({
    text: row.querySelector('input').value.trim(),
    done: row.dataset.done === '1' || !!(old[i] && old[i].done && !row.dataset.edited),
  })).filter(s => s.text);
  const btn = $('#mOk');
  btn.disabled = true; btn.textContent = '保存中 …';
  try{
    await api('/api/todo_update', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id: editingTodo.id, title, subs})});
    if(editingTodo){
      editingTodo.title = title;
      editingTodo.subs = subs.map(s => ({text: s.text, done: !!s.done}));
    }
    closeCreate();
    drawTodoFilters();
    drawTodoList(true);             // 编辑后停在原位，不跳回顶部
    toast('已保存');
  }catch(e){
    toast('保存失败：' + errMsg(e));
  }finally{
    btn.disabled = false; btn.textContent = '保存';
  }
}

/* ============ 录音 ============ */
/* 录音/云盘列表的占位行：用真实 .item 的骨架（图标位 + 标题行 + 副标题行），
   跟加载出来的行同一套尺寸，数据到了不会整行跳高跳矮。 */
function listSkeletonRows(n, iconClass){
  const row = `<div class="item skrow">
      <span class="ic ${iconClass || 'audio'}"></span>
      <div class="main">
        <div class="t1"><i class="sk" style="display:block;width:38%;height:11px"></i></div>
        <div class="t2"><i class="sk" style="display:block;width:24%;height:9px"></i></div>
      </div>
      <i class="sk" style="display:block;width:${iconClass === 'folder' ? 46 : 110}px;height:10px"></i>
    </div>`;
  return row.repeat(n || 7);
}
function recordSkeleton(n){ return listSkeletonRows(n || 7, 'audio'); }
function driveSkeleton(n){
  if(state.driveView === 'grid'){
    return `<div class="dcard skrow">
      <div class="dtop"><span class="dic folder"></span></div>
      <i class="sk" style="display:block;width:72%;height:10px"></i>
      <i class="sk" style="display:block;width:48%;height:9px"></i></div>`.repeat(n || 10);
  }
  return listSkeletonRows(n || 8, 'folder');
}

function recordRowHTML(r){
  return `<div class="item" data-id="${esc(r.id)}">
    <span class="tick2" data-id="${esc(r.id)}">${ICO('i-check')}</span>
    <span class="ic audio">${ICO('i-wave')}</span>
    <div class="main">
      <div class="t1" title="${esc(r.name)}">${esc(r.label || r.name)}</div>
      <div class="t2">${fmtDate(r.date)}${r.dur!=null?' · '+fmtDur(r.dur):''}${r.size?' · '+fmtSize(r.size):''}</div>
    </div>
    <div class="player" data-id="${esc(r.id)}">
      <button class="pp" title="播放">${ICO('i-play','fill')}</button>
      <span class="bar"><i></i></span>
      <span class="tm">${fmtClock(r.dur)}</span>
      <button class="spd" title="播放速度">1x</button>
    </div>
    <button class="rec-del" data-id="${esc(r.id)}" title="删除这条录音">${ICO('i-close')}</button>
  </div>`;
}

/* 录音按天分组：同一天的录音归到一个日期头下面，翻长列表时能一眼看出时间 */
function recordRowsGrouped(list){
  let out = '', last = '';
  (list || []).forEach(r => {
    const day = r.date ? fmtDay(r.date) : '';
    if(day && day !== last){
      out += `<div class="recday">${esc(day)}</div>`;
      last = day;
    }
    out += recordRowHTML(r);
  });
  return out;
}

async function renderRecords(force){
  setHead('录音'); setDl(true); state.selHint='';
  showBtn('#btnTrash', true, '录音回收站', 'i-trash');
  $('#left').style.display='none';
  const cached = !force && Array.isArray(state.records) && state.records.length;
  if(cached){
    /* 上次已经加载过的列表先画出来：切回录音页签不再走一遍骨架 → 数据 */
    $('#content').innerHTML = `<div class="subhead"><span id="recCount"></span></div>
      <div class="lists" id="recList"></div>`;
    $('#recList').innerHTML = recordRowsGrouped(state.records);
    $('#recCount').textContent = `全部录音 · ${state.records.length} 条`;
    bindRecords();
    setSentinel(state.ended ? '已经到底了' : '', false);
    attachInfinite(recordsMore);
    state.loading = false; state.recForce = false;
    /* 上次的列表先顶上，后台再拉一次第一页：新录音（比如刚在手机上录的）
       切回来就能补出来，不用点刷新。 */
    setTimeout(refreshRecordsQuiet, 0);
    return;
  }
  state.records=[]; state.off=0; state.ended=false; state.loading=false;
  state.recForce = true;          // 首次加载也强制要云端最新的第一页
  $('#content').innerHTML = `<div class="subhead"><span id="recCount">全部录音</span></div>
    <div class="lists" id="recList">${recordSkeleton()}</div>`;
  attachInfinite(recordsMore);
  await recordsMore();
}

/* 录音页的后台补刷：只拉最新第一页，原地替换，不闪骨架；正在多选就不动列表 */
async function refreshRecordsQuiet(){
  if(TAB !== 'record' || sel.size) return;
  const btn = $('#btnRefresh');
  if(btn) btn.classList.add('spin');
  try{
    const d = await api('/api/records?offset=0&limit=100&refresh=1');
    if(TAB !== 'record' || sel.size) return;
    const fresh = d.records || [];
    state.records = fresh.slice();
    state.off = fresh.length;
    state.ended = fresh.length < 100;
    const box = $('#recList');
    if(!box) return;
    box.innerHTML = recordRowsGrouped(fresh);
    bindRecords();
    const rc = $('#recCount');
    if(rc) rc.textContent = `全部录音 · ${state.records.length} 条`;
    setSentinel(state.ended ? (fresh.length ? '已经到底了' : '没有录音') : '', false);
  }catch(e){
    /* 静默失败：下次切回来还会补 */
  }finally{
    if(btn) btn.classList.remove('spin');
  }
}

async function recordsMore(){
  if(state.loading || state.ended) return;
  state.loading = true;
  setSentinel('正在加载 …', true);
  try{
    const d = await api(`/api/records?offset=${state.off}&limit=100${state.recForce?'&refresh=1':''}`);
    if(TAB !== 'record') return;       // 页签已经切走
    state.recForce = false;
    const records = d.records || [];
    state.off += records.length;
    state.ended = records.length < 100;
    state.records.push(...records);
    $('#recList').querySelectorAll('.skrow').forEach(n=>n.remove());
    $('#recList').insertAdjacentHTML('beforeend', recordRowsGrouped(records));
    bindRecords();
    const rc = $('#recCount');
    if(rc) rc.textContent = `全部录音 · ${state.records.length} 条`;
    setSentinel(state.ended ? (state.records.length?'已经到底了':'没有录音') : '', false);
  }catch(e){
    if(String(e.message)!=='auth') setSentinel('加载失败，滚到底部可重试', false);
  }finally{
    state.loading = false;
    pump(recordsMore);
  }
}

/* 同一时刻只播一条录音：起新的之前先把别的停掉 */
function stopAllPlayers(except){
  $$('#recList .player').forEach(pl=>{
    if(pl === except || !pl._au) return;
    try{ pl._au.pause(); }catch(_){}
  });
}

function bindRecords(){
  $$('#recList .tick2').forEach(t=>{
    if(t.dataset.bound) return; t.dataset.bound='1';
    t.onclick=(e)=>{
      const id=t.dataset.id, item=t.closest('.item');
      if(e.shiftKey){ recordRangeSelect(id); return; }
      if(sel.has(id)){ sel.delete(id); t.classList.remove('on'); item.classList.remove('sel'); }
      else { sel.add(id); t.classList.add('on'); item.classList.add('sel'); }
      selSetAnchor(id);
      updSel();
    };
  });
  /* 行本身也能 Shift+点选区间（不用非得点那个小方框） */
  $$('#recList .item').forEach(it=>{
    if(it.dataset.shiftBound) return; it.dataset.shiftBound='1';
    it.onclick = e => {
      if(e.target.closest('.player,.rec-del,.tick2')) return;
      if(e.shiftKey){ e.preventDefault(); recordRangeSelect(it.dataset.id); }
    };
  });
  $$('#recList .player').forEach(pl=>{
    if(pl.dataset.bound) return; pl.dataset.bound='1';
    const pp = pl.querySelector('.pp'), bar = pl.querySelector('.bar'),
          fill = pl.querySelector('.bar i'), tm = pl.querySelector('.tm'),
          spd = pl.querySelector('.spd');
    let au = null;
    let rate = Number(pl.dataset.rate || 1) || 1;
    const paintRate = () => {
      if(!spd) return;
      spd.textContent = rate + 'x';
      spd.classList.toggle('on', rate !== 1);
    };
    paintRate();
    const paint = () => {
      if(!au) return;
      const d = au.duration || 0, c = au.currentTime || 0;
      fill.style.width = d ? Math.min(100, c / d * 100) + '%' : '0%';
      tm.textContent = fmtClock(d ? c : 0);
    };
    const icon = playing => { pp.innerHTML = ICO(playing ? 'i-pause' : 'i-play', 'fill'); };
    pp.onclick = async () => {
      if(pp.dataset.loading) return;
      if(!au){
        pp.dataset.loading='1'; pp.style.opacity='.5';
        stopAllPlayers(pl);
        /* 走本地代理：AMR 等 Chromium 放不了的格式由后台转成 m4a，
           直链挑 Referer / 过期的问题也一并解决。
           注意这里不能在 play() 之前 await，否则可能丢掉这次点击的手势授权。 */
        au = new Audio('/api/record_audio?id=' + encodeURIComponent(pl.dataset.id));
        au.preload = 'auto';
        au.playbackRate = rate;
        au.addEventListener('timeupdate', paint);
        au.addEventListener('loadedmetadata', () => {
          tm.textContent = fmtClock(au.duration);
          paint();
        });
        au.addEventListener('playing', () => { delete pp.dataset.loading; pp.style.opacity=''; });
        au.addEventListener('ended', () => { icon(false); au.currentTime = 0; paint(); });
        au.addEventListener('pause', () => icon(false));
        au.addEventListener('play', () => icon(true));
        au.addEventListener('error', async () => {
          delete pp.dataset.loading; pp.style.opacity='';
          let why = '';
          try{
            const p = await api('/api/record_prepare?id=' + encodeURIComponent(pl.dataset.id));
            if(p && !p.ok && p.error) why = p.error;
          }catch(_){}
          toast(why ? ('播放失败：' + why)
                    : '播放失败：录音格式可能不支持，或地址已过期');
        });
        pl._au = au;
      }
      if(au.paused){
        au.play().catch(() => {
          delete pp.dataset.loading; pp.style.opacity='';
          if(!au.error) toast('播放失败');
        });
      } else {
        au.pause();
      }
    };
    bar.onclick = e => {
      if(!au || !au.duration) return;
      const r = bar.getBoundingClientRect();
      au.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * au.duration;
      paint();
    };
    if(spd) spd.onclick = e => {
      e.stopPropagation();
      rate = rate === 1 ? 1.5 : (rate === 1.5 ? 2 : 1);
      pl.dataset.rate = String(rate);
      if(au){ try{ au.playbackRate = rate; }catch(_){} }
      paintRate();
    };
  });
  $$('#recList .rec-del').forEach(btn=>{
    if(btn.dataset.bound) return; btn.dataset.bound='1';
    btn.onclick = e => {
      e.stopPropagation();
      const item = btn.closest('.item');
      const label = item.querySelector('.t1').textContent;
      askConfirm(`删除录音「${label}」？会先进回收站，可以恢复。`, '删除', async ()=>{
        try{
          await api('/api/record_delete', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id:btn.dataset.id})});
          state.records = (state.records||[]).filter(x=>x.id!==btn.dataset.id);
          item.remove();
          toast('已移入回收站', {type:'ok'});
        }catch(err){ toast('删除失败：' + (err.message||''), {type:'err'}); }
      });
    };
  });
  /* 搜索词还在：重画/追加后把过滤重新套一遍 */
  if(window.UX && UX.q.trim()) uxFilterRecordRows();
}

/* ============ 回收站 ============ */
async function openTrash(){
  state.trashView = true;
  setHead('最近删除');
  setDl(false);
  showBtn('#btnTrash', false);
  showBtn('#btnNew', false);
  showBtn('#btnSelAll', false);   // 回收站有自己的全选，顶栏这个不能再露出来
  $$('#left .alb').forEach(x=>x.classList.remove('on'));
  $$('#left .row.sec').forEach(x=>x.classList.toggle('on', x.dataset.sec === 'trash'));
  const c = $('#content');
  c.scrollTop = 0; c.onscroll = null;
  state.trash = [];
  state.trashSel = new Set();
  state.trashTag = 0;
  state.trashEnd = false;
  state.trashAnchor = null;
  state.trashLoading = false;
  state.trashPages = 0;
  c.innerHTML = `<div class="trwrap">
    <div class="subhead">
      <span style="flex:1;color:var(--dim2)">最近删除的照片可以恢复，也可以彻底删除（不可撤销）</span>
      <button class="btn outline xs" id="trSelAll">全选</button>
      <button class="btn outline xs" id="trRecover" disabled>恢复选中</button>
      <button class="btn danger xs" id="trPurge" disabled>彻底删除</button>
    </div>
    <div id="trGrid" class="trgrid"><div class="empty" style="grid-column:1/-1"><span class="spinner"></span>正在读回收站 …</div></div>
    <div id="trFoot" class="trfoot"></div>
  </div>`;

  const sync = () => {
    const n = state.trashSel.size;
    const rb=$('#trRecover'), pb=$('#trPurge');
    if(rb){ rb.disabled=!n; rb.textContent = n ? `恢复选中（${n}）` : '恢复选中'; }
    if(pb){ pb.disabled=!n; pb.textContent = n ? `彻底删除（${n}）` : '彻底删除'; }
    const cnt=$('#trCount'); if(cnt) cnt.textContent = `已显示 ${state.trash.length} 项`;
    const st=$('#trState');
    if(st) st.textContent = state.trashLoading ? '正在加载 …' : (state.trashEnd ? '已经到底了' : '');
  };
  const cardHTML = x => `
      <div class="card${state.trashSel.has(x.id)?' sel':''}" data-id="${esc(x.id)}">
        <div class="ph"></div>
        ${(x.thumbUrl||x.thumb)?`<img loading="lazy" decoding="async" src="${esc(x.thumbUrl||x.thumb)}" alt=""
            onload="imgOk(this)" onerror="imgFail(this)">`:''}
        ${x.type==='video'?`<span class="vt">${ICO('i-play','fill')}视频</span>`:''}
        <span class="tick" role="checkbox">${ICO('i-check')}</span>
        ${cardMetaHTML({date:x.deleted, size:x.size})}
      </div>`;
  const applySel = () => {
    $$('#trGrid .card').forEach(card =>
      card.classList.toggle('sel', state.trashSel.has(card.dataset.id)));
  };
  const bindCards = () => {
    $$('#trGrid .card').forEach(card=>{
      if(card.dataset.bound) return;
      card.dataset.bound = '1';
      card.onclick = e => {
        const id = card.dataset.id;
        /* Shift+点：把锚点到这一张之间的所有照片一起选上（和文件管理器一致） */
        if(e.shiftKey && state.trashAnchor && state.trashAnchor !== id){
          const a = state.trash.findIndex(x=>String(x.id) === String(state.trashAnchor));
          const b = state.trash.findIndex(x=>String(x.id) === String(id));
          if(a >= 0 && b >= 0){
            const lo = Math.min(a,b), hi = Math.max(a,b);
            state.trash.slice(lo, hi+1).forEach(x => state.trashSel.add(x.id));
            applySel(); sync();
            return;
          }
        }
        if(state.trashSel.has(id)){ state.trashSel.delete(id); card.classList.remove('sel'); }
        else { state.trashSel.add(id); card.classList.add('sel'); }
        state.trashAnchor = id;
        sync();
      };
    });
  };
  const paint = (added, replace) => {
    const grid = $('#trGrid'); if(!grid) return;
    if(replace){
      grid.innerHTML = state.trash.length ? state.trash.map(cardHTML).join('')
        : `<div class="empty" style="grid-column:1/-1;padding:60px"><div class="big2">${ICO('i-trash','xl')}</div>回收站是空的</div>`;
    }else if(added.length){
      grid.querySelectorAll('.empty').forEach(x=>x.remove());
      grid.insertAdjacentHTML('beforeend', added.map(cardHTML).join(''));
    }
    bindCards();
  };
  const foot = () => {
    const f=$('#trFoot'); if(!f) return;
    f.innerHTML = `<span id="trCount"></span><span id="trState"></span>`;
    sync();
  };
  const load = async (more) => {
    if(state.trashLoading || (more && state.trashEnd)) return;
    if(!state.trashView) return;
    state.trashLoading = true;
    state.trashPages = (state.trashPages || 0) + 1;
    sync();
    let added = [];
    try{
      const d = await api('/api/trash?limit=120&maxTag=' + encodeURIComponent(more ? state.trashTag : 0));
      if(!state.trashView) return;      // 已经切走
      const items = d.items || [];
      if(!more){ state.trash = []; state.trashSel = new Set(); state.trashAnchor = null; }
      const seen = new Set(state.trash.map(x=>x.id));
      for(const x of items){ if(!seen.has(x.id)){ state.trash.push(x); seen.add(x.id); added.push(x); } }
      const prevTag = state.trashTag;
      const nextTag = d.nextTag || 0;
      state.trashTag = nextTag || state.trashTag;
      /* 服务端说结束、这一页没有新品、或 maxTag 没往前走 —— 都算到底，
         避免自动加载在同一页上死循环。 */
      state.trashEnd = !!d.lastPage || (more && (!added.length || nextTag === prevTag));
      paint(added, !more);
    }catch(e){
      if(String(e.message)!=='auth') toast('读回收站失败：' + (e.message||''));
    }finally{
      state.trashLoading = false;
      if(state.trashView) sync();
    }
    /* 内容还没撑出滚动条、又还有下一页：自动接着取，不用用户点「加载更多」 */
    if(state.trashView && !state.trashEnd && state.trashPages < 12){
      const box = $('#content');
      if(box && box.scrollHeight <= box.clientHeight + 40) await load(true);
    }
  };
  $('#trSelAll').onclick = () => {
    const all = state.trash.length && state.trash.every(x=>state.trashSel.has(x.id));
    state.trash.forEach(x => all ? state.trashSel.delete(x.id) : state.trashSel.add(x.id));
    applySel(); sync();
  };
  const tagsOf = ids => {
    const m = {};
    state.trash.forEach(x=>{ if(ids.includes(x.id)) m[x.id] = x.tag; });
    return m;
  };
  $('#trRecover').onclick = async () => {
    const ids = [...state.trashSel]; if(!ids.length) return;
    try{
      const r = await api('/api/trash_recover', {method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids, tags: tagsOf(ids)})});
      toast(`已恢复 ${(r.recovered||[]).length} 项`);
      openTrash();
    }catch(e){ toast('恢复失败：' + (e.message||'')); }
  };
  $('#trPurge').onclick = () => {
    const ids = [...state.trashSel]; if(!ids.length) return;
    askConfirm(`彻底删除 ${ids.length} 项？删除后无法恢复。`, '彻底删除', async ()=>{
      try{
        const r = await api('/api/trash_purge', {method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids, tags: tagsOf(ids)})});
        toast(`已彻底删除 ${(r.purged||[]).length} 项`);
        openTrash();
      }catch(e){ toast('删除失败：' + (e.message||'')); }
    });
  };
  /* 滚到底部附近自动取下一页；不再需要手动点「加载更多」 */
  c.onscroll = () => {
    if(!state.trashView || state.trashLoading || state.trashEnd) return;
    if(c.scrollTop + c.clientHeight >= c.scrollHeight - 600) load(true);
  };
  foot();
  await load(false);
}

async function renderDrive(){

async function driveOpen(parent, trail){
  state.parent=parent; state.trail=trail;
  state.driveActive = null;
  state.driveItems=[]; state.drivePage=1; state.driveEnded=false; state.loading=false;
  const c=$('#content');

      <div id="crumb"></div>
      <div id="driveList" class="${state.driveView==='grid'?'grid':''}">${driveSkeleton()}</div></div>`;
  c.scrollTop=0;

  await driveMore();
}

function drawCrumb(){
  const t=state.trail||[];
  const parts=[`<a href="#" data-i="-1">全部文件</a>`]
    .concat(t.map((f,i)=>`<a href="#" data-i="${i}"${i===t.length-1?' class="cur"':''}>${esc(f.name)}</a>`));
  const v = state.driveView === 'grid' ? 'grid' : 'list';
  const srt = (window.DRIVE_SORTS ? DRIVE_SORTS[state.driveSortIdx || 0] : null) || {label:'名称 A→Z'};
  $('#crumb').innerHTML = parts.join('<span class="cs">›</span>') +
    `<button id="driveSort" class="sortb" title="排序：${esc(srt.label)}">
       ${ICO('i-sort')}<span>${esc(srt.label)}</span></button>` +
    `<span class="vsw" id="driveVsw">
       <button data-v="list" class="${v==='list'?'on':''}" title="列表视图">
         <svg class="i"><use href="#i-list"/></svg></button>
       <button data-v="grid" class="${v==='grid'?'on':''}" title="网格视图">
         <svg class="i"><use href="#i-grid"/></svg></button>
     </span>`;
  $$('#crumb a').forEach(a=>a.onclick=e=>{
    e.preventDefault();
    const i=+a.dataset.i;
    if(i<0) driveOpen(0,[]); else driveOpen(state.trail[i].id, state.trail.slice(0,i+1));
  });
  $$('#driveVsw button').forEach(b=>b.onclick=()=>{
    const nv = b.dataset.v;
    if(nv === state.driveView) return;
    state.driveView = nv;
    try{ localStorage.setItem('driveView', nv); }catch(_){}
    drawCrumb();
    redrawDriveList();
  });
  const sb = $('#driveSort');
  if(sb) sb.onclick = () => {
    state.driveSortIdx = ((state.driveSortIdx || 0) + 1) % DRIVE_SORTS.length;
    try{ localStorage.setItem('driveSortIdx', String(state.driveSortIdx)); }catch(_){}
    drawCrumb();
    redrawDriveList();
  };
}

/* 切换视图时重画已加载的条目（不用重新请求） */
const DRIVE_SORTS = [
  {key:'name', dir:1,  label:'名称 A→Z'},
  {key:'name', dir:-1, label:'名称 Z→A'},
  {key:'time', dir:-1, label:'时间 新→旧'},
  {key:'time', dir:1,  label:'时间 旧→新'},
  {key:'size', dir:-1, label:'大小 大→小'},
  {key:'size', dir:1,  label:'大小 小→大'},
];
function uxSortDrive(list){
  const s = DRIVE_SORTS[state.driveSortIdx || 0] || DRIVE_SORTS[0];
  const val = x => s.key === 'size' ? (Number(x.size) || 0)
                  : s.key === 'time' ? (Number(x.date) || 0)
                  : String(x.name || '');
  const arr = (list || []).slice();
  arr.sort((a, b) => {
    if(!!a.isFolder !== !!b.isFolder) return a.isFolder ? -1 : 1;  // 文件夹永远在前
    const va = val(a), vb = val(b);
    if(va < vb) return -s.dir;
    if(va > vb) return s.dir;
    return String(a.name||'').localeCompare(String(b.name||''), 'zh-Hans-CN');
  });
  return arr;
}

function redrawDriveList(){
  const box = $('#driveList');
  if(!box) return;
  box.className = state.driveView === 'grid' ? 'grid' : '';
  if(!state.driveItems.length){ box.innerHTML = ''; return; }
  const items = uxSortDrive(uxDriveItems());
  if(!items.length){
    const q = (window.UX && UX.q || '').trim();
    box.innerHTML = `<div class="empty" style="padding:40px"><div class="big2">${ICO('i-search','xl')}</div>没有匹配「${esc(q)}」的文件</div>`;
    setSentinel('', false);
    return;
  }
  box.innerHTML = items.map(driveEntryHTML).join('');
  bindDrive();
  setSentinel(state.driveEnded ? '已经到底了' : '', false);
}

/* 局部移除若干行：只把这几条从列表里拿掉，不重画整个云盘页
   （以前移动/删除完调 driveOpen() 整页重载，骨架屏闪一下，体验很断） */
function removeDriveRows(ids){
  const set = new Set((ids || []).map(String));
  if(!set.size) return;
  $$('#driveList .dentry').forEach(el => {
    if(!set.has(String(el.dataset.id))) return;
    el.style.transition = 'opacity .16s var(--ease), transform .16s var(--ease)';
    el.style.opacity = '0';
    el.style.transform = 'scale(.97)';
    setTimeout(() => el.remove(), 170);
  });
  state.driveItems = (state.driveItems || []).filter(v => !set.has(String(v.id)));
  ids.forEach(x => sel.delete(x));
  updSel();
  if(!state.driveItems.length){
    if(!state.driveEnded){
      setTimeout(() => pump(driveMore), 180);       // 还有下一页就接着拉
    }else{
      const box = $('#driveList');
      if(box) box.innerHTML = `<div class="empty" style="padding:40px"><div class="big2">${ICO('i-folder','xl')}</div>这个文件夹是空的</div>`;
      setSentinel('', false);
    }
  }
}

/* 删除云盘条目：右键菜单和行内删除按钮共用这一份逻辑 */
function delDrive(ids){
  ids = (ids || []).map(String);
  if(!ids.length) return;
  askConfirm(ids.length > 1 ? `删除这 ${ids.length} 项？文件会进云端回收站。`
                            : '删除这一项？文件会进云端回收站。', '删除', async ()=>{
    try{
      for(const one of ids){
        const item = (state.driveItems||[]).find(v=>String(v.id) === one);
        await api('/api/drive_delete', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:one, folder:item && item.isFolder})});
      }
      toast('已删除'); removeDriveRows(ids);
    }catch(err){ toast('删除失败：' + (err.message||'')); }
  });
}

/* 把一个条目拖进文件夹（= 移动） */
async function driveMoveInto(id, parentId, parentName){
  const item = (state.driveItems||[]).find(v=>String(v.id) === String(id));
  if(!item) return;
  if(String(parentId) === String(state.parent || '0')) return;   // 本来就在这一层
  try{
    await api('/api/drive_move', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, parent: parentId, name: item.name, folder: item.isFolder})});
    toast('已移到「' + parentName + '」');
    removeDriveRows([id]);
  }catch(err){ toast('移动失败：' + (err.message||'')); }
}

/* 一条云盘条目：列表和网格共用同一份数据，输出两套结构 */
const DRIVE_KIND_NAME = {folder:'文件夹', image:'图片', video:'视频', audio:'音频',
  pdf:'PDF', word:'Word', excel:'Excel', ppt:'PPT', archive:'压缩包',
  text:'文本', code:'代码', other:'文件'};
function driveKindOf(x){
  if(x.kind) return x.kind;
  if(x.isFolder) return 'folder';
  const ext = (x.name || '').split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp','bmp','heic','heif','tif','tiff','avif','raw'].includes(ext)) return 'image';
  if(['mp4','mov','mkv','avi','webm','m4v','wmv','flv','3gp'].includes(ext)) return 'video';
  if(['mp3','m4a','aac','wav','flac','ogg','opus','amr'].includes(ext)) return 'audio';
  if(ext === 'pdf') return 'pdf';
  if(['doc','docx'].includes(ext)) return 'word';
  if(['xls','xlsx','csv'].includes(ext)) return 'excel';
  if(['ppt','pptx'].includes(ext)) return 'ppt';
  if(['zip','rar','7z','tar','gz','bz2','xz'].includes(ext)) return 'archive';
  if(['txt','md','json','xml','ini','log','yaml','yml'].includes(ext)) return 'text';
  if(['py','js','ts','html','css','java','c','cpp','go','rs','sh','bat','ps1'].includes(ext)) return 'code';
  return 'other';
}
function driveIconHTML(x){
  const k = driveKindOf(x);
  if(x.thumb) return `<img class="dthumb" src="${esc(x.thumb)}" alt="">`;
  if(k === 'folder') return ICO('i-folder');
  if(k === 'image') return ICO('i-photo');
  if(k === 'video') return ICO('i-play');
  if(k === 'audio') return ICO('i-mic');
  if(k === 'text' || k === 'code') return ICO('i-note');
  const tag = {pdf:'PDF', word:'DOC', excel:'XLS', ppt:'PPT', archive:'ZIP'}[k] || 'FILE';
  return `<b class="ftag">${tag}</b>`;
}
function driveEntryHTML(x){
  const folder = !!x.isFolder;
  const k = driveKindOf(x);
  const meta = folder ? '文件夹'
    : `${DRIVE_KIND_NAME[k] || '文件'} · ${fmtSize(x.size)} · ${fmtDate(x.date)}`;
  if(state.driveView === 'grid'){
    return `<div class="dcard dentry" data-id="${esc(x.id)}" data-folder="${folder}" data-kind="${k}" draggable="true">
      <div class="dtop">
        <span class="dic ${k}${folder?' folder':''}">${driveIconHTML(x)}</span>
        <span class="dright">
          <span class="rowacts"><button class="rowdel" data-id="${esc(x.id)}" title="删除">${ICO('i-trash')}</button></span>
          ${folder ? '' : `<span class="dtick" data-id="${esc(x.id)}">${ICO('i-check')}</span>`}
        </span>
      </div>
      <div class="dname" title="${esc(x.name)}">${esc(x.name)}</div>
      <div class="dmeta" title="${meta}">${meta}</div>
    </div>`;
  }
  return `<div class="item dentry" data-id="${esc(x.id)}" data-folder="${folder}" data-kind="${k}" draggable="true">
      <span class="ic ${k}${folder?' folder':''}">${driveIconHTML(x)}</span>
      <div class="main">
        <div class="t1">${esc(x.name)}</div>
        <div class="t2">${meta}</div>
      </div>
      <span class="rowacts"><button class="rowdel" data-id="${esc(x.id)}" title="删除">${ICO('i-trash')}</button></span>
      ${folder?`<span class="rt">${ICO('i-chevron')}</span>`
              :`<span class="tick2" data-id="${esc(x.id)}">${ICO('i-check')}</span>`}
    </div>`;
}

/* 双击文件：图片/视频进内置预览，其它下载解密后用系统默认程序打开 */
function openDriveFile(id){
  const x = (state.driveItems || []).find(v=>v.id === id);
  if(!x) return;
  if(x.isFolder){
    driveOpen(x.id, (state.trail||[]).concat([{id:x.id, name:x.name}]));
    return;
  }
  const k = driveKindOf(x);
  const url = '/api/drive_file?id=' + encodeURIComponent(id);
  if(k === 'image'){
    openViewer({id: 'drive:' + id, name: x.name, type: 'image', date: x.date, size: x.size,
                fullUrl: url, bigUrl: url, thumbUrl: x.thumb || url, fullCached: false,
                driveFile: true});
    return;
  }
  if(k === 'video'){
    openViewer({id: 'drive:' + id, name: x.name, type: 'video', date: x.date, size: x.size,
                fullUrl: url, bigUrl: x.thumb || '', thumbUrl: x.thumb || '', driveFile: true});
    return;
  }
  toast('正在下载并打开 …');
  fetch('/api/drive_open', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id})})
    .then(r => r.json())
    .then(r => toast(r.ok ? '已打开：' + (r.path || '')
                          : ('打开失败：' + (r.error || ''))))
    .catch(() => toast('打开失败'));
}

async function startDriveVideo(it){
  const vid = $('#viewerVideo'), bar = $('#videoBar'), txt = $('#videoBarText'),
        track = $('#videoBarTrack'), cancel = $('#videoBarCancel');
  bar.style.display = 'flex';
  txt.textContent = '正在下载并解密视频 …';
  track.style.display = 'none';
  cancel.style.display = '';
  cancel.textContent = '取消';
  cancel.onclick = () => { bar.style.display = 'none'; closeViewer(); };
  const id = String(it.id).replace(/^drive:/, '');
  vid.controls = true;
  vid.onerror = () => { txt.textContent = '视频打不开'; };
  vid.onloadedmetadata = () => {
    if(vid.videoWidth) showMeta(it, `${vid.videoWidth}×${vid.videoHeight}`);
  };
  vid.oncanplay = () => { bar.style.display = 'none'; vid.play().catch(()=>{}); };
  vid.src = '/api/drive_file?id=' + encodeURIComponent(id);
  vid.style.display = 'block';
}

async function driveMore(){
  if(state.loading || state.driveEnded) return;
  state.loading = true;
  setSentinel('正在加载 …', true);
  try{
    const r = await api(`/api/drive?parent=${encodeURIComponent(state.parent)}&page=${state.drivePage}`);
    if(TAB !== 'drive') return;        // 页签已经切走
    const items = r.items || [];
    state.drivePage++;
    state.driveEnded = !r.hasMore;
    state.driveItems.push(...items);
    /* 不管这一页有没有内容，占位行都要撤掉：空文件夹也得显示「这个文件夹是空的」 */
    $('#driveList').querySelectorAll('.skrow').forEach(n=>n.remove());
    $('#driveList').insertAdjacentHTML('beforeend', items.map(driveEntryHTML).join(''));
    bindDrive();
    setSentinel(state.driveEnded ? (state.driveItems.length?'已经到底了':'这个文件夹是空的') : '', false);
  }catch(e){
    if(String(e.message)!=='auth') setSentinel('加载失败，滚到底部可重试', false);
  }finally{
    state.loading = false;
    pump(driveMore);
  }
}

function bindDrive(){
  // 所有条目都能拖：拖到文件夹上 = 移动（之前只加了 draggable 属性、没接 dragstart，
  // 所以 dragDriveId 永远是 null，文件夹那边判定不到内部拖动，等于拖不动）
  $$('#driveList .dentry').forEach(it=>{
    if(it.dataset.dragged) return; it.dataset.dragged='1';
    it.addEventListener('dragstart', e=>{
      const types = [...(e.dataTransfer.types||[])];
      if(types.includes('Files')) return;       // 从资源管理器拖进来的，不接管
      dragDriveId = it.dataset.id;
      it.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', 'drive:' + it.dataset.id); }catch(_){}
    });
    it.addEventListener('dragend', ()=>{
      dragDriveId = null;
      $$('#driveList .dentry').forEach(x=>x.classList.remove('dragging','drop-t'));
    });
  });

  // 所有条目：单击选中；双击打开（文件夹进入，文件预览/打开）
  $$('#driveList .dentry').forEach(it=>{
    if(it.dataset.selBound) return; it.dataset.selBound='1';
    const nameOf = () => (it.querySelector('.t1,.dname')||{}).textContent || '文件夹';
    const enter = () => driveOpen(it.dataset.id,
      (state.trail||[]).concat([{id:it.dataset.id, name:nameOf()}]));
    it.onclick = e => {
      if(e.target.closest('.rowacts,.tick2,.dtick,.rt')) return;
      if(e.shiftKey && it.dataset.folder !== 'true'){
        e.preventDefault();
        driveRangeSelect(it.dataset.id);
        return;
      }
      $$('#driveList .dentry').forEach(x=>x.classList.remove('focus'));
      it.classList.add('focus');
      state.driveActive = it.dataset.id;
    };
    it.ondblclick = e => {
      if(e.target.closest('.rowacts,.tick2,.dtick')) return;
      if(it.dataset.folder === 'true') enter();
      else openDriveFile(it.dataset.id);
    };
    const rt = it.querySelector('.rt');
    if(rt) rt.onclick = e => {
      e.stopPropagation();
      if(it.dataset.folder === 'true') enter();
    };
  });

  // 文件夹：拖外部文件进来 → 上传；拖内部条目进来 → 移动（单击不再直接进入）
  $$('#driveList .dentry[data-folder="true"]').forEach(it=>{
    if(it.dataset.bound) return; it.dataset.bound='1';
    const nameOf = () => (it.querySelector('.t1,.dname')||{}).textContent || '文件夹';
    // —— 拖拽落点 ——
    it.addEventListener('dragover', e=>{
      if(dragDriveId){
        if(String(dragDriveId) === String(it.dataset.id)) return;   // 别自己拖给自己
        e.preventDefault(); e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        it.classList.add('drop-t');
        return;
      }
      if(![...(e.dataTransfer.types||[])].includes('Files')) return;
      e.preventDefault();
      e.stopPropagation();                    // 别让提示带接管
      e.dataTransfer.dropEffect = 'copy';
      it.classList.add('drop-t');
      showDropMask('folder', { id: it.dataset.id, name: nameOf() });
    });
    it.addEventListener('dragleave', ()=>{
      it.classList.remove('drop-t');
      if(!dragDriveId) showDropMask('folder');   // 回到「当前目录」提示
    });
    it.addEventListener('drop', e=>{
      if(dragDriveId){
        if(String(dragDriveId) === String(it.dataset.id)) return;
        e.preventDefault();
        e.stopPropagation();
        const srcId = dragDriveId;
        dragDriveId = null;
        it.classList.remove('drop-t');
        driveMoveInto(srcId, it.dataset.id, nameOf());
        return;
      }
      if(![...(e.dataTransfer.types||[])].includes('Files')) return;
      e.preventDefault();
      e.stopPropagation();                    // 关键：阻止冒泡到 window 的通用处理
      it.classList.remove('drop-t');
      hideDropMask();
      uploadFiles(e.dataTransfer.files, { kind:'drive', target: it.dataset.id,
                                          name: nameOf() });
    });
  });
  // 勾选框：列表是 .tick2，网格是 .dtick
  $$('#driveList .tick2, #driveList .dtick').forEach(t=>{
    if(t.dataset.bound) return; t.dataset.bound='1';
    t.onclick=e=>{
      e.stopPropagation();
      const id=t.dataset.id;
      if(e.shiftKey){ driveRangeSelect(id); return; }
      const item=t.closest('.dentry');
      if(sel.has(id)){ sel.delete(id); t.classList.remove('on'); item.classList.remove('sel'); }
      else { sel.add(id); t.classList.add('on'); item.classList.add('sel'); }
      selSetAnchor(id);
      updSel();
    };
  });
  // 行内删除按钮（悬停出现）
  $$('#driveList .rowdel').forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.onclick = e=>{
      e.stopPropagation();
      const id = b.dataset.id;
      const x = (state.driveItems||[]).find(v=>String(v.id) === String(id));
      if(!x) return;
      const many = sel.size > 1 && sel.has(id);
      delDrive(many ? [...sel] : [id]);
    };
  });
  if(state.driveItems.some(x=>!x.isFolder)) setDl(true);
  $$('#driveList .dentry').forEach(it=>{
    it.addEventListener('contextmenu', e=>{
      e.preventDefault();
      const id = it.dataset.id;
      const x = (state.driveItems||[]).find(v=>v.id===id);
      if(!x) return;
      const isFolder = !!x.isFolder;
      const many = sel.size > 1 && sel.has(id);
      const ids = many ? [...sel] : [id];
      showCtx(e.clientX, e.clientY, [
        {text:'重命名', icon:'i-note', run: async ()=>{
          const nm = await askName('重命名', x.name, '名字');
          if(!nm || nm===x.name) return;
          try{ await api('/api/drive_rename', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id, name:nm})});
            toast('已改名'); driveOpen(state.parent, state.trail);
          }catch(err){ toast('改名失败：' + (err.message||'')); }
        }},
        {text:'移动到…', icon:'i-folder', run: ()=>{
          pickFolder(`移动到哪个文件夹（${ids.length} 项）`, ids, async pid=>{
            let ok = 0, fail = 0;
            for(const one of ids){
              const item = (state.driveItems||[]).find(v=>v.id===one);
              try{
                await api('/api/drive_move', {method:'POST',
                  headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({id:one, parent:pid, name:item&&item.name,
                                       folder:item&&item.isFolder})});
                ok++;
              }catch(_){ fail++; }
            }
            toast(fail ? `已移动 ${ok} 项，失败 ${fail} 项` : `已移动 ${ok} 项`);
            driveOpen(state.parent, state.trail);
          }, '移到此处', true);
        }},
        ...(isFolder ? [] : [{text:'复制到…', icon:'i-copy', run: ()=>{
          pickFolder(`复制到哪个文件夹（${ids.length} 项）`, ids, async pid=>{
            let ok = 0, fail = 0;
            for(const one of ids){
              const item = (state.driveItems||[]).find(v=>v.id===one);
              try{
                await api('/api/drive_copy', {method:'POST',
                  headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({id:one, parent:pid,
                                       name:'副本_' + (item ? item.name : 'file')})});
                ok++;
              }catch(_){ fail++; }
            }
            toast(fail ? `已复制 ${ok} 项，失败 ${fail} 项` : `已复制 ${ok} 项`);
            driveOpen(state.parent, state.trail);
          }, '复制到此处', false);
        }}]),
        '-',
        {text:'复制名字', icon:'i-copy', run: async ()=>{
          const ok = await copyText(x.name||''); toast(ok ? '已复制' : '复制失败');
        }},
        {text: many ? `删除选中的 ${ids.length} 项` : '删除', icon:'i-close', danger:true,
         run: ()=> delDrive(ids)},
      ]);
    });
  });
}

/* 云盘目标文件夹选择：从根目录开始的面包屑 + 当前层的子文件夹。
   点文件夹只是「进入」，底部「移到此处 / 复制到此处」才是确认——
   以前只能从当前文件夹往下钻，根目录和上级根本去不了。 */
function pickFolder(title, excludeIds, onPick, okLabel, isMove){
  const skip = new Set((Array.isArray(excludeIds) ? excludeIds : [excludeIds])
    .filter(v=>v != null).map(String));
  const box = $('#picker');
  $('#pickTitle').textContent = title;
  const okBtn = $('#pickOk');
  okBtn.style.display = '';
  okBtn.textContent = okLabel || '放到这里';

  /* 路径从根开始：全部文件 › … › 当前文件夹，任意一级都能点回去 */
  const path = [{id:'0', name:'全部文件'}];
  for(const t of (state.trail || [])) path.push({id:String(t.id), name:t.name});
  if(path.length === 1 && String(state.parent || '0') !== '0')
    path.push({id:String(state.parent), name:'当前文件夹'});

  const cur = () => path[path.length - 1];
  const syncOk = () => {
    // 移动回原文件夹没有意义；复制到原文件夹是允许的（会生成副本）
    const same = String(cur().id) === String(state.parent || '0');
    okBtn.disabled = !!isMove && same;
    okBtn.title = okBtn.disabled ? '文件已经在这个文件夹里' : '';
  };

  const draw = async () => {
    const node = cur();
    $('#pickList').innerHTML = '<div class="empty" style="padding:26px">正在读 …</div>';
    let items = [];
    try{ const d = await api('/api/drive?parent=' + encodeURIComponent(node.id)); items = d.items || []; }
    catch(_){}
    const folders = items.filter(x=>x.isFolder && !skip.has(String(x.id)));
    const crumbs = path.map((p,i)=>
      `<a data-i="${i}"${i===path.length-1?' class="cur"':''}>${esc(p.name)}</a>`
    ).join('<span class="cs">›</span>');
    $('#pickList').innerHTML = `<div class="pickpath" id="pickPath">${crumbs}</div>`
      + (folders.length
         ? folders.map(f=>`<div class="row pickin" data-id="${esc(f.id)}">
              <span class="ic">${ICO('i-folder')}</span>
              <span class="nm">${esc(f.name)}</span>
              <span class="ct">›</span></div>`).join('')
         : '<div class="empty" style="padding:20px 10px">这个文件夹里没有子文件夹</div>');
    $$('#pickPath a').forEach(a=>a.onclick=()=>{
      const i = +a.dataset.i;
      if(i >= path.length - 1) return;
      path.length = i + 1;
      draw();
    });
    $$('#pickList .pickin').forEach(r=>{
      r.onclick = () => {
        path.push({id: r.dataset.id, name: r.querySelector('.nm').textContent});
        draw();
      };
    });
    syncOk();
  };

  okBtn.onclick = () => {
    if(okBtn.disabled) return;
    const id = String(cur().id);
    box.classList.remove('on');
    onPick(id);
  };
  draw();
  box.classList.add('on');
}

function drivePickRows(excludeId){
  // 根目录 + 当前路径 + 当前文件夹里的子文件夹，去重；
  // excludeId 是被移动/复制的那一项（可以是数组），防止把文件夹拖进它自己
  const skip = new Set((Array.isArray(excludeId) ? excludeId : [excludeId])
    .filter(v=>v!=null).map(String));
  const rows = [{id:'0', name:'全部文件（根目录）', icon:'i-cloud'}];
  for(const t of (state.trail||[])) rows.push({id:t.id, name:t.name, icon:'i-folder'});
  for(const d of (state.driveItems||[])){
    if(d.isFolder) rows.push({id:d.id, name:d.name, icon:'i-folder'});
  }
  const seen = new Set();
  return rows.filter(r=>{
    const k = String(r.id);
    if(skip.has(k) || seen.has(k)) return false;
    seen.add(k); return true;
  });
}

/* ============ 查看器（图片 + 视频） ============
   交互照 PhotoSwipe / Viewer.js 的通行做法：
   · 滚轮以光标为中心缩放，双击在「适应」和 2.5 倍之间切换
   · 放大后拖动平移，边界卡住不让图拖飞
   · ← → 或两侧按钮翻上一张 / 下一张，Esc 关闭，点空白处关闭
   · 百分比按「原始像素」算：100% 就是 1:1
*/
const VP = {scale:1, x:0, y:0};
const MIN_SCALE = 1, MAX_SCALE = 20;      // 都是相对「适应窗口」的倍数
let vCurrent=null, vLoadedFull=false, vIsVideo=false, vPoll=null, vDragged=false;
let vLoadSeq = 0;   // 每次打开/关闭 +1：上一张还在下载的回调不许再动这一张
let vRotAbs = 0;      // 累计旋转角度（不做取模，CSS 才会一直往一个方向转）
function vRotMod(){ return ((vRotAbs % 360) + 360) % 360; }
// 哪一层在显示：压缩图用 A，换原图后直接切到 B 层显示，A 保持旧图不再重绘 → 天然不闪
let vImgEl=null;
function activeImg(){ return vImgEl || document.getElementById('viewerImg'); }

function baseScale(el){
  const img=el || activeImg(), st=$('#vStage');
  // 转 90/270 度时宽高互换，否则"适配"会算错导致转完溢出屏幕
  const swap = (vRotMod() % 180) !== 0;
  const nw = swap ? (img.naturalHeight||1) : (img.naturalWidth||1);
  const nh = swap ? (img.naturalWidth||1) : (img.naturalHeight||1);
  /* 只按窗口适配，不再「最多 1:1」：
     云端给的 large 缩略图可能远小于原图（实测 1440×1508 只给 720×754），
     如果小图在原尺寸就停住，预览（按原图算）和大图（按自身算）尺寸对不上，
     就会先大后小地跳。统一按窗口适配，两者用同一个框，直接替换不跳。 */
  return Math.min(st.clientWidth/nw, st.clientHeight/nh);
}
function fittedSize(){
  const img=activeImg(), b=baseScale();
  return [img.naturalWidth*b*VP.scale, img.naturalHeight*b*VP.scale];
}
function clampPan(){
  const st=$('#vStage');
  /* 缩到「适应窗口」时没有可拖动的余量，必须回正中心。
     之前这里还留了 ±30px 的平移余量，放大后从鼠标位置缩回 1x，
     y 会停在某个偏移量；再点「默认/还原」把 y 归零，画面就上下跳。 */
  if(VP.scale <= 1.001){ VP.x=0; VP.y=0; return; }
  const [w,h]=fittedSize();
  const mx=Math.max(0,(w-st.clientWidth)/2 + 30);
  const my=Math.max(0,(h-st.clientHeight)/2 + 30);
  VP.x=Math.min(mx, Math.max(-mx, VP.x));
  VP.y=Math.min(my, Math.max(-my, VP.y));
}
function applyVP(){
  const img=activeImg(), b=baseScale();
  img.style.transform = `translate(${VP.x}px, ${VP.y}px) scale(${(b*VP.scale).toFixed(4)}) rotate(${vRotAbs}deg)`;
  applyVideoRot();
  // 百分比按「相对适配」显示：换原图时分辨率变了，这个数字才不跟着跳（画面本来就没变）
  $('#vPct').textContent = Math.round(VP.scale*100) + '%';
  const zoomed = VP.scale > 1.001;
  img.style.cursor = zoomed ? 'grab' : 'default';
  // 放大后拖动是平移，所以关掉浏览器原生的「拖图片」
  img.draggable = !zoomed;
  $('#vStage').classList.toggle('zoomed', zoomed);
}
function applyVideoRot(){
  const vid = document.getElementById('viewerVideo');
  if(!vid || !vid.videoWidth) return;
  const st = $('#vStage');
  const deg = vRotMod();
  if(deg % 180 === 0){ vid.style.transform = deg ? `rotate(${deg}deg)` : ''; return; }
  // 90/270：先转再按"转完的外接框"缩到能放下
  const vw = vid.videoWidth, vh = vid.videoHeight;
  const k = Math.min(1, Math.min(st.clientWidth / vh, st.clientHeight / vw) /
                        Math.min(st.clientWidth / vw, st.clientHeight / vh));
  vid.style.transform = `rotate(${deg}deg) scale(${k.toFixed(3)})`;
}
function resetVP(){ VP.x=0; VP.y=0; VP.scale=1; applyVP(); }
function zoomTo(ns, cx, cy){
  const rect=$('#vStage').getBoundingClientRect();
  ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, ns));
  if(Math.abs(ns - VP.scale) < 1e-4) return;
  const px=(cx==null?rect.width/2:cx)-rect.width/2;
  const py=(cy==null?rect.height/2:cy)-rect.height/2;
  const k=ns/VP.scale;
  VP.x = px - (px - VP.x)*k;
  VP.y = py - (py - VP.y)*k;
  VP.scale = ns;
  clampPan(); applyVP();
}
function zoomBy(f, cx, cy){ zoomTo(VP.scale*f, cx, cy); }

/* 把 EXIF 的 "度/1, 分/1, 秒/1e7" 转成十进制度 */
function dms2deg(s){
  if(s == null) return null;
  const parts = String(s).split(',').map(v => {
    const a = v.split('/');
    const num = Number(a[0]), den = a.length > 1 ? Number(a[1]) : 1;
    return den ? num / den : num;
  });
  if(parts.length < 3) return null;
  return parts[0] + parts[1] / 60 + parts[2] / 3600;
}

/* 1/3349s 这种快门显示 */
function fmtShutter(t){
  const v = Number(t);
  if(!v) return null;
  return v >= 1 ? (v.toFixed(1) + 's') : ('1/' + Math.round(1 / v) + 's');
}

/* 预览器「详情」面板：成像参数 + 拍摄地点 */
function showInfoPanel(it){
  const p = $('#vInfoPanel');
  if(!p || !it) return;
  if(p.classList.contains('on')){ p.classList.remove('on'); return; }
  const img = $('#viewerImg');
  const isVid = it.type === 'video';
  const ex = it.exif || {};
  const dims = (ex.imageWidth && ex.imageLength)
    ? (ex.imageWidth + '×' + ex.imageLength)
    : ((!isVid && img && img.naturalWidth) ? (img.naturalWidth + '×' + img.naturalHeight) : null);
  const when = ex.dateTime
    ? String(ex.dateTime).replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1-$2-$3')
    : (it.date ? new Date(it.date).toLocaleString('zh-CN', {hour12:false}) : null);
  const lat = dms2deg(ex.GPSLatitude), lon = dms2deg(ex.GPSLongitude);
  const hasGPS = lat != null && lon != null;
  const latS = hasGPS ? (Math.abs(lat).toFixed(6) + '° ' + (ex.GPSLatitudeRef || (lat >= 0 ? 'N' : 'S'))) : null;
  const lonS = hasGPS ? (Math.abs(lon).toFixed(6) + '° ' + (ex.GPSLongitudeRef || (lon >= 0 ? 'E' : 'W'))) : null;
  const focal = ex.focalLength
    ? (() => { const a = String(ex.focalLength).split('/');
               const v = Number(a[1]) ? Number(a[0]) / Number(a[1]) : Number(a[0]);
               return v ? v.toFixed(1) + 'mm' : null; })()
    : null;

  const rows = [
    ['名称', it.name || '—'],
    ['类型', isVid ? '视频' : '图片'],
    ['大小', it.size ? fmtSize(it.size) : null],
    ['时间', when],
    ['尺寸', dims],
    ['设备', [ex.make, ex.model].filter(Boolean).join(' ') || null],
    ['光圈', ex.FNumber ? ('f/' + ex.FNumber) : null],
    ['快门', fmtShutter(ex.exposureTime)],
    ['焦距', focal],
    // 位置：优先用小米后端已经算好的 geoAddr（少数老照片有），否则异步查一次
    ['位置', it.geoAddr || (hasGPS ? '查询中 …' : '这张没有记录位置')],
    ['坐标', hasGPS ? (latS + ', ' + lonS) : null],
    ['加密', it.enc ? '端到端加密' : '未加密'],
    ['云端 ID', it.id || null],
  ].filter(r => r[1] != null && r[1] !== '');

  p.innerHTML = `<div class="ihd"><b>详情</b><button id="viClose" title="关闭">${ICO('i-close')}</button></div>
    <div class="ibody">${rows.map(r => `<div class="irow"><span class="ik">${r[0]}</span><span class="iv">${esc(String(r[1]))}</span></div>`).join('')}</div>
    ${hasGPS ? `<div class="ifoot"><a class="btn sm outline" style="width:100%;text-decoration:none;justify-content:center" target="_blank" rel="noreferrer" href="https://uri.amap.com/marker?position=${lon.toFixed(6)},${lat.toFixed(6)}&name=${encodeURIComponent(it.name || '照片位置')}">在高德地图中查看</a></div>` : ''}
    <div class="ifoot"><button class="btn sm outline" id="viCopy" style="width:100%">复制这些信息</button></div>`;
  p.classList.add('on');
  // 没有现成地址就去查一次；后端按坐标做了磁盘缓存，第二次打开秒回
  if(hasGPS && !it.geoAddr){
    const myId = it.id;
    fetch('/api/reverse_geo?lat=' + lat.toFixed(6) + '&lon=' + lon.toFixed(6))
      .then(r => r.json())
      .then(d => {
        if(!d || !d.address) return;
        it.geoAddr = d.address;
        if(!p.classList.contains('on')) return;
        if(vCurrent && String(vCurrent.id) !== String(myId)) return;
        p.querySelectorAll('.irow').forEach(row => {
          const k = row.querySelector('.ik');
          if(k && k.textContent === '位置'){
            const v = row.querySelector('.iv');
            if(v) v.textContent = d.address;
          }
        });
      })
      .catch(()=>{});
  }
  $('#viClose').onclick = () => p.classList.remove('on');
  $('#viCopy').onclick = async () => {
    const ok = await copyText(rows.map(r => r[0] + '：' + r[1]).join('\n'));
    toast(ok ? '已复制' : '复制失败');
  };
}

/* 从缩略图所在位置/大小，展开到全屏"适配"尺寸（FLIP）。返回 true 表示已经接管动画 */
function flipFrom(img, rect){
  const st = $('#vStage');
  const sr = st.getBoundingClientRect();
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if(!nw || !nh || !sr.width || !rect || !rect.width) return false;
  const fit = baseScale();
  if(!fit) return false;
  const s0 = Math.min(rect.width / nw, rect.height / nh);
  const cx = sr.left + sr.width / 2, cy = sr.top + sr.height / 2;
  const tx = (rect.left + rect.width / 2) - cx;
  const ty = (rect.top + rect.height / 2) - cy;
  img.style.transition = 'none';
  img.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${s0.toFixed(5)})`;
  img.style.opacity = '1';
  void img.offsetWidth;                       // 先让起始帧生效
  img.style.transition = 'transform .40s cubic-bezier(.22,.61,.36,1)';
  requestAnimationFrame(() => { VP.x = 0; VP.y = 0; VP.scale = 1; applyVP(); });
  setTimeout(() => { img.style.transition = ''; }, 460);
  return true;
}

function showVideoPoster(it){
  const p = $('#vPoster'); if(!p) return;
  const src = (it && (it.bigUrl || it.thumbUrl)) || '';
  if(!src){ p.classList.remove('on'); p.removeAttribute('src'); return; }
  p.src = src;
  p.classList.add('on');
}
function hideVideoPoster(){
  const p = $('#vPoster'); if(p){ p.classList.remove('on'); p.removeAttribute('src'); }
}
/* 预览框尺寸：按原图宽高算，和最终大图用同一条「适配窗口」公式。
   上一张放大过的话，新图沿用同一个缩放倍率，预览也要乘上去。 */
function sizeImagePreview(w, h, zoom){
  const pv = $('#vPreview'); if(!pv || !(w > 0 && h > 0)) return;
  const st = $('#vStage');
  // 和 baseScale 保持同一条公式（含不封顶的放大），两边的框才会完全重合
  const b = Math.min(st.clientWidth / w, st.clientHeight / h) * (zoom || 1);
  pv.style.width = Math.max(1, Math.round(w * b)) + 'px';
  pv.style.height = Math.max(1, Math.round(h * b)) + 'px';
}
/* 打开时立刻把缩略图摆到「最终大图会占的框」里：框按原图宽高和窗口适配算，
   大图加载完直接在同一位置替换，中间不出现满屏模糊、也不会有大小变化。
   原图宽高缺失时，退回用缩略图自身的宽高。 */
function showImagePreview(it, zoom){
  const pv = $('#vPreview'); if(!pv) return;
  const src = it.thumbUrl || it.thumb || '';
  if(!src){ pv.classList.remove('on'); return; }
  const ex = it.exif || {};
  let ew = +ex.imageWidth || 0, eh = +ex.imageLength || 0;
  const ori = +ex.orientation || 1;
  if(ori >= 5 && ori <= 8 && ew > 0 && eh > 0){ const t = ew; ew = eh; eh = t; }
  pv.src = src;
  if(ew > 0 && eh > 0){
    sizeImagePreview(ew, eh, zoom);
  }else{
    const im = new Image();
    im.onload = () => {
      // 期间可能已经换了照片，别拿旧尺寸改新框
      if(vCurrent !== it) return;
      sizeImagePreview(im.naturalWidth, im.naturalHeight, zoom);
    };
    im.src = src;
    if(im.complete && im.naturalWidth) sizeImagePreview(im.naturalWidth, im.naturalHeight, zoom);
  }
  pv.classList.add('on');
}
function hideImagePreview(){
  const pv = $('#vPreview');
  if(pv){ pv.classList.remove('on'); pv.removeAttribute('src'); }
}

function openViewer(it, opts){
  if(!it) return;
  const seq = ++vLoadSeq;
  const o = opts || {};
  /* 不做「从卡片飞出来」的动画：缩略图先垫底，大图好了直接换 */
  const fromEl = null;
  const dir = o.dir || 0;
  const ip = $('#vInfoPanel');
  if(ip) ip.classList.remove('on');
  const vi = $('#vInfo');
  if(vi) vi.onclick = () => showInfoPanel(vCurrent);
  const first = !vCurrent;
  vCurrent=it;
  vRotAbs = 0;
  const rBtn = document.getElementById('vReset'); if(rBtn) rBtn.textContent = '默认';
  // 原图已经在本地缓存里的话，打开就直接出原图（不然同一张图每次都要再点一次「查看原图」）
  vLoadedFull = !!(it.fullUrl && it.fullCached);
  vIsVideo = it.type==='video'; vDragged=false;
  $('#vName').textContent = it.name || '';
  showMeta(it);
  $('#viewer').style.display='flex';
  const vEl = $('#viewer');
  vEl.classList.add('opening');
  setTimeout(() => vEl.classList.remove('opening'), 320);
  $('#viewerLoading').style.display='none';
  const vchip = $('#vChip');   // 不再弹「加载中」小条：缩略图垫底就够了
  $('#vCopy').style.display='';
  $('#vFull').style.display='none';
  $('#vZoom').style.display='';
  $('#vTip').style.display='';
  updateNav();
  const img=$('#viewerImg'), vid=$('#viewerVideo');
  if(vIsVideo){
    img.style.display='none'; img.removeAttribute('src');
    vid.onerror = null; vid.dataset.fb = '';
    vid.controls = false;                       // 还没能播之前别显示原生控件（就是那块"狗页面"）
    vid.style.display='none';
    $('#vZoom').style.display='none';
    $('#vTip').textContent='';
    if(vchip) vchip.classList.remove('on');
    hideImagePreview();
    showVideoPoster(it);
    if(it.driveFile){ startDriveVideo(it); return; }
    startVideo(it);
    return;
  }
  vid.pause(); vid.style.display='none'; vid.removeAttribute('src'); vid.load();
  hideVideoPoster();
      const bImg=document.getElementById('viewerImgB');
    if(bImg){ bImg.style.display='none'; bImg.removeAttribute('src'); bImg.style.transform=''; }
    const aImg=document.getElementById('viewerImg');
    if(aImg){ aImg.style.display=''; aImg.style.transform=''; }
    vImgEl = aImg;
  if(vPoll){ clearInterval(vPoll); vPoll=null; }
  const st = $('#vStage');
  // 切换时把旧图先垫成背景；新图的缩略图按「原图最终尺寸」摆在中间
  if(!first && img.src){
    st.style.backgroundImage = 'url("' + img.src + '")';
  } else {
    st.style.backgroundImage = '';
  }
  // 换图不再"先透明再淡入"（那样必闪一下），而是先解码好再换 src；
  // 缩放倍率沿用上一张，只有第一张才回到"适配窗口"，避免来回跳。
  const prevK = (first || !(VP.scale > 0)) ? 1 : VP.scale;
  /* 预览框立刻画出来：按原图宽高算、和窗口适配，和大图最终占的框完全一致 */
  showImagePreview(it, prevK);
  const src = vLoadedFull ? it.fullUrl : (it.bigUrl || it.thumbUrl || '');
  const srcAbs = src ? new URL(src, location.href).href : '';
  vImgEl = img;
  const bImg0 = document.getElementById('viewerImgB');
  if(bImg0){ bImg0.style.display='none'; bImg0.removeAttribute('src'); bImg0.style.transform=''; }
  img.style.display='';
  /* 大图没就绪之前先藏起来，只显示底下那张缩略图；
     就绪后算好缩放再一次性显示，避免先按原图尺寸闪一下再缩回去（会「跳」） */
  img.style.transition = 'none';
  img.style.opacity = '0';
  img.onload = () => {
    // 上一张的下载在这里姗姗来迟（img.src 还是旧地址）就丢掉，不能拿它冒充这一张
    if(seq !== vLoadSeq || img.src !== srcAbs) return;
    if(vchip) vchip.classList.remove('on');
    hideImagePreview();
    showMeta(it, img.naturalWidth ? `${img.naturalWidth}×${img.naturalHeight}` : '');
    VP.x = 0; VP.y = 0; VP.scale = prevK;
    applyVP();
    img.style.opacity = '1';
    st.style.backgroundImage = '';
    requestAnimationFrame(() => { img.style.transition = ''; });
  };
  img.onerror = () => {
    if(seq !== vLoadSeq || img.src !== srcAbs) return;
    if(vchip) vchip.classList.remove('on');
    hideImagePreview();
  };
  const pre = new Image();
  const swap = () => { img.src = src; };
  pre.onload = () => {
    if(seq !== vLoadSeq) return;   // 已经换到别的照片了，这份预载作废
    try { pre.decode().then(swap).catch(swap); } catch(e){ swap(); }
  };
  pre.onerror = () => { if(seq === vLoadSeq) swap(); };
  pre.src = src;
  VP.x = 0; VP.y = 0; VP.scale = prevK;
  applyVP();
  const b=$('#vFull');
  b.style.display = it.fullUrl ? '' : 'none';
  b.disabled=false; b.textContent = vLoadedFull ? '已是原图' : '查看原图';
}

/* 找到这张照片在相册里的缩略图卡片（虚拟滚动下可能不在 DOM 里） */
function cardOfItem(it){
  if(!it) return null;
  const key = String(it.id);
  const cards = $$('#content .card');
  for(let i=0;i<cards.length;i++) if(cards[i].dataset.key === key) return cards[i];
  return null;
}
function cardVisibleInContent(card){
  const box = $('#content');
  if(!box) return false;
  const r = card.getBoundingClientRect(), br = box.getBoundingClientRect();
  return r.bottom > br.top + 6 && r.top < br.bottom - 6 && r.right > br.left + 2 && r.left < br.right - 2;
}

function closeViewer(){
  const v = $('#viewer');
  if(!v || v.style.display === 'none') return;
  if(v.classList.contains('closing')) return;
  vLoadSeq++;   // 关上以后，还在路上的加载回调一律作废
  const chip = $('#vChip'); if(chip) chip.classList.remove('on');
  hideVideoPoster();
  hideImagePreview();
  const img = activeImg();
  const canAnim = !!(img && !vIsVideo && img.naturalWidth && img.style.display !== 'none');
  let flyingBack = false;
  if(canAnim){
    /* 关闭：优先飞回相册里那张缩略图；缩略图已经滚出视野，就原地收一档再淡出 */
    const card = cardOfItem(vCurrent);
    if(card && cardVisibleInContent(card)){
      const sr = $('#vStage').getBoundingClientRect();
      const r = card.getBoundingClientRect();
      const nw = img.naturalWidth, nh = img.naturalHeight;
      if(nw && nh){
        const s = Math.min(r.width / nw, r.height / nh);
        const tx = (r.left + r.width / 2) - (sr.left + sr.width / 2);
        const ty = (r.top + r.height / 2) - (sr.top + sr.height / 2);
        img.style.transition = 'transform .42s var(--ease-out), opacity .42s ease-out';
        img.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${s.toFixed(5)}) rotate(0deg)`;
        flyingBack = true;
      }
    }
    if(!flyingBack){
      const b = baseScale();
      img.style.transition = 'transform .50s cubic-bezier(.4,0,.2,1), opacity .42s ease-out';
      img.style.transform = `translate(${VP.x.toFixed(1)}px, ${VP.y.toFixed(1)}px) scale(${(b*VP.scale*0.97).toFixed(4)}) rotate(${vRotAbs}deg)`;
      img.style.opacity = '0';
    }
  }
  v.classList.add('closing');
  setTimeout(() => {
    v.style.display = 'none';
    v.classList.remove('closing');
    const st = $('#vStage');
    if(st) st.style.backgroundImage = '';
    img.style.transition = '';
    img.style.transform = '';
    img.style.opacity = '1';
    const aImg = document.getElementById('viewerImg');
    const bImg = document.getElementById('viewerImgB');
    if(aImg){ aImg.style.display=''; aImg.style.transform=''; aImg.style.opacity='1'; aImg.removeAttribute('src'); }
    if(bImg){ bImg.style.display='none'; bImg.style.transform=''; bImg.removeAttribute('src'); }
    vImgEl = aImg;
  }, canAnim ? 500 : 320);
  const vid=$('#viewerVideo'); vid.pause(); vid.removeAttribute('src'); vid.load();
  if(vPoll){ clearInterval(vPoll); vPoll=null; }
  vCurrent=null;
}

/* ---- 视频 ---- */
async function startVideo(it){
  const vid=$('#viewerVideo');
  const bar=$('#videoBar'), txt=$('#videoBarText'), track=$('#videoBarTrack'),
        fill=$('#videoBarFill'), cancel=$('#videoBarCancel');
  bar.style.display='flex';
  txt.textContent='取原片中 …';
  track.style.display=''; fill.style.width='0%';
  cancel.style.display=''; cancel.textContent='取消';
  const total = it.size || 0;
  const paint = (st) => {
    const got = (st && st.got) ? st.got : 0;
    const pct = (st && st.pct != null) ? st.pct : (total ? Math.round(got*100/total) : 0);
    fill.style.width = pct + '%';
    txt.textContent = total ? `取原片 ${fmtSize(got)} / ${fmtSize(total)}` : '取原片中 …';
  };
  paint({got:0, pct:0});
  cancel.onclick = () => {
    if(vPoll){ clearInterval(vPoll); vPoll=null; }
    api('/api/video_cancel?id='+encodeURIComponent(it.id)).catch(()=>{});
    bar.style.display='none';
    closeViewer();
    toast('已取消');
  };
  const load = async () => {
    try{
      const st = await api('/api/video_start?id='+encodeURIComponent(it.id));
      if(st.state==='ready'){
        vid.controls = true;
        // 有些 H.265 原片 WebView2 直接解码失败，报错就自动转 720p H.264
        vid.onerror = () => {
          if(vid.dataset.fb === String(it.id)) return;
          vid.dataset.fb = String(it.id);
          startVideoFallback(it);
        };
        vid.src = '/api/video?id='+encodeURIComponent(it.id);
        hideVideoPoster();
        vid.style.display='block';
        track.style.display='none';
        txt.textContent='已就绪';
        cancel.style.display='none';
        setTimeout(()=>{ bar.style.display='none'; }, 900);
        vid.onloadedmetadata = () => { if(vid.videoWidth) showMeta(it, `${vid.videoWidth}×${vid.videoHeight}`); };
        vid.play().catch(()=>{});
        if(vPoll){ clearInterval(vPoll); vPoll=null; }
        return true;
      }
      if(st.state==='error'){
        txt.textContent = '原片取不到：' + (st.err || '未知错误');
        track.style.display='none';
        cancel.textContent='关闭';
        cancel.onclick = () => { bar.style.display='none'; };
        if(vPoll){ clearInterval(vPoll); vPoll=null; }
        return true;
      }
      if(st.state==='running') paint(st);
    }catch(e){ if(String(e.message)==='auth') return true; }
    return false;
  };
  if(await load()) return;
  if(vPoll) clearInterval(vPoll);
  vPoll = setInterval(async ()=>{ if(await load()){ clearInterval(vPoll); vPoll=null; } }, 600);
}

/* 原片编码解不了时的兜底：让后端转 720p H.264，进度走底部细条 */
async function startVideoFallback(it){
  const vid=$('#viewerVideo');
  const bar=$('#videoBar'), txt=$('#videoBarText'), track=$('#videoBarTrack'),
        fill=$('#videoBarFill'), cancel=$('#videoBarCancel');
  bar.style.display='flex';
  txt.textContent='编码不兼容，转播放版 …';
  track.style.display=''; fill.style.width='0%';
  cancel.style.display=''; cancel.textContent='取消';
  let stopped=false;
  cancel.onclick = () => { stopped=true; bar.style.display='none'; closeViewer(); };
  try{ await api('/api/video_play_start?id='+encodeURIComponent(it.id)); }catch(e){}
  const tick = async () => {
    if(stopped) return true;
    let st;
    try{ st = await api('/api/video_play_state?id='+encodeURIComponent(it.id)); }
    catch(e){ return false; }
    if(st.state==='ready'){
      vid.onerror = null;
      vid.src = '/api/video_play?id='+encodeURIComponent(it.id);
      vid.controls = true;
      hideVideoPoster();
      vid.style.display='block';
      track.style.display='none';
      txt.textContent='转好了，开始播放';
      cancel.style.display='none';
      setTimeout(()=>{ bar.style.display='none'; }, 900);
      vid.play().catch(()=>{});
      return true;
    }
    if(st.state==='error'){
      txt.textContent='转播放版失败：'+(st.err||'未知错误');
      track.style.display='none';
      cancel.textContent='关闭';
      cancel.onclick = () => { bar.style.display='none'; };
      return true;
    }
    const pct = st.pct || 0;
    fill.style.width = pct + '%';
    txt.textContent = (st.msg ? st.msg + ' · ' : '') + pct + '%';
    return false;
  };
  if(await tick()) return;
  const tm = setInterval(async () => { if(await tick()) clearInterval(tm); }, 1000);
}

(function bindPan(){
  const stage=$('#vStage');
  let dragging=false, sx=0, sy=0, ox=0, oy=0, moved=0;
  stage.addEventListener('pointerdown', e=>{
    if(vIsVideo || e.button !== 0) return;
    if(e.target.closest('.zoom') || e.target.closest('.nav')) return;
    dragging=true; moved=0; sx=e.clientX; sy=e.clientY; ox=VP.x; oy=VP.y;
    vDragged=false;
    stage.classList.add('drag');
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  });
  stage.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    moved = Math.max(moved, Math.abs(dx)+Math.abs(dy));
    if(VP.scale <= 1.001) return;          // 没放大就没有可平移的
    VP.x = ox + dx;
    VP.y = oy + dy;
    clampPan(); applyVP();
    if(moved > 4) vDragged=true;
  });
  const end = () => {
    if(!dragging) return;
    dragging=false; stage.classList.remove('drag');
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  // 点图片/空白都不再关预览（用户要求：看的时候点一下就退出太烦）。
  // 退出只有三种：右上角 ×、Esc、两侧翻页到头后的返回。
})();
