async function doDownload(){
  if(!sel.size) return toast('先勾选要下载的项目');
  if(TAB==='gallery'){
    const picked = state.items.filter(x=>sel.has(x.id));
    const jobs=[];
    const img = picked.filter(x=>x.type!=='video');
    const vid = picked.filter(x=>x.type==='video');
    if(img.length) jobs.push(await postJob('image', img));
    if(vid.length) jobs.push(await postJob('video', vid));
    watchJobs(jobs);
  } else if(TAB==='record'){
    watchJobs([await postJob('record', state.records.filter(x=>sel.has(x.id)))]);
  } else if(TAB==='drive'){
    watchJobs([await postJob('drive', state.driveItems.filter(x=>sel.has(x.id) && !x.isFolder))]);
  }
}

async function postJob(kind, items){
  if(!items.length) return null;
  const r = await api('/api/download', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({kind, items: items.map(x=>({id:x.id, name:x.name}))})
  });
  return r.job || null;
}

async function watchJobs(ids){
  ids = ids.filter(Boolean);
  if(!ids.length) return;
  const bar=$('#dlbar'); bar.style.display='block';
  bar.innerHTML='<b>准备开始下载 …</b>';
  const timer=setInterval(async ()=>{
    let d;
    try{ d = await api('/api/downloads'); }catch(e){ return; }
    const mine=(d.jobs||[]).filter(j=>ids.includes(j.id));
    if(!mine.length) return;
    bar.innerHTML = mine.map(j=>{
      const pct = j.total ? Math.round(j.done/j.total*100) : 0;
      const head = j.state==='done' ? (j.errors.length?'已完成（部分失败）':'下载完成')
                 : j.state==='login' ? '登录过期，已暂停' : '正在下载';
      return `<div><b>${head}</b> · ${j.done}/${j.total}（${pct}%）
        <div style="color:var(--dim2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${esc(j.current||'')}</div>
        ${j.errors.length?`<div style="color:var(--warn);margin-top:4px">失败 ${j.errors.length} 项：${esc(j.errors[0])}</div>`:''}
        ${j.state==='done'?`<div class="p">已保存到：${esc(j.dir)}</div>`:''}</div>`;
    }).join('<hr style="border:none;border-top:1px solid var(--line);margin:10px 0 0">');
    if(mine.every(j=>j.state==='done'||j.state==='login')){
      clearInterval(timer);
      setTimeout(()=>{ bar.style.display='none'; }, 10000);
    }
  }, 900);
}

/* ============ 上传 ============ */
const GAL_EXT = new Set(['png','jpg','bmp','jpeg','gif','jpe','raw',
                         'mov','mp4','heic','heif','avci']);
const VID_EXT = new Set(['mov','mp4']);
const GAL_MAX_IMG = 100*1024*1024, GAL_MAX_ALL = 4*1024*1024*1024;
let upSeq = 0;

function uploadTarget(){
  if(TAB==='gallery'){
    if(state.trashView) return null;                 // 最近删除里不能上传
    const a = state.album;
    // 全部照片不是真实相簿：默认传到「相机」，和官方客户端一致
    if(!a || a === '0') return {kind:'gallery', target:'1'};
    if(a === '1000') return {kind:'gallery', target:'1000', private:true};
    return {kind:'gallery', target:a};
  }
  if(TAB==='drive') return {kind:'drive', target:state.parent || '0'};
  return null;
}

function extOf(name){
  const i = String(name||'').lastIndexOf('.');
  return i<0 ? '' : name.slice(i+1).toLowerCase();
}

/* 把一个 File 用 PUT 直传到本地服务，服务端边收边写盘 */
const activeXhr = new Set();                 // 正在传的 XHR，点「停止」时一起 abort

function sendFile(file, kind, target, silent, onProg){
  return new Promise((resolve, reject)=>{
    const xhr = new XMLHttpRequest();
    activeXhr.add(xhr);
    xhr.onloadend = () => activeXhr.delete(xhr);
    const q = `kind=${encodeURIComponent(kind)}&target=${encodeURIComponent(target)}`
            + `&name=${encodeURIComponent(file.name)}`;
    xhr.open('PUT', '/api/upload_raw?' + q);
    xhr.upload.onprogress = e => {
      if(e.lengthComputable){
        if(onProg) onProg(e.loaded, e.total);
        else if(!silent) uploadBarTransfer(e.loaded, e.total, file.name);
      }
    };
    xhr.onload = () => {
      let j = {};
      try{ j = JSON.parse(xhr.responseText||'{}'); }catch(_){}
      if(xhr.status===200 && j.job) resolve(j);
      else reject(new Error(j.msg || j.error || ('HTTP '+xhr.status)));
    };
    xhr.onerror = () => reject(new Error('传输中断'));
    xhr.onabort = () => reject(new Error('cancelled'));
    xhr.send(file);
  });
}

/* override：指定落点。拖到文件夹上时会传 {kind, target, name}；
   不传就用当前目录 / 当前相簿。 */
async function uploadFiles(fileList, override){
  const t = override || uploadTarget();
  if(!t){
    toast(TAB==='gallery' ? '先选一本相簿再拖文件进来' : '这个页面不支持上传');
    return;
  }
  let files = [...fileList].filter(f => f && f.size >= 0);
  if(!files.length) return;

  const bad = [], tooBig = [];
  if(t.kind === 'gallery'){
    files = files.filter(f=>{
      const e = extOf(f.name);
      if(!GAL_EXT.has(e)){ bad.push(f.name); return false; }
      if(t.private && VID_EXT.has(e)){ bad.push(f.name + '（私密相册不能放视频）'); return false; }
      if(!VID_EXT.has(e) && f.size > GAL_MAX_IMG){ tooBig.push(f.name); return false; }
      if(f.size > GAL_MAX_ALL){ tooBig.push(f.name); return false; }
      return true;
    });
  } else {
    files = files.filter(f=>{
      if(f.size > GAL_MAX_ALL){ tooBig.push(f.name); return false; }
      return true;
    });
  }
  if(bad.length) toast('跳过不支持的格式：' + bad.slice(0,3).join('、') + (bad.length>3?' …':''));
  if(tooBig.length) toast('超过大小上限：' + tooBig.slice(0,2).join('、'));
  if(!files.length) return;

  const bar = $('#dlbar');
  bar.style.display = 'block';
  const dest = (t.kind === 'drive' && t.name) ? ` → ${esc(t.name)}` : '';
  const total = files.length;
  let finished = 0, failed = 0, cancelled = false;
  let doneBytes = 0;
  const totalBytes = files.reduce((n, f) => n + (f.size || 0), 0);
  const jobs = [];
  const queue = files.slice();

  const paint = cur => {
    const p = bar.querySelector('.pb i');
    if(p) p.style.width = Math.round(totalBytes ? doneBytes / totalBytes * 100
                                                : finished / total * 100) + '%';
    const lbl = bar.querySelector('#upName');
    if(lbl) lbl.textContent = cancelled
      ? `正在停止 · 未开始 ${queue.length} 个`
      : `正在传第 ${Math.min(finished + 1, total)} / ${total} 个${cur ? ' · ' + cur : ''}`;
    const pct = bar.querySelector('#upPct');
    if(pct) pct.textContent = `${finished} / ${total} 完成${failed ? ` · ${failed} 个失败` : ''}`;
  };

  bar.innerHTML = `<b>正在上传 ${total} 个文件${dest}</b>
    <div id="upName" style="color:var(--dim2);margin-top:4px"></div>
    <div class="pb"><i style="width:0"></i></div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:2px">
      <div style="color:var(--dim2);font-size:11.5px" id="upPct">0 / ${total} 完成</div>
      <span style="flex:1"></span>
      <button class="btn xs ghost" id="upCancel">停止</button>
    </div>`;
  const cancelBtn = bar.querySelector('#upCancel');
  if(cancelBtn) cancelBtn.onclick = () => {
    cancelled = true;
    cancelBtn.disabled = true; cancelBtn.textContent = '正在停止 …';
    activeXhr.forEach(x => { try{ x.abort(); }catch(_){} });  // 正在传的立即断
    paint();
  };

  async function worker(){
    while(!cancelled){
      const f = queue.shift();
      if(!f) return;
      let err = null;
      for(let attempt = 0; attempt < 2; attempt++){
        const base = doneBytes;                 // 重试时从这里重新累计，进度不会虚高
        try{
          paint(f.name);
          const j = await sendFile(f, t.kind, t.target, true,
            n => { doneBytes = base + n; paint(f.name); });
          doneBytes = base + (f.size || 0);
          if(j && j.job) jobs.push(j.job);
          err = null;
          break;
        }catch(e){
          doneBytes = base;
          if(String((e && e.message) || '') === 'cancelled'){ err = null; break; }
          err = e;
          if(attempt === 0) await new Promise(r => setTimeout(r, 500));
        }
      }
      if(err){
        failed++;
        toast('上传失败：' + (err.message || '未知错误'), {type:'err'});
      }
      finished++;
      paint();
    }
  }
  /* 2 路并发：比原来一个个排队快一倍，又不会把本地服务和网络打满 */
  await Promise.all([worker(), worker()]);
  if(cancelled && queue.length){
    toast(`已停止：还有 ${queue.length} 个文件未开始`, {type:'busy'});
  }
  paint();
  if(!queue.length && !cancelled) setTimeout(() => { bar.style.display = 'none'; }, 9000);
  if(jobs.length) watchUploads(jobs);
  if(t.kind === 'gallery' && jobs.length) setTimeout(()=>{ if(TAB==='gallery') loadAlbum(state.album, {fresh:true}); }, 2500);
  // 只有传到「当前这一层」才需要刷新列表；传进子文件夹时当前列表没变化
  if(t.kind === 'drive' && jobs.length
     && (t.target || '0') === (state.parent || '0')){
    setTimeout(()=>{ if(TAB==='drive') driveOpen(state.parent, state.trail); }, 2500);
  }
}

async function watchUploads(ids){
  ids = ids.filter(Boolean);
  if(!ids.length) return;
  const bar = $('#dlbar'); bar.style.display = 'block';
  const timer = setInterval(async ()=>{
    let d;
    try{ d = await api('/api/upload_progress'); }catch(e){ return; }
    const mine = (d.jobs||[]).filter(j=>ids.includes(j.id));
    if(!mine.length) return;
    bar.innerHTML = mine.map(j=>{
      const okN = j.items.filter(x=>x.state==='done').length;
      const badN = j.items.filter(x=>x.state==='error').length;
      const pct = j.fileTotal ? Math.round(j.fileBytes/j.fileTotal*100) : 0;
      const head = j.state==='done' ? (badN ? `完成（${badN} 个失败）` : '全部上传完成')
                 : j.state==='login' ? '登录过期，已暂停' : '正在上传';
      const cur = j.items.find(x=>x.state==='running');
      return `<div><b>${head}</b> · ${okN}/${j.total}
        <div class="pb"><i style="width:${pct}%"></i></div>
        <div style="color:var(--dim2);margin-top:3px;font-size:11.5px">
          ${esc(j.phase||'')}${cur?' · '+esc(cur.name):''}${j.fileTotal?' · '+pct+'%':''}</div>
        ${badN?`<div style="color:var(--warn);margin-top:4px;font-size:11.5px">
          失败：${esc((j.items.find(x=>x.state==='error')||{}).error||'')}</div>`:''}</div>`;
    }).join('<hr style="border:none;border-top:1px solid var(--line);margin:10px 0 0">');
    if(mine.every(j=>j.state==='done'||j.state==='login')){
      clearInterval(timer);
      const ok = mine.reduce((n,j)=>n+j.items.filter(x=>x.state==='done').length,0);
      if(ok) toast(`已上传 ${ok} 个文件`);
      setTimeout(()=>{ bar.style.display='none'; }, 9000);
    }
  }, 800);
}

/* 整个窗口拖入文件 */
/* ============ 拖拽上传 ============
   两种落点：
     · 拖到空白处   → 上传到当前目录（云盘）/ 当前相簿（相册）
     · 拖到文件夹上 → 上传进那个文件夹（由 bindDrive 里的监听处理）
*/
const dropUI = { depth: 0 };

function currentDropTarget(){
  const t = uploadTarget();
  if(!t) return null;
  if(t.kind === 'gallery'){
    const alb = (state.albums||[]).find(a=>a.id===state.album);
    return { kind:'gallery', target:t.target, private:t.private,
             title:'松手添加到相簿',
             hint:'支持图片（png/jpg/heic/gif…）与视频（mp4/mov），单图 ≤100MB',
             where: alb ? '目标相簿：' + (alb.name||'') : '' };
  }
  const cur = state.trail && state.trail.length
    ? state.trail[state.trail.length-1].name : '全部文件';
  return { kind:'drive', target: state.parent || '0',
           title:'松手上传到云盘',
           hint:'任意文件，单个 ≤4GB；全部走端到端加密',
           where:'目标位置：' + cur };
}

/* kind：'folder' 表示鼠标正悬停在一个文件夹上，folder 带 {id,name} */
function showDropMask(kind, folder){
  const t = currentDropTarget();
  if(!t) return;
  const mask = $('#dropMask');
  if(kind === 'folder' && folder && t.kind === 'drive'){
    $('#dropTitle').textContent = '松手放进文件夹';
    $('#dropHint').textContent = '会直接上传到「' + (folder.name||'文件夹') + '」里面';
    $('#dropWarn').textContent = '目标文件夹：' + (folder.name||'');
  }else if(kind === 'folder' && folder && t.kind === 'gallery'){
    // 相册页没有文件夹，忽略
    return;
  }else{
    $('#dropTitle').textContent = t.title;
    $('#dropHint').textContent = t.hint;
    $('#dropWarn').textContent = t.where;
  }
  mask.classList.add('on');
}

function hideDropMask(){
  dropUI.depth = 0;
  const m = $('#dropMask');
  if(m) m.classList.remove('on');
  $$('#driveList .dentry.drop-t').forEach(n=>n.classList.remove('drop-t'));
}

(function bindDrop(){
  const hasFiles = e => {
    const dt = e.dataTransfer;
    if(!dt) return false;
    return [...(dt.types||[])].includes('Files');
  };
  window.addEventListener('dragenter', e=>{
    if(!hasFiles(e)) return;
    e.preventDefault();
    dropUI.depth++;
    if(!currentDropTarget()) return;
    showDropMask('root');
  });
  window.addEventListener('dragover', e=>{ if(hasFiles(e)) e.preventDefault(); });
  // 以前这里靠 dragleave 的 depth 计数来收起提示，但 Chromium 在 dragleave 里
  // 经常给空的 dataTransfer.types，hasFiles 判成 false → depth 永远不减 →
  // 提示条就卡在屏幕上不消失（松手了还在）。
  // 现在只认「真的离开窗口」（relatedTarget 为 null），再用 drop / dragend / blur 兜底。
  window.addEventListener('dragleave', e=>{
    if(e.relatedTarget === null){
      dropUI.depth = 0;
      hideDropMask();
    }
  });
  window.addEventListener('dragend', ()=>hideDropMask());
  window.addEventListener('drop', e=>{
    if(!hasFiles(e)){ hideDropMask(); return; }
    e.preventDefault();
    hideDropMask();
    uploadFiles(e.dataTransfer.files);
  });
  window.addEventListener('blur', ()=>hideDropMask());
})();

async function openSettings(){

  try{ s = await api('/api/settings'); }catch(e){}
  try{ a = await api('/api/account'); }catch(e){}
  paintAccount(a);
  const parts = d.parts || {};
  const names = {thumbs:'缩略图', full:'原图', video:'原视频', noteimg:'笔记图片', rec_audio:'录音缓存'};
  const rows = Object.keys(names).map(k=>{

      <span class="cc">${p.count} 个</span>
      <span class="cs">${p.size ? fmtSize(p.size) : '—'}</span></div>`;
  }).join('');
  const total = d.total || 0;
  const limit = d.limit || s.limit || 0;
  const free = s.free || d.free || 0;
  const auto = !!(s.auto != null ? s.auto : d.auto);
  const cur = Math.round((s.limit_setting || d.limit_setting || 3 * 1073741824) / 1073741824);
  const presets = [1, 2, 3, 5, 10];
  const zoom = (()=>{ try{ const z = Number(localStorage.getItem('uiZoom')); return (z >= 0.85 && z <= 1.2) ? z : 1; }catch(_){ return 1; } })();
  if(!presets.includes(cur)) presets.push(cur);
  presets.sort((a,b)=>a-b);
  const opts = `<option value="auto"${auto ? ' selected' : ''}>自动（磁盘剩余的一半）</option>`
    + presets.map(g=>`<option value="${g}"${!auto && g === cur ? ' selected' : ''}>${g} GB</option>`).join('');
  const box = document.createElement('div');
  box.className = 'ovl';
  box.innerHTML = `<div class="cbox wide">
    <div class="ctitle">设置</div>
    <div class="csec">本地缓存</div>
    <div class="clist">${rows}
      <div class="crow tot"><span class="cn">合计</span>
        <span class="cc">${d.count || 0} 个</span>
        <span class="cs">${total ? fmtSize(total) : '空'}</span></div>
    </div>
    <p class="chint">看过的图片/录音会存到本地，下次打开不用重新下载。总量超过上限时按「最久没看」淘汰；当前上限 ${fmtSize(limit) || '3 GB'}，缓存盘剩余 ${fmtSize(free) || '—'}。</p>
    <div class="srow"><span class="cn">上限</span><select id="_stLimit">${opts}</select></div>
    <p class="snote">自动模式：缓存上限 = 缓存所在磁盘剩余空间的一半（每次启动、打开设置时重新计算），避免把磁盘写满。</p>
    <div class="srow"><span class="cn">缓存目录</span>
      <input id="_stDir" value="${esc(s.custom_dir || '')}" placeholder="${esc(s.default_dir || '')}">
      <button class="btn outline sm" id="_stPick">更改</button></div>
    <p class="snote">留空 = 默认目录（exe 旁边的 cache）。改目录会把现有缓存（含 appkeys）复制过去，重启程序后生效；确认新目录正常后旧目录可以手动删。</p>
    <div class="csec">界面</div>
    <div class="srow"><span class="cn">界面缩放</span>
      <select id="_stZoom">
        <option value="0.94"${zoom===0.94?' selected':''}>紧凑 94%</option>
        <option value="1"${zoom===1?' selected':''}>标准 100%</option>
        <option value="1.08"${zoom===1.08?' selected':''}>宽松 108%</option>

      <button class="btn danger sm" id="_stLogout">退出登录</button>
    </div>

      <button class="btn outline sm" id="_stClose">关闭</button>

    fetch('/api/cache_clear', {method:'POST'})
      .then(r => r.json())
      .then(r => {
        done();
        toast(r.ok ? `已清空缓存，释放 ${fmtSize(r.freed) || '0 KB'}`
                   : '清空失败：' + (r.error || '未知原因'));
        refreshCacheSize();
      })
      .catch(() => { done(); toast('清空失败'); });

  box.querySelector('#_stPick').onclick = async () => {
    try{
      const r = await api('/api/pick_dir');
      if(r.cancelled) return;
      if(!r.ok){ toast('选择目录失败：' + (r.error || '')); return; }
      box.querySelector('#_stDir').value = r.path;
    }catch(e){ toast('选择目录失败：' + (e.message || '')); }
  };
  box.querySelector('#_stSave').onclick = async () => {
    const sel = box.querySelector('#_stLimit').value;
    const body = {cache_auto: sel === 'auto',
                  cache_dir: box.querySelector('#_stDir').value.trim()};
    if(sel !== 'auto') body.cache_limit = Number(sel) * 1073741824;
    const zsel = box.querySelector('#_stZoom');
    if(zsel){
      const z = Number(zsel.value);
      try{ localStorage.setItem('uiZoom', String(z)); }catch(_){}
      document.body.style.zoom = String(z);

    try{
      const r = await post('/api/settings', body);
      if(!r.ok){ toast('保存失败：' + (r.error || '')); return; }
      if(r.restart){
        const mv = r.migrated_files
          ? `，已复制 ${r.migrated_files} 个文件（${fmtSize(r.migrated_bytes || 0)}）` : '';
        toast('设置已保存' + mv + '；重启程序后生效');
      }else{
        toast('设置已保存');
        done(); refreshCacheSize();
      }
    }catch(e){ toast('保存失败：' + (e.message || '')); }
  };
  box.querySelector('#_stLogout').onclick = () => {
    askConfirm('退出登录？会先备份 session.dat，然后需要重新扫码/设备登录。', '退出登录', async ()=>{
      try{
        const r = await post('/api/logout', {});
        if(!r.ok){ toast('退出失败'); return; }
        toast('已退出，正在重新登录 …');
        setTimeout(() => location.reload(), 700);
      }catch(e){ toast('退出失败：' + (e.message || '')); }
    });
  };
}

async function pollLogin(){
  let s={};
  try{ s = await (await fetch('/api/status')).json(); }catch(e){ return; }
  // login_state==='device'：设备登录窗口开着，即使旧会话还能用也要把登录页留着
  if(s.login && s.login_state !== 'device'){
    if(lgTimer){ clearInterval(lgTimer); lgTimer=null; }
    if(qrTimer){ clearInterval(qrTimer); qrTimer=null; }
    $('#login').style.display='none';
    renderTab();
    refreshCacheSize();
    return;
  }
  if(s.login_state === 'device' && s.login){
    // 设备登录进行中：只更新提示文字，不要走 lgPaint 的登录页切换逻辑
    $('#lgWork').style.display='block';
    $('#lgQrBox').style.display='none';
    $('#lgStep').textContent = s.step || '请在弹出的窗口里登录';
    $('#lgDetail').textContent = s.detail || '';
    return;
  }
  lgPaint(s);
}

function startQrPoll(){
  if(qrTimer) return;
  qrTimer=setInterval(async ()=>{
    let s={};
    try{ s = await (await fetch('/api/login_state')).json(); }catch(e){ return; }
    const img=$('#qrImg');
    if(s.img && !img.src.startsWith('data:')){
      img.onload = () => $('#qrBox') && $('#qrBox').classList.add('ready');
      img.src='data:image/png;base64,'+s.img;
    }
    if(s.state==='waiting') $('#qrSt').textContent='等待手机扫码 …';
    else if(s.state==='starting') $('#qrSt').textContent='正在获取二维码 …';
    else if(s.state==='error'){
      $('#qrSt').textContent = s.err || '获取失败，3 秒后自动重试 …';
      clearInterval(qrTimer); qrTimer=null;
      setTimeout(()=>fetch('/api/login',{method:'POST'}).catch(()=>{}), 3000);
    }
  }, 1200);
}

/* 401 节流：一屏请求会同时撞到 401，5 秒内只真正打一次 /api/relogin。
   否则服务端会被同一批请求打成多条取票线程（那才是「窗口一个接一个弹」的来源）。 */
let reloginAt = 0;
function relogin(){
  showLogin();
  const now = Date.now();
  if(now - reloginAt < 5000) return;
  reloginAt = now;
  fetch('/api/relogin',{method:'POST'}).catch(()=>{});
}

function showLogin(){
  $('#login').style.display='flex';
  $('#qrSt').textContent='正在获取二维码 …';
  $('#qrImg').removeAttribute('src');
  const qb = $('#qrBox'); if(qb) qb.classList.remove('ready');
  if(!lgTimer) lgTimer=setInterval(pollLogin, 1000);
  pollLogin();
}

/* 设备登录：弹内嵌窗口，在小米官方页面输密码 + 手机验证码。
   这一步会把这台机器登记成「设备」，待办等敏感服务才能长期用。 */
$('#lgDevice').onclick = async () => {
  const b = $('#lgDevice');
  b.disabled = true; b.textContent = '正在打开登录窗口 …';
  try{ await fetch('/api/device_login', {method:'POST'}); }catch(e){}
  setTimeout(()=>{ b.disabled=false; b.textContent='设备登录（推荐）'; }, 2500);
};

$('#lgToQr').onclick = async () => {
  $('#lgWork').style.display='none';
  $('#lgQrBox').style.display='block';
  try{ await fetch('/api/login',{method:'POST'}); }catch(e){}
  startQrPoll();
};

/* 登录看门狗：以前只有「某个请求撞上 401」才会弹登录页，
   用户停在界面上不动就永远看不到登录入口（设备登录按钮也就点不到）。
   这里每 3 秒查一次服务端状态，掉线就把登录页顶出来。 */
setInterval(async () => {
  if ($('#login').style.display === 'flex') return;
  let s = {};
  try{ s = await (await fetch('/api/status')).json(); }catch(_){ return; }
  if (!s.login) showLogin();
}, 3000);

async function boot(){
  let s={};
  try{ s = await (await fetch('/api/status')).json(); }catch(e){}
  if(s.login){ renderTab(); refreshCacheSize(); refreshAccount(); } else showLogin();
}
boot();
/* ============================================================
   体验增强层：搜索 / 快捷键 / 滚动记忆 / 网络 / 命令面板
   全部新增，不改原来的渲染入口；只在各页过滤函数里加一层判断。
   ============================================================ */
const UX = {
  q: '',
  pageScroll: {},
  searchTimer: null,
  recFilter: '',
  todoSel: new Set(),
};
/* 关键：UX 必须挂到 window 上。各页过滤函数统一写的是
   (window.UX && UX.q) —— 顶层 const 不会自动成为 window 的属性，
   所以以前每个页面的搜索条件永远取到空字符串，过滤形同虚设。 */
window.UX = UX;

/* ---------- 搜索 ---------- */
const SEARCH_PH = {
  gallery: '搜索相簿名称',
  note: '搜索笔记标题或摘要',
  todo: '搜索代办内容',
  record: '搜索录音（已加载部分）',
  drive: '搜索当前文件夹'
};
function uxNorm(s){ return String(s == null ? '' : s).toLowerCase(); }

/* 只切换「有内容」状态，绝不回写 input.value：
   在 input 事件里回写会把光标打回末尾，并打断中文输入法的拼写，
   结果中文还没上屏就被清掉，表现出来就是「什么都搜不出来」。 */
function uxSearchHint(){
  const has = !!UX.q.trim();
  const wrap = $('#searchWrap');
  if(wrap) wrap.classList.toggle('has', has);
  const go = $('#searchGo');
  if(go) go.disabled = !SEARCH_PH[TAB];
}

/* 只有程序自己改搜索词时才回写输入框（切页、Esc、清空按钮） */
function uxSyncSearchInput(v){
  const inp = $('#searchInp');
  if(inp && inp.value !== v) inp.value = v;
}

function uxSetQ(v, immediate){
  UX.q = String(v || '');
  uxSearchHint();
  clearTimeout(UX.searchTimer);
  UX.searchTimer = setTimeout(uxApplySearch, immediate ? 0 : 220);
}

function uxApplySearch(){
  if(!$('#searchInp')) return;
  const q = UX.q.trim();
  try{
    if(TAB === 'gallery'){ drawAlbums(); }
    else if(TAB === 'note'){ drawNoteList(); }
    else if(TAB === 'todo'){ drawTodoFilters(); drawTodoList(true); }
    else if(TAB === 'record'){ uxFilterRecordRows(); }
    else if(TAB === 'drive'){ redrawDriveList(); }
  }catch(e){ /* 页面正在重建时不打断 */ }
  if(q){
    const n = UX.visibleCount();
    if(n === 0) toast('没有匹配「' + q + '」的内容', {quiet:false});
  }
}

function UX_visibleCount(){
  if(TAB === 'gallery') return $$('#left .alb').filter(x => x.style.display !== 'none').length;
  if(TAB === 'note') return $$('#noteList .note').filter(x => x.style.display !== 'none').length;
  if(TAB === 'todo') return $$('#todoBody .todo').length;
  if(TAB === 'record') return $$('#recList .item').filter(x => x.style.display !== 'none').length;
  if(TAB === 'drive') return $$('#driveList .dentry').filter(x => x.style.display !== 'none').length;
  return 0;
}
UX.visibleCount = UX_visibleCount;

/* 录音：按已加载的数据做前端过滤（不改请求） */
function uxFilterRecordRows(){
  const q = uxNorm(UX.q.trim());
  $$('#recList .item').forEach(el => {
    if(!q){ el.style.display = ''; return; }
    const r = (state.records || []).find(x => String(x.id) === String(el.dataset.id));
    const hay = uxNorm((r && (r.label || r.name)) || el.textContent);
    el.style.display = hay.indexOf(q) >= 0 ? '' : 'none';
  });
  $$('#recList .recday').forEach(h => {
    const next = h.nextElementSibling;
    let any = false, n = next;
    while(n && !n.classList.contains('recday')){
      if(n.classList.contains('item') && n.style.display !== 'none'){ any = true; break; }
      n = n.nextElementSibling;
    }
    h.style.display = any ? '' : 'none';
  });
}

/* 云盘：当前层过滤（数据仍在 state.driveItems 里，不丢） */
function uxDriveItems(){
  const q = uxNorm(UX.q.trim());
  const list = state.driveItems || [];
  if(!q) return list;
  return list.filter(x => uxNorm(x.name).indexOf(q) >= 0);
}

/* ---------- 跨页滚动位置 ---------- */
function uxScrollKey(){
  if(TAB === 'gallery') return null;          // 相册有自己的 gal.scroll 记忆
  if(TAB === 'drive') return 'drive:' + (state.parent || 0);
  return TAB;
}
function uxScrollEl(){
  if(TAB === 'note') return $('#noteList');
  return $('#content');
}
function uxSaveScroll(){
  const k = uxScrollKey(); if(!k) return;
  const el = uxScrollEl();
  if(el && el.scrollTop > 0) UX.pageScroll[k] = el.scrollTop;
}
function uxRestoreScroll(){
  const k = uxScrollKey(); if(!k) return;
  const v = UX.pageScroll[k];
  if(!v) return;
  const tries = [0, 90, 240, 520, 900];
  tries.forEach(t => setTimeout(() => {
    if(uxScrollKey() !== k) return;
    const el = uxScrollEl();
    if(!el) return;
    if(Math.abs(el.scrollTop - v) < 2) return;
    if(el.scrollHeight - el.clientHeight >= v - 4) el.scrollTop = v;
  }, t));
}

/* ---------- 切页签：统一收口 ---------- */
const _uxRenderTabBase = renderTab;
renderTab = async function(){
  const prevTab = UX.lastTab;
  const r = await _uxRenderTabBase.apply(this, arguments);
  try{
    const inp = $('#searchInp');
    if(inp){
      inp.placeholder = SEARCH_PH[TAB] || '搜索';
      inp.disabled = !SEARCH_PH[TAB];
    }
  }catch(e){}
  UX.lastTab = TAB;
  if(prevTab && prevTab !== TAB){ UX.q = ''; uxSearchHint(); uxSyncSearchInput(''); }
  uxRestoreScroll();
  return r;
};

/* ---------- 快捷键 ---------- */
function uxTyping(){
  const a = document.activeElement;
  if(!a) return false;
  if(a.id === 'searchInp' || a.id === 'cmdkInp') return true;
  if(a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') return true;
  if(a.isContentEditable) return true;
  return false;
}
function uxGotoTab(i){
  const navs = $$('#side .nav');
  if(navs[i]) navs[i].click();
}
function uxFocusSearch(){
  const inp = $('#searchInp');
  if(!inp || inp.disabled) return;
  inp.focus(); inp.select();
}
function uxSelectAllCurrent(){
  if(TAB === 'gallery' && state.canSel){
    const btn = $('#btnSelAllBar');
    if(btn && $('#selbar').classList.contains('on')) btn.click();
    else $('#btnSelAll').click();
    return;
  }
  if(TAB === 'note'){
    const b = $('#noteSelAll'); if(b) b.click(); return;
  }
  if(TAB === 'record' || TAB === 'drive'){
    $$('#content .tick2, #content .dtick').forEach(t => {
      if(t.classList.contains('on')) return;
      t.click();
    });
    return;
  }
  if(TAB === 'todo'){ uxTodoSelectAll(); return; }
}
function uxDeleteSel(){
  if(TAB === 'gallery' && sel.size){
    askConfirm(`把选中的 ${sel.size} 项移进回收站？可以在回收站里恢复。`, '删除', async () => {
      try{
        await api('/api/photo_delete', {method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ids:[...sel]})});
        toast('已移入回收站', {type:'ok'}); sel.clear(); updSel();
        await loadAlbum(state.album, {fresh:true});
      }catch(e){ toast('删除失败：' + errMsg(e), {type:'err'}); }
    });
    return;
  }
  if(TAB === 'note' && state.noteSel && state.noteSel.size){ deleteNotes([...state.noteSel]); return; }
  if(TAB === 'record' && sel.size){ uxDeleteRecords(); return; }
  if(TAB === 'drive' && sel.size){
    if(sel.size) delDrive([...sel]);
    return;
  }
  if(TAB === 'todo' && UX.todoSel && UX.todoSel.size){ uxTodoDeleteSelected(); return; }
}

document.addEventListener('keydown', e => {
  const typing = uxTyping();
  const mod = e.ctrlKey || e.metaKey;

  /* 搜索框里的 Esc：先清空，再退出焦点 */
  if(e.key === 'Escape' && document.activeElement && document.activeElement.id === 'searchInp'){
    e.preventDefault();
    if(UX.q || document.activeElement.value){ document.activeElement.value = ''; uxSetQ('', true); }
    else document.activeElement.blur();
    return;
  }

  if(mod && !e.shiftKey && !e.altKey){
    const k = e.key.toLowerCase();
    if(k >= '1' && k <= '5'){ e.preventDefault(); uxGotoTab(Number(k) - 1); return; }
    if(k === 'f'){ e.preventDefault(); uxFocusSearch(); return; }
    if(k === 'k'){ e.preventDefault(); uxOpenCmdk(); return; }
    if(k === 'r'){ if(!typing){ e.preventDefault(); refreshTab(); } return; }
    if(k === 'a'){ if(!typing){ e.preventDefault(); uxSelectAllCurrent(); } return; }
  }
  if(e.key === 'F5'){ e.preventDefault(); refreshTab(); return; }
  if(e.key === 'Delete' && !typing && !$('#cmdk').classList.contains('on')){ uxDeleteSel(); return; }
});

/* ---------- 网络状态 ---------- */
function uxNetSync(){
  const off = (navigator.onLine === false);
  const bar = $('#netBar');
  if(!bar) return;
  bar.classList.toggle('on', off);
  const txt = $('#netBarText');
  if(txt) txt.textContent = off ? '网络已断开 · 正在使用本地缓存' : '网络已恢复 · 正在同步最新数据';
}
window.addEventListener('online', () => {
  uxNetSync();
  toast('网络已恢复', {type:'ok'});
  setTimeout(() => { try{ refreshTab(); }catch(e){} }, 700);
});

uxNetSync();

/* 搜索框事件 */
(function bindSearch(){
  const inp = $('#searchInp');
  if(!inp) return;
  let composing = false;          // 中文输入法拼字期间不触发搜索，避免半成品被拿去匹配

  function runNow(){
    clearTimeout(UX.searchTimer);
    UX.q = inp.value;
    uxSearchHint();
    uxApplySearch();
    if(TAB === 'note'){
      const first = $$('#noteList .note').find(x => x.style.display !== 'none');
      if(first) first.click();
    }
  }

  inp.addEventListener('compositionstart', () => { composing = true; });
  inp.addEventListener('compositionend', () => { composing = false; uxSetQ(inp.value); });
  inp.addEventListener('input', () => { if(!composing) uxSetQ(inp.value); });
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !composing){ e.preventDefault(); runNow(); }
  });
  /* 输入框原生的「搜索」事件（部分输入法回车会走这条） */
  inp.addEventListener('search', () => { if(!composing) uxSetQ(inp.value); });

  const go = $('#searchGo');
  if(go) go.onclick = () => { runNow(); inp.focus(); };
  const clr = $('#searchClr');
  if(clr) clr.onclick = () => { inp.value = ''; UX.q = ''; uxSearchHint(); uxSetQ('', true); inp.focus(); };
  inp.placeholder = SEARCH_PH[TAB] || '搜索';
  if(go) go.disabled = !SEARCH_PH[TAB];
})();

/* ---------- 命令面板 ---------- */
let cmdkIdx = 0, cmdkItems = [];
function uxCmdkData(){
  return [
    {icon:'i-todo', text:'代办', hint:'Ctrl+1', run:()=>uxGotoTab(0)},
    {icon:'i-note', text:'笔记', hint:'Ctrl+2', run:()=>uxGotoTab(1)},
    {icon:'i-photo', text:'相册', hint:'Ctrl+3', run:()=>uxGotoTab(2)},
    {icon:'i-folder', text:'云盘', hint:'Ctrl+4', run:()=>uxGotoTab(3)},
    {icon:'i-mic', text:'录音', hint:'Ctrl+5', run:()=>uxGotoTab(4)},
    {icon:'i-refresh', text:'刷新当前页面', hint:'F5', run:()=>refreshTab()},
    {icon:'i-plus', text:'新建（当前页）', hint:'', run:()=>{ const b=$('#btnNew'); if(b && b.style.display!=='none') b.click(); }},
    {icon:'i-check', text:'全选当前页面', hint:'Ctrl+A', run:()=>uxSelectAllCurrent()},
    {icon:'i-settings', text:'设置与缓存', hint:'', run:()=>{ const b=$('#btnSettingsSide'); if(b) b.click(); else openSettings(); }},
    {icon:'i-search', text:'搜索当前页面', hint:'Ctrl+F', run:()=>uxFocusSearch()},
  ];
}
function uxPaintCmdk(){
  const box = $('#cmdkList');
  if(!box) return;
  const list = cmdkItems;
  if(!list.length){ box.innerHTML = '<div class="cempty">没有匹配的命令</div>'; return; }
  box.innerHTML = list.map((it, i) =>
    `<div class="ci${i===cmdkIdx?' act':''}" data-i="${i}">
      ${ICO(it.icon)}<span>${esc(it.text)}</span>${it.hint?`<span class="k">${esc(it.hint)}</span>`:''}
    </div>`).join('');
  $$('#cmdkList .ci').forEach(el => {
    el.onclick = () => { const it = cmdkItems[Number(el.dataset.i)]; uxCloseCmdk(); if(it) it.run(); };
  });
  const act = box.querySelector('.ci.act');
  if(act) act.scrollIntoView({block:'nearest'});
}
function uxOpenCmdk(){
  const m = $('#cmdk');
  if(!m) return;
  m.classList.add('on');
  const inp = $('#cmdkInp');
  cmdkItems = uxCmdkData();
  cmdkIdx = 0;
  if(inp){ inp.value = ''; setTimeout(()=>inp.focus(), 30); }
  uxPaintCmdk();
}
function uxCloseCmdk(){ $('#cmdk').classList.remove('on'); }
function uxCmdkFilter(){
  const q = uxNorm($('#cmdkInp').value.trim());
  cmdkItems = uxCmdkData().filter(x => !q || uxNorm(x.text).indexOf(q) >= 0);
  cmdkIdx = 0;
  uxPaintCmdk();
}
(function bindCmdk(){
  const m = $('#cmdk');
  if(!m) return;
  m.addEventListener('click', e => { if(e.target === m) uxCloseCmdk(); });
  const inp = $('#cmdkInp');
  inp.addEventListener('input', uxCmdkFilter);
  inp.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ e.preventDefault(); uxCloseCmdk(); return; }
    if(e.key === 'ArrowDown'){ e.preventDefault(); cmdkIdx = Math.min(cmdkItems.length-1, cmdkIdx+1); uxPaintCmdk(); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); cmdkIdx = Math.max(0, cmdkIdx-1); uxPaintCmdk(); return; }
    if(e.key === 'Enter'){
      e.preventDefault();
      const it = cmdkItems[cmdkIdx];
      uxCloseCmdk();
      if(it) it.run();
    }
  });
})();

/* ---------- 待办：快速添加 / 批量操作 ---------- */
function uxTodoHay(t){

  let s = String(t.title || '');
  (t.subs || []).forEach(x => { s += ' ' + String((x && x.text) || x || ''); });

}
function uxTodoSelN(){ return (UX.todoSel && UX.todoSel.size) || 0; }
function uxTodoToolsHTML(){

function uxPaintTodoSel(){
  const n = uxTodoSelN();
  const bar = $('#todoBatch');
  if(bar) bar.classList.toggle('on', n > 0);
  const cnt = $('#todoBatchCnt');
  if(cnt) cnt.textContent = `已选 ${n} 项`;
  $$('#todoBody .tck').forEach(t => {
    const on = UX.todoSel.has(t.dataset.id);
    t.classList.toggle('on', on);
    t.setAttribute('aria-checked', on ? 'true' : 'false');
    const row = t.closest('.todo'); if(row) row.classList.toggle('sel', on);

}
function uxBindTodoTools(){
  const inp = $('#todoQuickInp');
  const add = async () => {
    const v = String(inp.value || '').trim();
    if(!v){ inp.focus(); return; }
    const btn = $('#todoQuickBtn');
    if(btn){ btn.disabled = true; btn.textContent = '…'; }
    try{
      await api('/api/todo_create', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title:v})});
      inp.value = '';
      toast('已添加代办', {type:'ok'});
      await refreshTodoState(true);
      drawTodoFilters(); drawTodoList(true);
      setTimeout(()=>{ const i2 = $('#todoQuickInp'); if(i2) i2.focus(); }, 40);
    }catch(e){
      toast('添加失败：' + errMsg(e), {type:'err'});
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = '添加'; }
    }
  };
  if(inp) inp.onkeydown = e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); add(); }
    if(e.key === 'Escape'){ inp.value = ''; inp.blur(); }
  };
  const b = $('#todoQuickBtn'); if(b) b.onclick = add;
  const d = $('#todoBatchDone'); if(d) d.onclick = uxTodoBatchDone;
  const del = $('#todoBatchDel'); if(del) del.onclick = uxTodoDeleteSelected;
  const clr = $('#todoBatchClear');
  if(clr) clr.onclick = () => { UX.todoSel.clear(); uxPaintTodoSel(); };
}
function uxTodoSelectAll(){
  const ids = $$('#todoBody .todo').map(x => x.dataset.id);
  if(!ids.length) return;
  const all = ids.every(id => UX.todoSel.has(id));
  ids.forEach(id => all ? UX.todoSel.delete(id) : UX.todoSel.add(id));
  uxPaintTodoSel();
}
async function uxTodoBatchDone(){
  const ids = [...UX.todoSel];
  if(!ids.length) return;
  let ok = 0, fail = 0;
  toast('正在处理 ' + ids.length + ' 项 …', {type:'busy', quiet:true});
  for(const id of ids){
    const t = (state.todos || []).find(x => String(x.id) === String(id));
    if(!t) continue;
    const done = !t.done;
    try{
      await api('/api/todo_toggle', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id, done})});
      t.done = done; t.finished = done ? Date.now() : 0; ok++;
    }catch(e){ fail++; }
  }
  UX.todoSel.clear();
  drawTodoFilters(); drawTodoList(true);
  toast(`已更新 ${ok} 项${fail ? `，${fail} 项失败` : ''}`, {type: fail ? 'err' : 'ok'});
}

  const ids = [...UX.todoSel];

    for(const id of ids){
      try{
        await api('/api/todo_delete', {method:'POST', headers:{'Content-Type':'application/json'},

    UX.todoSel.clear();

document.addEventListener('keydown', e => {

/* ---------- 界面缩放：0.94 / 1 / 1.08，存本地 ---------- */
(function initUiZoom(){
  try{
    const z = Number(localStorage.getItem('uiZoom'));
    if(z >= 0.85 && z <= 1.2) document.body.style.zoom = String(z);
  }catch(_){}
})();

/* ---------- 相册拖动框选 ---------- */
(function bindMarquee(){
  const c = $('#content'), box = $('#marquee');
  if(!c || !box) return;
  let active = false, moved = false, sx = 0, sy = 0, lastR = null;
  const hit = (el, r) => {
    const q = el.getBoundingClientRect();
    return !(q.right < r.left || q.left > r.right || q.bottom < r.top || q.top > r.bottom);
  };
  const clearHits = () => $$('#content .card').forEach(x => x.classList.remove('srch-hit'));
  c.addEventListener('pointerdown', e => {
    if(TAB !== 'gallery' || e.button !== 0) return;
    if(e.target.closest('.card,.tick,.tick2,.row,.item,.empty,button,a,#tl')) return;
    if(sel.size) return;                 // 已经有选择时按常规点选，不拖框
    active = true; moved = false;
    sx = e.clientX; sy = e.clientY; lastR = null;
  });
  window.addEventListener('pointermove', e => {
    if(!active) return;
    const dx = Math.abs(e.clientX - sx), dy = Math.abs(e.clientY - sy);
    if(!moved && dx + dy < 5) return;
    moved = true;
    lastR = {left: Math.min(sx, e.clientX), top: Math.min(sy, e.clientY),
             right: Math.max(sx, e.clientX), bottom: Math.max(sy, e.clientY)};
    box.style.display = 'block';
    box.style.left = lastR.left + 'px';
    box.style.top = lastR.top + 'px';
    box.style.width = (lastR.right - lastR.left) + 'px';
    box.style.height = (lastR.bottom - lastR.top) + 'px';
    $$('#content .card[data-key]').forEach(el => el.classList.toggle('srch-hit', hit(el, lastR)));
  }, {passive:true});
  const finish = () => {
    if(!active) return;
    active = false;
    box.style.display = 'none';
    if(moved && lastR){
      $$('#content .card[data-key]').forEach(el => {
        if(hit(el, lastR)) sel.add(el.dataset.key);
      });
      if(sel.size){ applySelToCards(); updSel(); selSetAnchor([...sel][0]); }
    }
    clearHits();
  };
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
})();

/* ---------- 滚动渐隐 ---------- */
(function bindScrollFade(){
  const c = $('#content');
  if(!c) return;
  let t = null;
  c.addEventListener('scroll', () => {
    c.classList.add('scrollfade');
    clearTimeout(t);
    t = setTimeout(() => c.classList.remove('scrollfade'), 260);
  }, {passive:true});
})();

/* ---------- 启动闪屏兜底 ---------- */
setTimeout(() => {
  const s = $('#splash');
  if(s) s.classList.add('off');
}, 1600);
