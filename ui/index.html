<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小米云</title>
<style>
:root{
  /* 表面 */
  --bg:#0a0c10;
  --bg-2:#0e1116;
  --surface:#141920;
  --surface-2:#1a2028;
  --surface-3:#222931;
  --surface-4:#2b333d;
  /* 线 */
  --line:#20262e;
  --line-2:#2b333d;
  --line-3:#3b4551;
  /* 字 */
  --fg:#e9edf2;
  --fg-2:#aeb7c2;
  --fg-3:#8d97a3;
  --fg-4:#7b8592;
  /* 强调 */
  --accent:#5b8dff;
  --accent-hover:#7aa2ff;
  --accent-weak:rgba(91,141,255,.12);
  --accent-line:rgba(91,141,255,.42);
  --ok:#3fbf7f;
  --warn:#e2a83d;
  --danger:#f2637a;
  --danger-weak:rgba(242,99,122,.12);
  /* 尺度 */
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:14px; --r-xl:18px;
  --h-ctl:32px;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 10px 28px -10px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.32);
  --shadow-3:0 32px 80px -20px rgba(0,0,0,.8),0 8px 24px rgba(0,0,0,.4);
  /* 运动 */
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --dur-1:.12s; --dur-2:.2s; --dur-3:.32s; --dur-4:.5s;
  /* 玻璃（三档不透明度） */
  --glass-1:rgba(14,17,22,.58);
  --glass-2:rgba(17,21,27,.72);
  --glass-3:rgba(26,32,40,.86);
  --glass-line:rgba(255,255,255,.075);
  --glass-hi:rgba(255,255,255,.055);
  --blur-1:16px; --blur-2:24px; --blur-3:36px;
  /* 兼容旧内联样式 */
  --dim:var(--fg-2); --dim2:var(--fg-3); --panel:var(--surface); --panel2:var(--surface-2);
  --panel3:var(--surface-3); --accent-soft:var(--accent-weak); --line2:var(--line-2);
  --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"Microsoft YaHei",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);overflow:hidden;
  font:13px/1.55 var(--font);
  display:flex;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
::selection{background:rgba(91,141,255,.32)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#2a3037;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3a424c;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}

/* ---------- 图标 ---------- */
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:24px;height:24px;stroke-width:1.5}
svg.i.xl{width:40px;height:40px;stroke-width:1.2}
svg.i.fill{fill:currentColor;stroke:none}

/* ---------- 侧栏 ---------- */
#side{width:var(--side-w,172px);flex:0 0 var(--side-w,172px);background:var(--bg-2);
  border-right:1px solid var(--line);position:relative;
  display:flex;flex-direction:column;padding:12px 8px 10px}
/* 右侧拖拽手柄：拖动改宽度，双击复位 */
#sideGrip{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:6}
#sideGrip::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;
  background:transparent;transition:background .14s var(--ease)}
#sideGrip:hover::after,#sideGrip.on::after{background:var(--accent)}
body.resizing,body.resizing *{user-select:none !important;cursor:col-resize !important}
body.resizing #content{pointer-events:none}
#side > .nav:first-of-type{margin-top:10px}   /* 顶部 logo 已去掉，给导航留一点上边距 */
#logo .dot{width:26px;height:26px;border-radius:8px;overflow:hidden;flex:none;
  box-shadow:0 2px 8px rgba(0,0,0,.4)}
#logo .dot svg{width:26px;height:26px;display:block}
#logo b{font-size:13.5px;letter-spacing:.2px;font-weight:600;color:var(--fg)}
.nav{display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;border-radius:var(--r-sm);
  color:var(--fg-2);cursor:pointer;user-select:none;margin-bottom:2px;font-size:13px;
  transition:background .13s var(--ease),color .13s var(--ease);position:relative}
.nav svg.i{width:17px;height:17px;color:var(--fg-3);transition:color .13s var(--ease)}
.nav:hover{background:var(--surface);color:var(--fg)}
.nav:hover svg.i{color:var(--fg-2)}
.nav.on{background:var(--surface-2);color:var(--fg);font-weight:600}
.nav.on svg.i{color:var(--accent);stroke-width:1.9}
#side .foot{margin-top:auto;padding:10px 4px 2px;border-top:1px solid var(--line)}
/* 侧栏底部的缓存入口：平时低调，鼠标移上去才明显 */
.cachebtn{display:flex;align-items:center;gap:7px;width:100%;height:30px;padding:0 8px;
  border:1px solid transparent;border-radius:var(--r-sm);background:transparent;
  color:var(--fg-3);font:inherit;font-size:11.5px;cursor:pointer;text-align:left;
  transition:background .13s var(--ease),color .13s var(--ease),border-color .13s var(--ease)}
.cachebtn:hover{background:var(--surface-2);color:var(--fg);border-color:var(--line-2)}
.cachebtn svg.i{width:13px;height:13px;flex:none;opacity:.8}
.cachebtn .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cachebtn .sz{font-size:11px;color:var(--fg-4);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.cachebtn:hover .sz{color:var(--fg-2)}
.cachebtn.warn .sz{color:var(--warn)}
/* 侧栏底部：头像+名字在左，设置齿轮在右；点整块都进设置 */
#side .me{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;transition:background .13s var(--ease),border-color .13s var(--ease)}
#side .me:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.08)}
#side .meava{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;display:grid;
  place-items:center;background:var(--surface-3);border:1px solid var(--line-2);
  color:var(--fg);font-size:12px;font-weight:600}
#side .meava img{width:100%;height:100%;object-fit:cover;display:block}
#side .mename{flex:1;min-width:0;font-size:12px;color:var(--fg-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .megear{width:26px;height:26px;flex:none;display:grid;place-items:center;padding:0;
  border:1px solid transparent;border-radius:7px;background:transparent;color:var(--fg-3);cursor:pointer}
#side .megear:hover{background:rgba(255,255,255,.08);color:var(--fg);border-color:rgba(255,255,255,.10)}
#side .megear svg.i{width:14px;height:14px}

/* ---------- 主区 ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

/* ---------- 相册：右侧时间轴（完全照官方 CSS 参数） ---------- */
/* 官方 gallery.js 的样式（源码实证）：
     .timeline { position:absolute; right:10px; top:18px; bottom:0;
                 width:26px; overflow:hidden; font-size:10px; color:#b2b2b2 }
     .timeline .item-month::before { position:absolute; bottom:0; right:6px;
                 height:1px; width:7px; background:#B2B2B2 }
     .timeline .position-current { background:#1890FF; height:2px }
   所以：窄 26px、贴右 10px、从上到下铺满、刻度是 7×1px 的短横线。 */
/* 时间轴容器：从照片区顶部开始，不侵入 header 工具栏
   header 高 46px，所以 top 要 ≥46；官方是 top:18px（相对内容区，不是窗口） */
#tl{position:absolute;right:10px;top:62px;bottom:8px;width:40px;z-index:7;
  display:none;font-size:10px;color:#b2b2b2;pointer-events:auto;cursor:pointer}
#tl.on{display:block}
/* 顶部「全部选择」：放在时间轴内部顶端，不再往上溢出到工具栏 */
#tl .tlall{position:absolute;top:0;right:0;width:26px;height:16px;
  pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--fg-4);opacity:0;transition:opacity .12s var(--ease)}
#tl:hover .tlall{opacity:1}
#tl .tlall:hover{color:var(--accent)}
#tl .tlall svg.i{width:11px;height:11px}
/* 刻度带：铺满高度，按比例分配（官方用 height:% 实现） */
#tl .track{position:absolute;inset:16px 0 0 0;pointer-events:auto;
  display:flex;flex-direction:column;padding:2px 0}
/* 一个月 = 一条短横线；高度按该月照片量占比分配（官方 style.height:100*l%） */
#tl .tick{position:relative;width:100%;cursor:pointer;flex:none;min-height:0}
#tl .tick i{display:block;position:absolute;right:6px;bottom:0;
  height:1px;width:7px;background:#B2B2B2;
  transition:width .1s var(--ease),background .1s var(--ease)}
/* 官方：hidden 的月份不画线，年份标签也一起隐藏（官方原样） */
#tl .tick.hidden i{display:none}
#tl .tick.hidden .yr{display:none}
/* 官方：last（该年最后一个月）不画线，只放年份标签 */
#tl .tick.last i{display:none}
#tl .tick.has i{background:#8b95a0}
#tl .tick.hv i{background:var(--accent);width:12px}
#tl .tick.on i{background:#1890FF;width:14px}
/* 年份标签：官方 .timeline-tag-year —— right:0; bottom:0; 背景遮住底下的线 */
#tl .tick .yr{position:absolute;right:0;bottom:0;
  background:var(--bg);line-height:1;padding:0 2px;
  font-size:10px;color:#b2b2b2;white-space:nowrap;pointer-events:none}
#tl .tick.on .yr{color:#1890FF;font-weight:600}
/* 当前位置指示线（官方 .position-current：2px 高、蓝色） */
#tl .poscur{position:absolute;left:0;width:100%;height:2px;background:#1890FF;
  display:none;pointer-events:none;z-index:2}
#tl .poscur.on{display:block}
/* 悬停气泡：官方 .hover-month 是 fixed 定位、跟随鼠标，68×26 黑底圆角 */
#tl .bubble{position:fixed;right:44px;transform:translateY(-13px);
  display:none;background:rgba(0,0,0,.7);border-radius:13px;
  padding:0 12px;height:26px;line-height:26px;font-size:10px;color:#fff;
  white-space:nowrap;pointer-events:none;z-index:99}
#tl .bubble.on{display:block}
#tl .bubble b{color:#69b1ff;font-weight:500}
/* 时间轴构建中的骨架：一列呼吸的短横线，替代干等 */
#tl .tlskeleton{flex:1;display:flex;flex-direction:column;justify-content:space-between;
  align-items:flex-end;padding:6px 8px 6px 0;gap:4px}
#tl .tlskeleton i{display:block;width:10px;height:1.5px;border-radius:1px;
  background:var(--line-3);animation:tlsPulse 1.2s ease-in-out infinite}
#tl .tlskeleton i:nth-child(2n){width:8px;animation-delay:.15s}
#tl .tlskeleton i:nth-child(3n){width:12px;animation-delay:.3s}
@keyframes tlsPulse{0%,100%{opacity:.35}50%{opacity:.9}}
#tl .tlfail{flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--fg-4);font-size:10px;text-align:center;line-height:1.6}
header{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;
  border-bottom:1px solid var(--line);background:var(--bg-2)}
header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
header .sub{color:var(--fg-3);font-size:12px;margin-left:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:42vw}
header .htitle{display:flex;align-items:baseline;gap:9px;min-width:0}
header .parent{color:var(--fg-3);font-size:12.5px;white-space:nowrap;display:none}
header .parent.on{display:inline}
header .parent::after{content:"›";margin-left:8px;color:var(--fg-4)}
header .parent a{color:var(--fg-3);text-decoration:none;cursor:pointer;border-radius:4px;padding:1px 2px}
header .parent a:hover{color:var(--fg);background:var(--surface-2)}
header .spacer{flex:1}
header .hacts{display:flex;align-items:center;gap:7px}
header #btnNew{min-width:104px;padding:0 13px;height:29px}
header #btnTrash{min-width:88px;padding:0 11px;height:29px}
header .hacts .sep{width:1px;height:18px;background:var(--line-2);margin:0 3px}
.slot{visibility:hidden}

/* 按钮：一套尺度（28 / 32 / 36），一套圆角 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface-3);
  color:var(--fg);border:1px solid var(--line-3);border-radius:var(--r-sm);height:var(--h-ctl);padding:0 12px;
  cursor:pointer;font-size:12.5px;white-space:nowrap;font-family:inherit;line-height:1;font-weight:500;
  transition:background .13s var(--ease),border-color .13s var(--ease),color .13s var(--ease),
    box-shadow .13s var(--ease),transform .08s var(--ease)}
.btn svg.i{width:15px;height:15px;color:currentColor;opacity:.9;flex:none}
.btn:hover{background:var(--surface-4);border-color:#454e59;color:#fff}
.btn:active{background:#2e3640;transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 0 0 0 rgba(91,141,255,0)}
.btn.primary svg.i{opacity:1}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff;
  box-shadow:0 2px 10px -2px rgba(0,0,0,.5)}
.btn.primary:active{background:#4a7cf0}
/* 次要实心按钮：有边框、有底色，和「纯文字」明显区分 */
.btn.outline{background:var(--surface-2);border-color:var(--line-3);color:var(--fg)}
.btn.outline:hover{background:var(--surface-3);border-color:#454e59}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--fg);border-color:var(--line-2)}
.btn.ghost:active{background:var(--surface-4)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:var(--r-xs)}
.btn.sm svg.i{width:14px;height:14px}
.btn.xs svg.i{width:13px;height:13px}
.btn.danger{color:#ffd0d8;border-color:rgba(242,99,122,.38);background:rgba(242,99,122,.16)}
.btn.danger:hover{background:rgba(242,99,122,.26);border-color:rgba(242,99,122,.6);color:#fff}
.btn.danger:disabled{color:var(--fg-4);background:transparent;border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn.primary:disabled:hover{background:var(--accent);border-color:var(--accent)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:7px;border:1px solid transparent;background:transparent;color:var(--fg-3);cursor:pointer;
  transition:background .13s var(--ease),color .13s var(--ease),border-color .13s var(--ease);padding:0}
.iconbtn:hover{background:var(--surface-3);color:var(--fg);border-color:var(--line-2)}
.iconbtn svg.i{width:15px;height:15px}

#body{flex:1;display:flex;min-height:0}
#left{width:236px;flex:0 0 236px;border-right:1px solid var(--line);overflow:auto;background:var(--bg-2);
  padding:6px 0 10px}
#content{flex:1;overflow:auto;position:relative;min-width:0;scroll-behavior:auto}

/* ---------- 左侧列表 ---------- */
.sect{padding:14px 14px 6px;color:var(--fg-3);font-size:11px;letter-spacing:.06em;font-weight:600}
/* 一级分类行（照片 / 视频 / 最近删除）：图标在左，跟相册行同样式；
   「照片」额外在行尾带一个展开箭头（只在点箭头时收起相簿，点整行是看全部照片） */
.row.sec{gap:9px}
.row.sec > .i{width:15px;height:15px;flex:none;opacity:.7;color:var(--fg-3)}
.row.sec.on > .i{opacity:1;color:var(--accent)}
.row.sec .fcbtn{flex:none;width:24px;height:24px;margin-right:-4px;padding:0;
  display:grid;place-items:center;border:1px solid transparent;border-radius:7px;
  background:transparent;color:var(--fg-3);cursor:pointer;
  transition:background var(--loc-hover) var(--ease-out),color var(--loc-hover) var(--ease-out),
    border-color var(--loc-hover) var(--ease-out)}
.row.sec .fcbtn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.10);color:var(--fg)}
.row.sec .fcbtn svg.i{width:13px;height:13px;opacity:1;color:currentColor;
  transition:transform var(--loc-panel) var(--ease-out)}
.row.sec.open .fcbtn svg.i{transform:rotate(90deg)}
.row.sec.open .fcbtn{color:var(--fg-2)}
.row{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;margin:1px 8px;
  border-radius:7px;cursor:pointer;transition:background .12s var(--ease);position:relative}
.row:hover{background:var(--surface)}
.row.on{background:var(--surface-2)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--fg-2)}
.row.on .nm{color:var(--fg);font-weight:600}
.row .ct{color:var(--fg-3);font-size:11.5px;font-variant-numeric:tabular-nums;transition:opacity .12s}
.row.on .ct{color:var(--fg-2)}
/* 行尾固定槽位：数量 ↔ 折叠按钮，互相替换不推动布局 */
.row .rt{position:relative;width:44px;height:22px;flex:none;display:flex;align-items:center;
  justify-content:flex-end}
.row .mv{position:absolute;right:0;top:50%;transform:translateY(-50%);
  border:1px solid var(--line-2);background:var(--surface-3);color:var(--fg-2);
  font:inherit;font-size:11px;line-height:1;padding:3px 7px;border-radius:var(--r-xs);cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .12s,background .12s,color .12s}
.row:hover .mv{opacity:1;pointer-events:auto}
.row .mv:hover{background:var(--surface-4);color:var(--fg)}
.row:hover .rt .ct{opacity:0}
.row.alb.dragging{opacity:.4}
.row.alb.over{box-shadow:inset 0 0 0 1px var(--accent-line);background:var(--accent-weak)}
/* 拖动排序时的插入位置指示：上半→插到上面，下半→插到下面 */
.row.alb.ins-top{box-shadow:inset 0 2px 0 var(--accent)}
.row.alb.ins-bottom{box-shadow:inset 0 -2px 0 var(--accent)}
/* ===== 左侧：照片 / 视频 / 最近删除 三个一级分类固定，中间的相簿列表自己滚 ===== */
/* 相册左栏：照片 / 视频 / 最近删除在同一条列表里，整栏一起滚 */
#left.gal{display:block;overflow:auto;overscroll-behavior:contain}
/* 一级分类的字号/字重必须压过二级，否则「照片」看着比「全部照片」还小 */
.row.sec .nm{font-size:14px;font-weight:600;color:var(--fg)}
/* 二级相簿跟「照片」的文字左对齐（10 内边距 + 15 图标 + 9 间距） */
.row.alb{padding-left:34px}
.row.alb .nm{font-size:13px}
.lockic{width:13px;height:13px;flex:none;color:var(--fg-4)}
/* 「折叠」是相簿列表内部的小分组，不是一级分类：
   文字和相簿名对齐（行外边距 8 + 34），字号/行高更轻，不能跟照片/视频/最近删除平级 */
.foldh{display:flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 34px;margin:4px 8px 1px;
  border-radius:7px;cursor:pointer;color:var(--fg-4);font-size:11.5px;font-weight:500;
  letter-spacing:.02em;user-select:none}
.foldh:hover{background:var(--surface);color:var(--fg-3)}
.foldh .ct{margin-left:auto;font-size:11px;color:var(--fg-4);font-variant-numeric:tabular-nums}
.foldh .fc{width:13px;height:13px;flex:none;margin-left:4px;
  transition:transform .16s var(--ease)}
.foldh.open .fc{transform:rotate(90deg)}
.foldh.over{box-shadow:inset 0 0 0 1px var(--accent-line)}

/* ---------- 子页工具条（回收站等） ---------- */
.subhead{display:flex;align-items:center;gap:8px;padding:14px 22px 10px}
.subhead > span{flex:1;color:var(--fg-3);font-size:12px}

/* ---------- 云盘行内操作（悬停出现，删除不再只藏在右键里） ---------- */
.rowacts{display:flex;gap:2px;flex:none;opacity:.45;transition:opacity .12s var(--ease)}
.item:hover .rowacts,.dcard:hover .rowacts,.item:focus-within .rowacts{opacity:1}
.rowacts button{width:28px;height:28px;border:none;background:transparent;
  color:var(--fg-3);border-radius:6px;display:grid;place-items:center;cursor:pointer}
.rowacts button svg.i{width:15px;height:15px}
.rowacts button:hover{background:var(--surface-4);color:var(--fg)}
.rowacts button.rowdel:hover{background:var(--danger-weak);color:var(--danger)}
/* 云盘：单击选中、双击打开；文件按类型给图标/颜色 */
#driveList .dentry{cursor:pointer}
#driveList .dentry.focus{background:rgba(91,141,255,.10);box-shadow:inset 0 0 0 1px rgba(91,141,255,.22)}
#driveList .dcard.dentry.focus{background:rgba(27,34,43,.92);border-color:rgba(91,141,255,.35)}
.item .ic.image,.dic.image{color:#8fb0ff;background:rgba(91,141,255,.10);border-color:rgba(91,141,255,.18)}
.item .ic.video,.dic.video{color:#ff9aa8;background:rgba(242,99,122,.10);border-color:rgba(242,99,122,.18)}
.item .ic.audio,.dic.audio{color:#7ec8d8;background:rgba(94,200,220,.10);border-color:rgba(94,200,220,.18)}
.item .ic.pdf,.dic.pdf{color:#ff8fa3;background:rgba(242,99,122,.12);border-color:rgba(242,99,122,.22)}
.item .ic.word,.dic.word{color:#8fb0ff;background:rgba(91,141,255,.12);border-color:rgba(91,141,255,.22)}
.item .ic.excel,.dic.excel{color:#7fd6a3;background:rgba(76,196,138,.12);border-color:rgba(76,196,138,.22)}
.item .ic.ppt,.dic.ppt{color:#f0a35e;background:rgba(240,163,94,.12);border-color:rgba(240,163,94,.22)}
.item .ic.archive,.dic.archive{color:#e3b25c;background:rgba(226,168,61,.12);border-color:rgba(226,168,61,.22)}
.item .ic.text,.dic.text{color:#aab4c0;background:rgba(170,180,192,.10);border-color:rgba(170,180,192,.16)}
.item .ic.code,.dic.code{color:#c39cff;background:rgba(195,156,255,.10);border-color:rgba(195,156,255,.18)}
.ftag{font:700 9px/1 var(--font);letter-spacing:.03em}
.dthumb{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
/* 云盘内部拖动：被拖起的条目半透明，落点文件夹高亮 */
#driveList .dentry.dragging{opacity:.42}
#driveList .dentry[draggable="true"]{cursor:grab}
#driveList .dentry.dragging{cursor:grabbing}

/* ---------- 云盘面包屑 ---------- */
#crumb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:12.5px;
  padding:12px 16px 8px;border-bottom:1px solid var(--line);margin-bottom:2px}
/* 面包屑右侧的视图切换（列表 / 网格） */
#crumb .vsw{margin-left:auto;display:flex;gap:2px;background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:8px;padding:2px}
#crumb .vsw button{width:26px;height:22px;border:none;background:transparent;color:var(--fg-3);
  border-radius:6px;cursor:pointer;display:grid;place-items:center;padding:0;
  transition:background .12s,color .12s}
#crumb .vsw button svg.i{width:14px;height:14px}
#crumb .vsw button:hover{color:var(--fg)}
#crumb .vsw button.on{background:var(--surface-4);color:var(--fg)}

/* 网格视图 */
#driveList.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;padding:14px 18px 22px}
#driveList.grid .sk-lines{grid-column:1/-1}
.dcard{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);cursor:default;position:relative;
  transition:background .13s var(--ease),border-color .13s var(--ease),box-shadow .13s var(--ease);
  min-width:0}
.dcard:hover{background:var(--surface-2);border-color:var(--line-3);box-shadow:var(--shadow-1)}
.dcard.click{cursor:pointer}
.dcard.sel{border-color:var(--accent-line);background:var(--accent-weak)}
.dcard .dtop{display:flex;align-items:center;gap:8px}
.dcard .dright{margin-left:auto;display:flex;align-items:center;gap:6px}
.dcard .dic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg-2)}
.dcard .dic svg.i{width:17px;height:17px}
.dcard .dic.folder{color:#e3b25c;background:rgba(226,168,61,.09);border-color:rgba(226,168,61,.16)}
/* 删除只在鼠标移上去时出现，别跟图标挤在一起 */
.dcard .rowacts{opacity:0}
.dcard:hover .rowacts,.dcard:focus-within .rowacts{opacity:1}
.dcard .dtick{width:18px;height:18px;flex:none;border-radius:5px;
  border:1.5px solid var(--line-3);cursor:pointer;display:grid;place-items:center;
  color:transparent;background:transparent;padding:0;transition:background .12s,border-color .12s,color .12s}
.dcard .dtick svg.i{width:11px;height:11px;stroke-width:2.8}
.dcard .dtick:hover{border-color:var(--accent)}
.dcard .dtick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dcard .dname{font-size:12.5px;color:var(--fg);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .dmeta{font-size:11px;color:var(--fg-4);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 拖拽到文件夹时的落点高亮 */
.item.drop-t,.dcard.drop-t{background:var(--accent-weak);
  box-shadow:inset 0 0 0 2px var(--accent-line);border-color:var(--accent-line)}
#crumb a{color:var(--fg-3);text-decoration:none;padding:3px 7px;border-radius:6px;cursor:pointer;
  transition:background .12s,color .12s}
#crumb a:hover{background:var(--surface-2);color:var(--fg)}
#crumb a.cur{color:var(--fg);font-weight:600;pointer-events:none}
#crumb .cs{color:var(--fg-4);font-size:11px;padding:0 1px}

/* ---------- 相册 ---------- */
.day{padding:20px 22px 0}
/* 相册页右侧要给时间轴留白：时间轴浮在留白上，不压照片（官方做法） */
#content .day{padding-right:66px}
.dayh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:6px 0 10px;font-size:12.5px;font-weight:600;color:var(--fg-2);
  background:linear-gradient(var(--bg) 78%,rgba(12,14,17,0))}
.dayh .n{color:var(--fg-4);font-size:11px;font-weight:400;
  padding:1px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--thumb,148px));gap:10px;padding-bottom:10px;justify-content:start}
/* 最近删除：缩略图网格（和相册同一套卡片） */
#trGrid{display:grid;grid-template-columns:repeat(auto-fill,var(--thumb,148px));gap:10px;
  padding:14px 22px 8px;justify-content:start}
.trfoot{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 34px;
  color:var(--fg-4);font-size:11.5px}
.card{position:relative;aspect-ratio:1/1;border-radius:var(--r-md);overflow:hidden;background:var(--surface);
  cursor:pointer;transition:box-shadow .16s var(--ease)}
.card{transition:transform .24s var(--ease), box-shadow .24s var(--ease)}
.card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px) scale(1.015)}
.card:active{transform:scale(.99)}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .28s var(--ease);
  -webkit-user-drag:element}
.card img.ready{opacity:1}
.card.skc{background:var(--surface-2);animation:skPulse 1.5s ease-in-out infinite}
@keyframes skPulse{0%,100%{opacity:.5}50%{opacity:.95}}
.card .ph{position:absolute;inset:0;
  background:linear-gradient(100deg,var(--surface) 25%,var(--surface-3) 45%,var(--surface) 65%);
  background-size:220% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-120% 0}}
.card .tick{position:absolute;left:9px;top:9px;width:21px;height:21px;border-radius:6px;z-index:2;
  background:rgba(10,12,15,.6);border:1.5px solid rgba(255,255,255,.72);display:grid;place-items:center;
  color:#fff;cursor:pointer;opacity:0;transition:opacity .13s var(--ease),background .13s,border-color .13s;
  backdrop-filter:blur(4px)}
.card .tick svg{width:12px;height:12px;stroke-width:2.8;opacity:0}
.card:hover .tick,.card.sel .tick,.card:focus-visible .tick{opacity:1}
.card.sel .tick{background:var(--accent);border-color:var(--accent);opacity:1}
.card.sel .tick svg{opacity:1}
.card.sel{box-shadow:0 0 0 2px var(--accent), var(--shadow-2)}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;
  font-size:clamp(8.5px, calc(var(--thumb,148px) * .062), 11.5px);color:#dfe5ee;
  background:linear-gradient(transparent,rgba(6,8,10,.82));pointer-events:none;
  transition:opacity .14s var(--ease);display:flex;justify-content:space-between;gap:6px;
  white-space:nowrap;overflow:hidden}
.card .meta > span{overflow:hidden;text-overflow:ellipsis}
.card .meta > span:last-child{flex:none}
.card:hover .meta{opacity:1}

.card .vt{position:absolute;right:9px;top:9px;display:flex;align-items:center;gap:4px;
  background:rgba(10,12,15,.62);border:1px solid rgba(255,255,255,.1);border-radius:99px;
  padding:2px 8px 2px 6px;font-size:11px;z-index:2;backdrop-filter:blur(4px)}
.card .vt svg{width:11px;height:11px;fill:currentColor;stroke:none}

/* ---------- 列表型页面 ---------- */
.lists{padding:4px 0 12px}
.item{display:flex;align-items:center;gap:12px;padding:11px 22px;min-height:56px;
  border-bottom:1px solid rgba(34,39,46,.7);transition:background .12s var(--ease)}
.item.click{cursor:pointer}
.item:hover{background:var(--surface)}
.item.sel{background:var(--accent-weak)}
.item .ic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--fg-3);border:1px solid var(--line)}
.item .ic svg.i{width:16px;height:16px}
.item .ic.folder{color:#e3b25c;background:rgba(226,168,61,.09);border-color:rgba(226,168,61,.16)}
.item .ic.audio{color:var(--accent);background:var(--accent-weak);border-color:rgba(91,141,255,.18)}
.item .main{flex:1;min-width:0}
.item .t1{font-size:13.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{color:var(--fg-3);font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.item .rt{color:var(--fg-4);display:grid;place-items:center}
.item .rt svg.i{width:15px;height:15px}
.tick2{width:19px;height:19px;flex:none;border-radius:6px;border:1.5px solid var(--line-3);cursor:pointer;
  display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s,color .12s;
  background:transparent;padding:0}
.tick2 svg{width:12px;height:12px;stroke-width:2.8}
.tick2:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.tick2.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.rec-del{flex:none;width:26px;height:26px;border:none;background:transparent;color:var(--fg-4);
  border-radius:7px;cursor:pointer;display:grid;place-items:center;opacity:0;
  transition:opacity .13s,background .13s,color .13s}
.item:hover .rec-del{opacity:1}
.rec-del:hover{background:var(--danger-weak);color:var(--danger)}
.rec-del svg.i{width:14px;height:14px}

/* 录音行内播放器 */
.player{display:flex;align-items:center;gap:9px;flex:none;width:196px}
.player .pp{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--line-3);
  background:var(--surface-2);color:var(--fg);cursor:pointer;display:grid;place-items:center;
  transition:background .12s,border-color .12s;padding:0}
.player .pp:hover{background:var(--surface-4);border-color:var(--fg-4)}
.player .pp svg.i{width:12px;height:12px}
.player .bar{flex:1;height:3px;border-radius:2px;background:var(--surface-4);position:relative;
  cursor:pointer}
.player .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--accent);
  transition:width .12s linear}
.player .tm{font-size:10.5px;color:var(--fg-3);min-width:32px;text-align:right;
  font-variant-numeric:tabular-nums}

/* ---------- 笔记 ---------- */
#noteShell{display:flex;height:100%;min-height:0}
#noteList{width:300px;flex:0 0 300px;border-right:1px solid var(--line);overflow:auto;background:var(--bg-2)}
#noteReader{flex:1;overflow:auto;min-width:0;background:var(--bg)}

/* 笔记列表顶部的分类 chips：换行排布，永远不会有「看不见的」分类 */
.nhead{position:sticky;top:0;z-index:6;background:var(--bg-2)}
/* 分类太多时给个上限，避免把笔记列表挤没；滚动条保持可见，一眼能看出还有更多 */
.notefilter{display:flex;flex-wrap:wrap;gap:5px;padding:9px 12px 10px;border-bottom:1px solid var(--line);
  background:var(--bg-2);max-height:264px;overflow-y:auto}
/* 分类多到需要滚动时，右边留一条细滚动条，提示「还有更多」 */
.notefilter::-webkit-scrollbar{width:7px}
.notefilter::-webkit-scrollbar-thumb{background:#3a424c;border-radius:8px;border:2px solid transparent;
  background-clip:content-box}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:99px;border:1px solid var(--line-2);background:transparent;color:var(--fg-2);
  font:inherit;font-size:12px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.chip em{font-style:normal;color:var(--fg-4);font-size:11px;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--surface-2);color:var(--fg)}
.chip.on{background:var(--accent-weak);border-color:var(--accent-line);color:#c2d2ff;font-weight:600}
.chip.on em{color:#93aef0}

/* 笔记多选条：固定在笔记列表栏的最底部，不再是列表上面的一条 */
.notebar{display:none;align-items:center;gap:5px;padding:7px 10px;flex:none;
  border-top:1px solid var(--line);background:rgba(13,16,21,.94);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.notebar.on{display:flex}
.notebar .cnt{flex:1;min-width:0;color:var(--fg);font-size:11.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notebar .btn{padding:0 8px;font-size:11.5px;flex:none}
/* 笔记左栏：上面列表自己滚，下面多选条固定 */
#noteLeft{width:300px;flex:0 0 300px;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg-2)}
#noteLeft #noteList{width:auto;flex:1;min-height:0;border-right:none;background:transparent}

/* 笔记列表的「读取中」行：形状跟真实的一条笔记一致，不做方块骨架 */
.note-load{display:flex;align-items:center;gap:7px;padding:14px 14px;color:var(--fg-3);
  font-size:12px;border-bottom:1px solid rgba(34,39,46,.6)}

.note{display:flex;gap:9px;padding:11px 14px;cursor:pointer;
  border-bottom:1px solid rgba(34,39,46,.6);position:relative;transition:background .12s var(--ease)}
.note:hover{background:var(--surface)}
.note.on{background:var(--surface-2)}
.note.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.note.sel{background:var(--accent-weak)}
.note .ncb{width:18px;height:18px;flex:none;margin-top:2px;border-radius:5px;
  border:1.5px solid var(--line-3);display:grid;place-items:center;color:#fff;opacity:0;
  transition:opacity .12s,background .12s,border-color .12s}
.note .ncb svg{width:11px;height:11px;stroke-width:2.8;opacity:0}
.note:hover .ncb{opacity:1}
#noteList.picking .ncb{opacity:1}
.note.sel .ncb{opacity:1;background:var(--accent);border-color:var(--accent)}
.note.sel .ncb svg{opacity:1}
.note.sel{box-shadow:inset 2px 0 0 var(--accent)}
.note .nmain{flex:1;min-width:0}
.note .h{display:flex;gap:8px;align-items:baseline}
.note .ti{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
  color:var(--fg)}
.note .dt{color:var(--fg-4);font-size:11px;white-space:nowrap}
.note .pv{color:var(--fg-3);font-size:12px;margin-top:3px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

#notePad{padding:30px 40px 40px;max-width:860px;margin:0 auto}
/* 阅读页：正文自己滚，创建/修改/解密信息固定在底部一条栏里 */
#noteScroll{flex:1;min-height:0;overflow:auto}
#noteMeta{flex:none;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:9px 40px;color:var(--fg-4);font-size:11.5px;
  border-top:1px solid var(--glass-line);background:rgba(9,11,16,.78);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 -10px 24px -22px rgba(0,0,0,.9)}
/* 标题在左、「编辑 / 删除」在右，同一行 */
#notePad .nrow{display:flex;align-items:flex-start;gap:18px;margin:0 0 22px}
#notePad h2{font-size:22px;margin:0;font-weight:600;line-height:1.4;letter-spacing:-.015em;
  user-select:text;flex:1;min-width:0}
#notePad .nacts{display:flex;align-items:center;gap:8px;flex:none;padding-top:1px}

/* ---------- 笔记：同页实时预览编辑 ---------- */
#noteEdit{display:flex;flex-direction:column;height:100%;min-height:0}
#noteEdit .ehead{display:flex;align-items:center;gap:9px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--bg-2);flex:none}
#noteEdit .ehead input{flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--fg);font:600 16px/1.4 var(--font);padding:4px 2px;letter-spacing:-.01em}
#noteEdit .ehead input::placeholder{color:var(--fg-4);font-weight:400}
#noteEdit .ehead .dirty{color:var(--warn);font-size:11.5px;white-space:nowrap;
  padding:2px 8px;border-radius:99px;background:rgba(226,168,61,.1);border:1px solid rgba(226,168,61,.2)}
#noteEdit .etools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;
  padding:7px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
#noteEdit .etools .sep{width:1px;height:16px;background:var(--line-2);margin:0 4px}
#noteEdit .etools button{min-width:28px;height:26px;padding:0 7px;border:1px solid transparent;
  border-radius:6px;background:transparent;color:var(--fg-2);cursor:pointer;
  font:inherit;font-size:12px;line-height:1;display:inline-flex;align-items:center;
  justify-content:center;transition:background .12s,color .12s,border-color .12s}
#noteEdit .etools button:hover{background:var(--surface-3);color:var(--fg);border-color:var(--line-2)}
/* 单页所见即所得编辑区（原来是左 Markdown 右预览的分栏） */
#noteEdit .esingle{flex:1;min-height:0;overflow:auto;padding:0}
#noteEdit #neBody{max-width:860px;margin:0 auto;padding:20px 40px 90px;
  outline:none;font-size:14px;line-height:1.85;color:#d7dde4;word-break:break-word}
#noteEdit #neBody:empty:before{content:attr(data-ph);color:rgba(235,238,245,.30);font-size:15.5px}
#noteEdit #neBody h1{font-size:23px;margin:20px 0 10px;font-weight:650;line-height:1.4;color:#fff}
#noteEdit #neBody h2{font-size:18.5px;margin:18px 0 8px;font-weight:600;line-height:1.45;color:#fff}
#noteEdit #neBody h3{font-size:15.5px;margin:15px 0 6px;font-weight:600;color:#fff}
#noteEdit #neBody h4{font-size:14px;margin:12px 0 5px;font-weight:600}
#noteEdit #neBody p{margin:0 0 10px}
#noteEdit #neBody ul,#noteEdit #neBody ol{margin:0 0 10px;padding-left:26px}
#noteEdit #neBody li{margin:3px 0}
#noteEdit #neBody blockquote{margin:0 0 12px;padding:9px 14px;
  border-left:2px solid var(--accent-line);background:var(--surface-2);
  border-radius:0 7px 7px 0;color:var(--fg-2)}
#noteEdit #neBody blockquote p:last-child{margin-bottom:0}
#noteEdit #neBody pre{background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;overflow:auto;font-size:12.5px;
  font-family:var(--mono);margin:0 0 12px}
#noteEdit #neBody code{background:var(--surface-3);border-radius:4px;padding:1px 5px;
  font-size:12.5px;font-family:var(--mono)}
#noteEdit #neBody pre code{background:none;padding:0}
#noteEdit #neBody a{color:var(--accent);text-decoration:none}
#noteEdit #neBody a:hover{text-decoration:underline}
#noteEdit #neBody img{max-width:100%;border-radius:8px;margin:6px 0}
#noteEdit #neBody hr{border:none;border-top:1px solid var(--line-2);margin:20px 0}
#noteEdit #neBody table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:13px}
#noteEdit #neBody th,#noteEdit #neBody td{border:1px solid var(--line-2);padding:6px 10px;text-align:left}
#noteEdit #neBody th{background:var(--surface-2);font-weight:600}

/* Markdown 正文 */
.mdbody{line-height:1.85;font-size:14px;color:#d7dde4;
  user-select:text;cursor:text;word-break:break-word}
.mdbody p{margin:0 0 9px}
.mdbody .mdgap{height:9px}
.mdbody .mdh{margin:22px 0 8px;color:#fff;line-height:1.4;letter-spacing:-.01em}
.mdbody h1.mdh{font-size:21px}
.mdbody h2.mdh{font-size:18px}
.mdbody h3.mdh{font-size:16px}
.mdbody h4.mdh,.mdbody h5.mdh,.mdbody h6.mdh{font-size:14px}
.mdbody .mdlist{margin:6px 0 10px;padding-left:22px}
.mdbody .mdlist li{margin:3px 0}
.mdbody li.task{list-style:none;display:flex;gap:9px;align-items:flex-start;margin:6px 0}
.mdbody li.task .cb{width:17px;height:17px;flex:none;margin-top:3px;border-radius:5px;
  border:1.5px solid var(--line-3);display:grid;place-items:center;font-size:11px;color:#fff;line-height:1}
.mdbody li.task.done .cb{background:var(--ok);border-color:var(--ok)}
.mdbody li.task.done>span:last-child{color:var(--fg-3);text-decoration:line-through}
.mdbody blockquote{margin:12px 0;padding:9px 14px;border-left:2px solid var(--accent);
  background:var(--accent-weak);border-radius:0 var(--r-sm) var(--r-sm) 0;color:#c3ccd8}
.mdbody .mdpre{margin:12px 0;padding:12px 14px;background:#0a0c0f;border:1px solid var(--line);
  border-radius:var(--r-sm);overflow:auto}
.mdbody .mdpre code{background:none;padding:0;font-size:12.5px;line-height:1.7}
.mdbody code{background:var(--surface-3);border-radius:5px;padding:1px 5px;font-size:12.5px;
  font-family:var(--mono)}
.mdbody hr{border:none;border-top:1px solid var(--line-2);margin:20px 0}
.mdbody .mdlink{color:#8fb0ff;text-decoration:none;border-bottom:1px solid rgba(143,176,255,.3)}
.mdbody .mdlink:hover{border-bottom-color:#8fb0ff}
.mdbody .mdimg{max-width:100%;border-radius:var(--r-sm);display:block;margin:12px 0;cursor:zoom-in;
  background:#0a0c0f}
.mdbody .mdtable{overflow:auto;margin:12px 0}
.mdbody table{border-collapse:collapse;font-size:13px;min-width:60%}
.mdbody th,.mdbody td{border:1px solid var(--line-2);padding:7px 11px;text-align:left}
.mdbody th{background:var(--surface);font-weight:600}

/* ---------- 代办 ---------- */
#todoWrap{padding:16px 0 56px;max-width:940px;margin:0 auto}
/* 待办分页条：放在列表最下面（翻页是看完这一页才做的事，不占顶部） */
#todoPager{position:static;display:flex;align-items:center;gap:10px;
  margin:20px 20px 0;padding:6px 10px;border-radius:var(--r-md);
  background:rgba(11,14,19,.55);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 20px -16px rgba(0,0,0,.8)}
#todoPager .pinfo{flex:1;min-width:0;color:var(--fg-3);font-size:11.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#todoPager .pctl{display:flex;align-items:center;gap:2px;flex:none}
#todoPager .pg,#todoPager .pgbtn{height:26px;min-width:26px;padding:0 7px;border:1px solid transparent;
  border-radius:6px;background:transparent;color:var(--fg-2);font:inherit;font-size:11.5px;
  line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s,border-color .12s}
#todoPager .pg:hover,#todoPager .pgbtn:hover{background:rgba(255,255,255,.06);color:var(--fg)}
#todoPager .pg.on{background:var(--accent-weak);border-color:var(--accent-line);color:#c2d2ff;
  font-weight:600}
#todoPager .pgbtn{font-size:15px;color:var(--fg-3)}
#todoPager .pgbtn:disabled{opacity:.3;cursor:default;background:transparent;color:var(--fg-3)}
#todoPager .pgap{color:var(--fg-4);font-size:11px;padding:0 1px}
#todoPager .pnote{color:var(--fg-4);font-size:11px;white-space:nowrap;margin-left:4px;
  font-variant-numeric:tabular-nums}
.todoHd{display:flex;align-items:center;gap:9px;padding:14px 20px 10px;color:var(--fg-3);
  font-size:12px}
.todoHd svg.i{width:15px;height:15px;color:var(--accent)}
.todoHd b{color:var(--fg);font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.todoHd .n2{margin-left:auto;color:var(--fg-2);font-size:11.5px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:99px;
  padding:2px 9px;font-variant-numeric:tabular-nums}
#todoBody{display:flex;flex-direction:column;gap:12px;margin:0 20px}

/* 一条代办 = 一张独立卡片（用户要求：不要堆成一张大表） */
.todo{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);
  transition:background .13s var(--ease),border-color .13s var(--ease),transform .13s var(--ease);
  position:relative}
.todo:hover{background:var(--surface-2);border-color:var(--line-3);transform:translateY(-1px)}
/* 悬停时左侧一条细亮线 */
.todo::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;
  border-radius:2px;background:transparent;transition:background .13s var(--ease)}
.todo:hover::before{background:var(--accent-line)}

/* 勾选框：圆角方框，勾上后变绿并轻微放大 */
.todo .bx{width:20px;height:20px;flex:none;margin-top:0;border-radius:6px;
  border:1.5px solid var(--line-3);display:grid;place-items:center;color:#fff;
  cursor:pointer;background:transparent;padding:0;
  transition:background .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease)}
.todo .bx svg{width:12px;height:12px;stroke-width:3;opacity:0;
  transition:opacity .14s var(--ease)}
.todo .bx:hover{border-color:var(--accent);background:var(--accent-weak)}
.todo .bx:active{transform:scale(.9)}
.todo.done .bx{background:var(--ok);border-color:var(--ok)}
.todo.done .bx svg{opacity:1}

/* 正文 */
.todo .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.6;user-select:text;
  word-break:break-word;color:var(--fg);padding-top:1px}
.todo .tx > .ttl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;transition:color .14s var(--ease)}
.todo.done .tx > .ttl{color:var(--fg-4);
  text-decoration:line-through;text-decoration-color:var(--line-3);
  text-decoration-thickness:1px}

/* 子项：小方框 + 文字，和父项缩进对齐 */
.todo .sub{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.todo .sub div{color:var(--fg-2);font-size:12.5px;line-height:1.55;display:flex;
  gap:8px;align-items:flex-start}
.todo .sub div .sdot{width:13px;height:13px;flex:none;margin-top:2px;border-radius:4px;
  border:1.5px solid var(--line-3);display:grid;place-items:center;color:#fff}
.todo .sub div .sdot svg{width:9px;height:9px;stroke-width:3;opacity:0}
.todo .sub div.s .sdot{background:var(--ok);border-color:var(--ok)}
.todo .sub div.s .sdot svg{opacity:1}
.todo .sub div.s > span{color:var(--fg-4);text-decoration:line-through;
  text-decoration-color:var(--line-3)}
.todo .sub div > span{flex:1;min-width:0;word-break:break-word}

/* 时间 */
.todo .dt{color:var(--fg-4);font-size:11px;white-space:nowrap;margin-top:3px;
  font-variant-numeric:tabular-nums;flex:none;letter-spacing:.01em;
  margin-right:6px;min-width:52px;text-align:right}

/* 行内操作：编辑 + 删除。常驻但很淡，悬停才变清晰 ——
   全隐藏的话用户根本发现不了待办能改。 */
.todo .acts{display:flex;align-items:center;gap:2px;flex:none;margin-top:-2px;
  opacity:.45;transition:opacity .13s var(--ease)}
.todo:hover .acts,.todo:focus-within .acts{opacity:1}
.todo .acts button{width:28px;height:28px;border:none;background:transparent;
  color:var(--fg-3);border-radius:7px;cursor:pointer;display:grid;place-items:center;
  padding:0;transition:background .13s var(--ease),color .13s var(--ease)}
.todo .acts button svg.i{width:14px;height:14px}
.todo .acts button:hover{background:var(--surface-4);color:var(--fg)}
.todo .acts button.del:hover{background:var(--danger-weak);color:var(--danger)}

/* 「全部」视图里的分隔条：未完成 → 已完成 */
.todoSplit{display:flex;align-items:center;gap:12px;margin:24px 20px 10px;
  color:var(--fg-3);font-size:11.5px;letter-spacing:.05em;font-weight:600}
.todoSplit::before,.todoSplit::after{content:"";flex:1;height:1px;background:var(--line-2)}
.todoSplit em{font-style:normal;color:var(--fg-4);font-weight:400;letter-spacing:0;
  font-variant-numeric:tabular-nums;margin-left:2px}
#todoMore{margin:16px auto 0;display:block}

/* ---------- 空状态 / 加载 / 骨架 ---------- */
.empty{padding:72px 20px;text-align:center;color:var(--fg-3);font-size:12.5px;line-height:1.9}
.empty .big2{margin-bottom:12px;color:var(--fg-4);display:flex;justify-content:center}
.sentinel{padding:20px;text-align:center;color:var(--fg-4);font-size:11.5px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line-3);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#btnRefresh.spin svg{animation:sp .8s linear infinite}
.sk{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-3) 37%,var(--surface) 63%);
  background-size:400% 100%;animation:skmove 1.5s ease infinite;border-radius:var(--r-sm)}
@keyframes skmove{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:20px 22px}
.sk-grid .sk{aspect-ratio:1/1;border-radius:var(--r-md)}
.sk-lines{padding:22px;display:flex;flex-direction:column;gap:12px}
.sk-lines .sk{height:44px;border-radius:var(--r-sm)}
.sk-hd{height:14px;width:180px;margin:0 22px 4px}
/* 列表页首次加载的占位行：外面是真实行的盒子（.item / .todo / .dcard），
   里面只放会呼吸的 .sk 块，行高和内容位置跟加载完的样子一致，不会整块跳。 */
.skrow{pointer-events:none;user-select:none}
.skrow .bx,.skrow .ic,.skrow .dic{opacity:.5}

/* ---------- 新建弹窗 ---------- */
#modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(5,7,9,.66);animation:fadein .14s var(--ease)}
#modal.on{display:flex}
.mbox{width:560px;max-width:92vw;max-height:88vh;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow-3);display:flex;flex-direction:column;gap:12px;
  animation:pop .18s var(--ease)}
.mbox h3{margin:0;font-size:14.5px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.mbox input,.mbox textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--r-sm);color:var(--fg);font:inherit;font-size:13px;padding:9px 11px;outline:none;
  transition:border-color .13s,box-shadow .13s}
.mbox input:focus,.mbox textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.mbox textarea{height:230px;resize:vertical;line-height:1.7;font-family:var(--mono);font-size:12.5px}
.mtools{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.mtools .sep{width:1px;height:16px;background:var(--line-2);margin:0 4px}
.mtools button{min-width:28px;height:26px;padding:0 7px;border:1px solid transparent;border-radius:6px;
  background:transparent;color:var(--fg-2);font:inherit;font-size:12px;cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;gap:4px;transition:background .12s,color .12s,border-color .12s}
.mtools button:hover{background:var(--surface-3);color:var(--fg);border-color:var(--line-2)}
.mtools button svg.i{width:13px;height:13px}
#msubWrap{display:flex;flex-direction:column;gap:8px}
.msubs{display:flex;flex-direction:column;gap:6px}
.msub{display:flex;gap:8px;align-items:center}
.msub .sbox{width:20px;height:20px;flex:none;border-radius:5px;border:1.5px solid var(--line-3);
  background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;
  transition:background .14s var(--ease),border-color .14s var(--ease)}
.msub .sbox svg.i{width:11px;height:11px;stroke-width:3;opacity:0}
.msub .sbox:hover{border-color:var(--accent);background:var(--accent-weak)}
.msub .sbox.on{background:var(--ok);border-color:var(--ok)}
.msub .sbox.on svg.i{opacity:1}
.msub input{flex:1;min-width:0}
.msub .del{width:26px;height:26px;flex:none;border:none;background:transparent;color:var(--fg-4);
  cursor:pointer;border-radius:7px;display:grid;place-items:center;padding:0;
  transition:background .13s var(--ease),color .13s var(--ease)}
.msub .del svg.i{width:13px;height:13px}
.msub .del:hover{background:var(--danger-weak);color:var(--danger)}
#mAddSub{align-self:flex-start}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}

/* ---------- 确认框 / 输入框 ---------- */
#confirm{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(5,7,9,.66);animation:fadein .14s var(--ease)}
#confirm.on{display:flex}
.ovl{position:fixed;inset:0;z-index:93;display:flex;align-items:center;justify-content:center;
  background:rgba(5,7,9,.7);animation:fadein .14s var(--ease)}
.cbox{width:392px;max-width:90vw;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-3);display:flex;flex-direction:column;
  gap:16px;animation:pop .18s var(--ease)}
.cbox p{margin:0;font-size:13px;line-height:1.75;color:#d3dae2}
.cbox .ctitle{font-size:13.5px;font-weight:600;color:var(--fg)}
.cbox .cin{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--r-sm);color:var(--fg);padding:9px 11px;font:inherit;font-size:13px;outline:none;
  transition:border-color .13s,box-shadow .13s}
.cbox .cin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
/* 缓存面板里的明细表 */
.cbox .chint{margin:-6px 0 0;font-size:12px;line-height:1.7;color:var(--fg-3)}
.clist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;background:var(--bg-2)}
.crow{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12.5px;
  border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow .cn{flex:1;color:var(--fg-2)}
.crow .cc{color:var(--fg-4);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:52px;
  text-align:right}
.crow .cs{color:var(--fg);font-size:12px;font-variant-numeric:tabular-nums;min-width:66px;
  text-align:right;font-weight:500}
.crow.tot{background:var(--surface-2)}
.crow.tot .cn{color:var(--fg);font-weight:600}
.crow.tot .cs{color:var(--accent);font-weight:600}
/* 设置面板 */
.cbox.wide{width:540px;max-height:86vh;overflow:auto}
.cbox .csec{margin:14px 0 2px;font-size:11px;letter-spacing:.06em;color:var(--fg-4);font-weight:600}
.cbox .srow{display:flex;align-items:center;gap:10px;margin:8px 0}
.cbox .srow .cn{flex:none;width:64px;color:var(--fg-2);font-size:12.5px}
.cbox .srow select,.cbox .srow input{flex:1;min-width:0;height:28px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);
  font:inherit;font-size:12px;padding:0 8px;outline:none}
.cbox .srow select:focus,.cbox .srow input:focus{border-color:var(--accent-line)}
.cbox .snote{font-size:11.5px;line-height:1.65;color:var(--fg-4);margin:4px 0 0}
.cbox .srow .btn{flex:none}
.cbox .acct{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.cbox .ava{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;display:grid;
  place-items:center;background:var(--surface-3);border:1px solid var(--line-2);
  color:var(--fg);font-size:18px;font-weight:600}
.cbox .ava img{width:100%;height:100%;object-fit:cover;display:block}
.cbox .an{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cbox .an b{font-size:13.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbox .an span{font-size:11.5px;color:var(--fg-4);font-variant-numeric:tabular-nums}

/* ---------- 图片 / 视频查看器 ---------- */
/* ---------- 预览器：详情面板 ---------- */
#vInfoPanel{position:fixed;right:24px;top:66px;z-index:72;width:334px;display:none;
  background:var(--surface-2);border:1px solid var(--line-3);border-radius:14px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden}
#vInfoPanel.on{display:block;animation:fadein .12s var(--ease)}
#vInfoPanel .ihd{display:flex;align-items:center;padding:11px 14px;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--fg)}
#vInfoPanel .ihd b{flex:1}
#vInfoPanel .ihd button{width:24px;height:24px;border:none;background:transparent;
  color:var(--fg-3);border-radius:6px;display:grid;place-items:center;cursor:pointer}
#vInfoPanel .ihd button:hover{background:var(--surface-4);color:var(--fg)}
#vInfoPanel .ihd button svg.i{width:14px;height:14px}
#vInfoPanel .ibody{padding:8px 14px 12px;max-height:58vh;overflow:auto}
#vInfoPanel .irow{display:flex;gap:12px;padding:7px 0;font-size:12px;line-height:1.5}
#vInfoPanel .irow + .irow{border-top:1px solid var(--line)}
#vInfoPanel .ik{flex:none;width:62px;color:var(--fg-4)}
#vInfoPanel .iv{flex:1;min-width:0;color:var(--fg-2);word-break:break-all;user-select:text}
#vInfoPanel .ifoot{padding:0 14px 14px}

#viewer{position:fixed;inset:0;background:rgba(4,5,7,.97);z-index:70;display:none;
  flex-direction:column;user-select:none;animation:viewerIn .34s cubic-bezier(.22,.61,.36,1)}
@keyframes viewerIn{from{opacity:0}to{opacity:1}}
#viewer.closing{opacity:0;transition:opacity .48s ease-out}
#viewer .top{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 16px;
  color:#dfe5ee;border-bottom:1px solid rgba(255,255,255,.05)}
#viewer .top .nm{font-size:13px;font-weight:600;max-width:32vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#viewer .top .mt{color:var(--fg-3);font-size:11.5px;font-variant-numeric:tabular-nums}
#viewer .top .btn.ghost{color:#dde4ec;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
#viewer .top .btn.ghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
#viewer .stage{flex:1;position:relative;overflow:hidden;display:flex;
  align-items:center;justify-content:center;
  background-repeat:no-repeat;background-position:center;background-size:contain;
  transition:background-image .12s linear}
/* 图片按原始像素布局，靠 transform 缩放（百分比 max-height 在网格里会被忽略，图会被裁掉） */
#viewerImgB{pointer-events:none}
#viewer img.vimg{will-change:transform;transform-origin:center center;
  transition:transform .12s ease-out;display:block;cursor:grab;max-width:none;max-height:none}
#viewer .stage.drag img.vimg{transition:none;cursor:grabbing}
#viewer video{max-width:100%;max-height:100%;display:none;background:#000;border-radius:var(--r-sm);outline:none}
/* 视频取原片/转码期间：先显示这张视频封面（比例和视频一致），就绪后直接换成播放器 */
#viewer .vposter{display:none;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);max-width:100%;max-height:100%;border-radius:6px;
  object-fit:contain;z-index:1;pointer-events:none;
  box-shadow:0 24px 70px -40px rgba(0,0,0,.9);opacity:.92}
#viewer .vposter.on{display:block}
/* 图片预览：等大图的真实宽高确认后，按「和大图完全一致」的框、同一张图接管 */
#viewer .vpreview{display:none;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);border-radius:5px;object-fit:cover;z-index:1;
  pointer-events:none;opacity:.95}
#viewer .vpreview.on{display:block}
#videoBar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:none;align-items:center;gap:10px;
  padding:6px 12px;border-radius:10px;background:rgba(16,20,25,.9);border:1px solid rgba(255,255,255,.09);
  color:#dfe5ee;font-size:12px;z-index:9;max-width:82vw;backdrop-filter:blur(6px)}
#videoBar .track{width:170px;height:4px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;flex:none}
#videoBar .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .22s linear}
#videoBar .btn.xs{color:#dfe5ee;border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
#viewer .zoom{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;
  align-items:center;background:rgba(22,26,31,.94);border:1px solid var(--line-2);border-radius:99px;
  padding:4px 5px;z-index:3;box-shadow:var(--shadow-2)}
#viewer .zoom button{height:28px;min-width:30px;padding:0 8px;background:transparent;border:none;
  color:#c3ccd8;cursor:pointer;border-radius:99px;font-size:12px;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
#viewer .zoom button:hover{background:rgba(255,255,255,.1);color:#fff}
#viewer .zoom .pct{color:var(--fg-3);font-size:11.5px;min-width:48px;text-align:center;
  font-variant-numeric:tabular-nums}
#viewer .tip{position:absolute;left:20px;bottom:24px;color:#5f6874;font-size:11px;z-index:3}
/* 打开图片时先垫缩略图 + 顶部「加载中」，不再是一片空白 */
#viewer .vchip{position:absolute;left:50%;top:18px;transform:translateX(-50%);
  display:none;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;
  background:rgba(16,20,26,.72);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  color:#dfe5ee;font-size:12px;z-index:6;pointer-events:none}
#viewer .vchip.on{display:flex}
#viewer .nav{position:absolute;top:50%;margin-top:-26px;width:38px;height:52px;display:grid;
  place-items:center;background:rgba(20,24,29,.7);border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-md);color:#cfd7e3;cursor:pointer;z-index:3;opacity:0;
  transition:opacity .16s var(--ease),background .16s;font-family:inherit}
#viewer .nav:hover{background:rgba(40,46,54,.95);color:#fff}
#viewer .nav.prev{left:14px}
#viewer .nav.next{right:14px}
#viewer .nav.prev svg{transform:rotate(180deg)}
#viewer:hover .nav{opacity:1}
#viewer .nav.hide{display:none}
#viewerLoading{position:absolute;inset:0;display:none;place-items:center;color:#cfd7e3;
  background:rgba(4,5,7,.72);z-index:2;text-align:center}
/* 取原片时的加载卡片：给足留白，别再挤成一个小条 */
#viewerLoading .vbox{width:min(460px,78vw);padding:34px 32px 26px;
  background:var(--surface-2);border:1px solid var(--line-3);border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
#viewerLoading .vic{color:var(--accent);margin-bottom:16px;display:flex;justify-content:center}
#viewerLoading .vic svg.i{width:34px;height:34px;stroke-width:1.4}
#viewerLoading .vttl{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:6px}
#viewerLoading .vsub{font-size:11.5px;color:var(--fg-4);line-height:1.7;margin-bottom:18px}
#viewerLoading .vbar{width:100%;height:4px;border-radius:3px;background:var(--surface-4);
  margin:0 0 10px;overflow:hidden}
#viewerLoading .vbar i{display:block;height:100%;width:0;background:var(--accent);
  border-radius:3px;transition:width .3s var(--ease)}
#viewerLoading .vnum{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums;
  margin-bottom:22px}
#viewerLoading .vacts{display:flex;gap:10px;justify-content:center}

/* ---------- 下载条 / 提示 ---------- */
#dlbar{position:fixed;right:18px;bottom:18px;width:344px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-lg);padding:13px 15px;display:none;z-index:60;
  box-shadow:var(--shadow-3);font-size:12px;color:var(--fg-2);animation:pop .18s var(--ease)}
#dlbar b{color:var(--fg);font-weight:600;font-size:12.5px}
#dlbar .p{border-top:1px solid var(--line);margin:10px 0 0;padding-top:8px}
#dlbar .pb{height:3px;border-radius:2px;background:var(--surface-4);overflow:hidden;margin:8px 0 3px}
#dlbar .pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}

/* ---------- 拖拽上传 ---------- */
/* 只在顶部浮一条提示带，绝不铺满整屏 —— 铺满会把底下的文件夹全遮住，
   用户根本看不出会拖进哪个文件夹。落点靠目标行自己的高亮表达。 */
#dropMask{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:70;
  display:none;pointer-events:none}
#dropMask.on{display:block;animation:fadein .12s var(--ease)}
#dropMask .dbox{display:flex;align-items:center;gap:12px;
  padding:11px 18px 11px 14px;border-radius:14px;
  background:var(--surface-3);border:1px solid var(--accent-line);
  box-shadow:0 12px 32px rgba(0,0,0,.48);white-space:nowrap}
#dropMask .dbox .ic{color:var(--accent);display:flex;flex:none}
#dropMask .dbox .ic svg.i{width:22px;height:22px;stroke-width:1.6}
#dropMask .dbox h3{margin:0;font-size:13px;font-weight:600;color:var(--fg)}
#dropMask .dbox p{margin:0;color:var(--fg-3);font-size:11.5px}
#dropMask .dbox .warn{color:var(--accent);font-size:12px;font-weight:600;
  padding-left:12px;border-left:1px solid var(--line-2);max-width:340px;
  overflow:hidden;text-overflow:ellipsis}
#dropMask .dbox .warn:empty{display:none}
#content.dragging{outline:1.5px dashed var(--accent-line);outline-offset:-10px}

/* ---------- 右键菜单 ---------- */
#ctx{position:fixed;z-index:95;display:none;min-width:168px;background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:var(--r-md);padding:5px;box-shadow:var(--shadow-3)}
#ctx.on{display:block;animation:pop .12s var(--ease)}
#ctx button{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:none;
  color:var(--fg);font:inherit;font-size:12.5px;text-align:left;padding:7px 9px;border-radius:6px;
  cursor:pointer;transition:background .1s}
#ctx button:hover{background:var(--surface-4)}
#ctx button.danger{color:#ffc0cb}
#ctx button.danger:hover{background:var(--danger-weak)}
#ctx .sep{height:1px;background:var(--line);margin:4px 6px}
#ctx svg.i{width:14px;height:14px;color:var(--fg-3);opacity:.9}

/* ---------- 选择目标（相簿/文件夹）弹窗 ---------- */
#picker{position:fixed;inset:0;z-index:92;display:none;align-items:center;justify-content:center;
  background:rgba(5,7,9,.7)}
#picker.on{display:flex;animation:fadein .14s var(--ease)}
#picker .pbox{width:420px;max-width:92vw;max-height:74vh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);overflow:hidden;animation:pop .18s var(--ease)}
#picker .phd{padding:15px 18px 12px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line)}
#picker .plist{flex:1;overflow:auto;padding:6px}
#picker .plist .row{margin:1px 4px}
/* 云盘选择器顶部的路径：每一级都能点回去 */
#picker .pickpath{display:flex;flex-wrap:wrap;align-items:center;gap:1px;
  padding:6px 10px 9px;margin:0 4px 4px;border-bottom:1px solid var(--line);
  font-size:12px;color:var(--fg-4);position:sticky;top:0;z-index:1;
  background:var(--glass-3)}
#picker .pickpath a{color:var(--fg-2);cursor:pointer;padding:2px 6px;border-radius:6px;white-space:nowrap}
#picker .pickpath a:hover{background:rgba(255,255,255,.07);color:#fff}
#picker .pickpath a.cur{color:var(--fg);font-weight:600;background:rgba(255,255,255,.05)}
#picker .pickpath .cs{color:var(--fg-4);opacity:.6}
#picker .pft{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* ---------- 浮动选择条 ---------- */
#selbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,14px);z-index:58;
  display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;
  background:rgba(25,30,36,.96);border:1px solid var(--line-3);border-radius:99px;
  box-shadow:var(--shadow-3);opacity:0;pointer-events:none;
  transition:opacity .18s var(--ease),transform .18s var(--ease);backdrop-filter:blur(10px)}
#selbar.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#selbar .cnt{color:var(--fg);font-size:12.5px;font-weight:600;white-space:nowrap;padding-right:2px}
#selbar .cnt em{font-style:normal;color:var(--fg-3);font-weight:400;margin-left:6px;font-size:11.5px}
#selbar .sep{width:1px;height:18px;background:var(--line-3);margin:0 2px}
#selbar .btn{height:28px}
#selbar .btn.primary{padding:0 14px}
body.has-selbar #content{padding-bottom:58px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,10px);background:var(--surface-3);
  color:var(--fg);border:1px solid var(--line-3);border-radius:var(--r-sm);padding:9px 16px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);
  z-index:96;box-shadow:var(--shadow-2);max-width:70vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 登录 ---------- */
#login{position:fixed;inset:0;background:rgba(6,8,10,.95);backdrop-filter:blur(4px);
  display:none;z-index:80;align-items:center;justify-content:center}
#login .box{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);
  padding:26px 28px 22px;width:430px;box-shadow:var(--shadow-3)}
#login .hd{display:flex;align-items:center;gap:10px}
#login .ring{width:18px;height:18px;flex:none;border:2px solid var(--line-3);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
#login h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
#login .detail{color:var(--fg-2);font-size:12.5px;line-height:1.85;margin:12px 0 0;min-height:48px}
#login .prog{height:5px;border-radius:99px;background:var(--surface-4);overflow:hidden;margin:16px 0 8px}
#login .prog i{display:block;height:100%;width:0;border-radius:99px;
  background:var(--accent);transition:width .45s var(--ease)}
#login .prog.indet i{width:32%;animation:indet 1.3s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
#login .meta{display:flex;justify-content:space-between;color:var(--fg-3);font-size:11.5px;min-height:16px}
#login .acts{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}
#login .qrwrap p{color:var(--fg-2);font-size:12.5px;line-height:1.85;margin:10px 0 16px}
#login .qrbox{width:220px;height:220px;margin:0 auto;border-radius:var(--r-md);background:#fff;
  padding:6px;display:grid;place-items:center;position:relative}
#login img.qr{width:208px;height:208px;border-radius:var(--r-sm);display:block;object-fit:contain}
#login .qrbox::after{content:"二维码加载中 …";position:absolute;inset:0;display:grid;place-items:center;
  color:#8a929c;font-size:12px;background:#fff;border-radius:var(--r-md)}
#login .qrbox.ready::after{display:none}
#login .box{max-width:92vw}
#login .st{margin-top:14px;color:var(--fg-2);font-size:12.5px;min-height:20px;text-align:center}

/* ---------- 私密相册 ---------- */
.gate{max-width:520px;margin:0 auto;padding:76px 24px;text-align:center}
.gate .ring2{width:68px;height:68px;margin:0 auto 22px;border-radius:var(--r-xl);
  background:var(--accent-weak);border:1px solid var(--accent-line);
  display:grid;place-items:center;color:var(--accent)}
.gate h3{margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.gate p{color:var(--fg-2);font-size:13px;line-height:1.95;margin:0 auto 6px;max-width:420px}
.gate .n{color:var(--accent);font-weight:700;font-size:15px}
.gate .btn{margin-top:24px;height:36px;padding:0 24px;font-size:13px}
.gate .hint{margin-top:20px;color:var(--fg-4);font-size:11.5px;line-height:1.8}

/* =====================================================================
   云玻璃材质层（2026-11-23）
   原则：玻璃只给「浮在内容之上」的层（侧栏、顶栏、吸顶条、弹窗、浮动条），
   内容面（照片、正文、卡片）保持高不透明度，先保证看得清，再谈好看。
   ===================================================================== */

/* ---------- 环境光：极暗的三团光，静止时也有一点空气感 ---------- */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(980px 640px at 86% -14%, rgba(84,132,255,.12), transparent 62%),
    radial-gradient(700px 520px at -8% 18%, rgba(91,141,255,.075), transparent 62%),
    radial-gradient(820px 600px at -6% 104%, rgba(34,211,238,.06), transparent 60%),
    radial-gradient(720px 520px at 46% 42%, rgba(139,92,246,.045), transparent 66%),
    var(--bg)}
#ambient i{position:absolute;border-radius:50%;will-change:transform}
#ambient .a1{width:640px;height:640px;right:-180px;top:-260px;
  background:radial-gradient(circle,rgba(91,141,255,.14),rgba(91,141,255,0) 68%);
  animation:amb1 108s ease-in-out infinite alternate}
#ambient .a2{width:560px;height:560px;left:-200px;bottom:-240px;
  background:radial-gradient(circle,rgba(34,211,238,.08),rgba(34,211,238,0) 68%);
  animation:amb2 132s ease-in-out infinite alternate}
#ambient .a3{width:480px;height:480px;left:40%;top:36%;
  background:radial-gradient(circle,rgba(139,92,246,.07),rgba(139,92,246,0) 70%);
  animation:amb3 150s ease-in-out infinite alternate}
@keyframes amb1{to{transform:translate3d(-70px,60px,0)}}
@keyframes amb2{to{transform:translate3d(80px,-50px,0)}}
@keyframes amb3{to{transform:translate3d(-40px,-60px,0)}}
#side,main{position:relative;z-index:1}

/* ---------- 结构玻璃：侧栏 / 顶栏 / 左列表 ---------- */
#side{background:var(--glass-1);border-right:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(var(--blur-2)) saturate(150%);
  backdrop-filter:blur(var(--blur-2)) saturate(150%);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.025)}
header{background:var(--glass-2);border-bottom:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(var(--blur-2)) saturate(150%);
  backdrop-filter:blur(var(--blur-2)) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-hi)}
header h1{font-family:var(--font-display);font-size:15px;font-weight:650;letter-spacing:-.005em;
  max-width:36vw;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:11.5px;color:var(--fg-4)}
#left,#noteLeft{background:rgba(11,14,19,.52);border-right:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(var(--blur-1)) saturate(140%);
  backdrop-filter:blur(var(--blur-1)) saturate(140%)}
#noteReader{background:rgba(9,11,16,.42)}
#noteEdit .ehead,#noteEdit .etools{background:rgba(13,16,21,.55);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%)}
.nhead{background:rgba(11,14,19,.62);border-bottom:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%)}
.notefilter{background:transparent;border-bottom:none}
#side .foot{border-top:1px solid var(--glass-line)}

/* ---------- 侧栏导航：一条会滑动的胶囊 ---------- */
#navPill{position:absolute;top:0;left:8px;right:8px;height:34px;border-radius:var(--r-sm);
  background:linear-gradient(90deg,rgba(91,141,255,.18),rgba(91,141,255,.06));
  border:1px solid rgba(91,141,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 16px -12px rgba(0,0,0,.75);
  opacity:0;pointer-events:none;z-index:0;
  transition:transform var(--dur-3) var(--ease-out),opacity var(--dur-2) var(--ease)}
#navPill.on{opacity:1}
.nav{position:relative;z-index:1}
.nav:hover{background:rgba(255,255,255,.045)}
.nav.on{background:transparent}

/* ---------- 左列表选中态 ---------- */
.row:hover{background:rgba(255,255,255,.038)}
.row.on{background:rgba(91,141,255,.10);box-shadow:inset 0 0 0 1px rgba(91,141,255,.16)}
.row.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2px;
  border-radius:2px;background:var(--accent)}
.cachebtn:hover{background:rgba(255,255,255,.05)}
.sect{font-size:10.5px;letter-spacing:.08em;color:var(--fg-4)}

/* ---------- 内容区：卡片保持高不透明度，悬停才浮起来 ---------- */
.card{background:rgba(18,23,30,.62);border:1px solid rgba(255,255,255,.045);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  transition:transform var(--dur-3) var(--ease-out),box-shadow var(--dur-3) var(--ease-out),border-color var(--dur-2) var(--ease)}
.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.10);
  box-shadow:0 16px 36px -16px rgba(0,0,0,.75),0 3px 10px rgba(0,0,0,.35)}
.card:active{transform:translateY(-1px) scale(.996)}
.card img{transition:opacity var(--dur-4) var(--ease-out)}
.card .tick{transition:opacity var(--dur-1) var(--ease),background var(--dur-2) var(--ease),
  border-color var(--dur-2) var(--ease),transform var(--dur-2) var(--ease-out)}
.card.sel .tick{transform:scale(1.06)}
.dcard{background:rgba(20,26,34,.60);border-color:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.dcard:hover{background:rgba(27,34,43,.76);border-color:rgba(255,255,255,.12);
  box-shadow:0 14px 30px -18px rgba(0,0,0,.7)}
.todo{background:rgba(20,26,34,.55);border-color:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.todo:hover{background:rgba(27,34,43,.66);border-color:rgba(255,255,255,.12);
  box-shadow:0 14px 30px -18px rgba(0,0,0,.7)}
.note:hover{background:rgba(255,255,255,.035)}
.note.on{background:rgba(255,255,255,.05)}
.note.sel{background:rgba(91,141,255,.10)}

/* ---------- 吸顶日期条：照片从模糊底下滚过去 ---------- */
.dayh{background:rgba(10,13,17,.72);border-bottom:1px solid rgba(255,255,255,.04);
  padding:8px 0 9px;margin:0 0 2px;font-size:13px;color:var(--fg);letter-spacing:-.005em;
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  backdrop-filter:blur(18px) saturate(130%);
  box-shadow:0 12px 24px -20px rgba(0,0,0,.9)}
.dayh .n{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.09);color:var(--fg-3)}

/* ---------- 按钮：主按钮一层渐变 + 内高光 ---------- */
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.primary{background:linear-gradient(180deg,#6f9bff,#4f83f5);border-color:rgba(130,168,255,.85);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 1px 2px rgba(0,0,0,.42),0 8px 20px -10px rgba(0,0,0,.75)}
.btn.primary:hover{background:linear-gradient(180deg,#82a9ff,#5c8cf8);border-color:#8fb0ff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 2px 4px rgba(0,0,0,.42),0 12px 26px -10px rgba(0,0,0,.8)}
.btn.primary:active{background:#4a7cf0}
.btn:disabled{opacity:.45}

/* ---------- 浮动玻璃：弹窗 / 菜单 / 浮动条 / Toast ---------- */
#modal,#confirm,#picker,.ovl{background:rgba(4,6,9,.5);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
  backdrop-filter:blur(10px) saturate(120%)}
.mbox,.cbox,#picker .pbox,#login .box,#viewerLoading .vbox,#vInfoPanel,#ctx,#dlbar{
  background:var(--glass-3);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(var(--blur-3)) saturate(150%);
  backdrop-filter:blur(var(--blur-3)) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-3)}
#toast{background:var(--glass-2);border:1px solid var(--glass-line);border-radius:var(--r-md);
  -webkit-backdrop-filter:blur(var(--blur-2)) saturate(150%);
  backdrop-filter:blur(var(--blur-2)) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-2);
  transform:translate(-50%,14px) scale(.98);
  transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-3) var(--ease-out)}
#toast.on{transform:translate(-50%,0) scale(1)}
#selbar{background:var(--glass-2);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(var(--blur-3)) saturate(160%);
  backdrop-filter:blur(var(--blur-3)) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-3);
  transform:translate(-50%,16px) scale(.98);
  transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-3) var(--ease-out)}
#selbar.on{transform:translate(-50%,0) scale(1)}
#dropMask .dbox{background:var(--glass-2);border-color:rgba(91,141,255,.35);
  -webkit-backdrop-filter:blur(var(--blur-2)) saturate(150%);
  backdrop-filter:blur(var(--blur-2)) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 16px 40px -16px rgba(0,0,0,.7)}
#ctx{border-radius:var(--r-md)}
#dlbar{border-radius:var(--r-lg)}

/* ---------- 查看器：相册变成一层虚化的底 ---------- */
#viewer{background:rgba(3,4,7,.78);
  -webkit-backdrop-filter:blur(30px) saturate(115%);
  backdrop-filter:blur(30px) saturate(115%)}
#viewer .top{background:rgba(9,12,17,.58);border-bottom:1px solid rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%)}
#viewer img.vimg{box-shadow:0 34px 90px -24px rgba(0,0,0,.85)}
#viewer .zoom,#videoBar{background:var(--glass-2);border-color:var(--glass-line);
  -webkit-backdrop-filter:blur(var(--blur-2)) saturate(160%);
  backdrop-filter:blur(var(--blur-2)) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-2)}
#viewer .nav{background:rgba(18,23,30,.55);border-color:rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%)}
#viewer .nav:hover{background:rgba(32,39,48,.82)}
#vInfoPanel{border-radius:var(--r-lg)}
#login{background:rgba(5,7,10,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

/* 时间轴悬停气泡 */
#tl .bubble{background:var(--glass-2);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-2)}
#tl .tick .yr{background:transparent}

/* ---------- 空状态：玻璃圆盘 + 标题 + 提示 ---------- */
.empty{color:var(--fg-3);font-size:12.5px;line-height:1.9}
/* 内容区整块的空状态/加载态：垂直居中，别吊在顶部 */
#content > .empty{min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 20px}
.empty .big2{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;
  background:var(--glass-2);border:1px solid var(--glass-line);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  display:grid;place-items:center;color:var(--fg-2)}
.empty .big2 svg.i.xl{width:28px;height:28px}
.empty .ehint{color:var(--fg-4);font-size:11.5px;margin-top:8px}
.imgfail{position:absolute;inset:0;display:grid;place-items:center;border:none;
  background:rgba(15,19,25,.55);color:var(--fg-3);font:inherit;font-size:11.5px;
  cursor:pointer;z-index:1;transition:background var(--dur-2) var(--ease),color var(--dur-2)}
.imgfail:hover{background:rgba(24,30,38,.72);color:var(--fg)}

/* ---------- 滚动条 / 选区 / 光标 ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border:3px solid transparent;
  border-radius:99px;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26);background-clip:content-box}
#left.gal::-webkit-scrollbar{width:9px}
#left.gal::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);
  border:3px solid transparent;border-radius:99px;background-clip:content-box}
#left.gal::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);background-clip:content-box}
::selection{background:rgba(91,141,255,.32);color:#fff}
body,textarea,input{caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:focus-visible,.iconbtn:focus-visible{outline-offset:3px}

/* ---------- 阅读排版 ---------- */
#notePad{max-width:780px}
#noteEdit #neBody{max-width:780px;font-size:14.5px;line-height:1.9;letter-spacing:.012em}
/* 编辑器的标题、工具条、按钮和正文共用同一条文字列：读/编辑切换时文字不横跳 */
#noteEdit .ehead,#noteEdit .etools{
  padding-left:max(40px, calc((100% - 780px) / 2 + 40px));
  padding-right:max(40px, calc((100% - 780px) / 2 + 40px))}
.mdbody{font-size:14.5px;line-height:1.9;letter-spacing:.012em;color:#dbe2ea}
#notePad h2{font-family:var(--font-display)}

/* =====================================================================
   统一交互语言（2026-11-24）
   一类东西只允许一种做法：左栏/行/卡/勾选/按钮/工具条/排版/动效。
   这个区块放在所有组件规则之后，靠后覆盖前面各页的零散写法。
   ===================================================================== */
:root{
  --panel-w:260px;
  --row-h:36px;
  --row-h-lg:56px;
  --ctl-sm:26px;
  --ctl:28px;
  --ctl-lg:32px;
  --loc-hover:120ms;
  --loc-press:80ms;
  --loc-panel:200ms;
}

/* ---------- 左栏：同一个宽度 ---------- */
#left,#noteLeft{width:var(--panel-w);flex:0 0 var(--panel-w)}

/* ---------- 行：小行 36 / 内容行 56，同一套悬停与选中 ---------- */
.row{height:var(--row-h);padding:0 10px;border-radius:8px;
  transition:background var(--loc-hover) var(--ease-out),color var(--loc-hover) var(--ease-out)}
