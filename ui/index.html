/* ============================================================================
   相册：整本索引 + 视口窗口渲染（虚拟滚动）
   ----------------------------------------------------------------------------
   老做法是「一页一页往下追加」：滚动条高度只等于已加载的几百张，而时间轴画的是
   整本 16 年，两者天生对不上——蓝线按滚动进度算会「一滚到底」，按日期算又几乎
   不动。官方的结构是：滚动区永远是整本相册，照片只画视口附近的那几张。

     ① /api/gallery_months 一次拿到「每天多少张」（官方时间轴接口，0.4 秒）；
     ② 用索引算出每天的像素高度，把每天一个空壳按绝对定位摆好；
     ③ 滚动时只给视口 ±1600px 的月份取真实照片，取过的月份留在内存里复用；
     ④ 滚动条 = 整本相册；蓝线 = 滚动进度（官方公式）；跳月 = 直接改 scrollTop。
   ========================================================================== */
const gal = {
  seq: 0,
  album: null,
  video: false,
  idx: null,            // {days:[{ymd,y,m,dd,n}], at}
  geo: null,            // {thumb, gap, perRow, rowH, base}
  dayH: [], dayOff: [],
  total: 0,
  byYmd: new Map(),     // 'YYYYMMDD' -> {i, y, m, dd, n, off, h}
  byYm: new Map(),      // 'Y-M' -> {y, m, n, w, off, days:[i...]}
  cells: [],            // 时间轴刻度（按日期倒序）
  filled: new Set(),    // 已经灌过卡片的 'YYYYMMDD'
  ranges: [],           // 已成功取过数的日期区间 [[lo, hi], ...]（'YYYYMMDD'）
  fetching: false,      // 同时只发一个区间请求，别把后端压垮
  dayItems: new Map(),  // 'YYYYMMDD' -> items[]（重画占位块时贴回，不再请求）
  items: new Map(),     // id -> item
  order: [],            // 已加载条目（时间倒序），预览器上下张靠它
  raf: 0,
  flowDay: null, flowEl: null,   // 视频列表用：顺序追加时的「上一天」
  scroll: new Map(),             // '相簿id[:v]' -> 上次滚动位置，切页签/换相簿回来时恢复
};

const ymdOf = ms => { const d = new Date(ms); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); };
const ymkOf = (y, m) => y + '-' + pad(m);

/* 相册照片条目缓存（只在这次运行内，用户选的 A 方案）：
   按「相簿 + 照片/视频」存已经取到的 dayItems / items / order / ranges。
   切走再切回时直接贴真卡片，不用每个日期先铺 .card.skc 骨架再等 /api/items。 */
const GAL_MEMO = new Map();
const GAL_MEMO_MAX = 12;          // 最多留 12 本，按最近使用淘汰
function galMemoKey(id, video){ return String(id) + (video ? '|video' : '|photo'); }
function galMemoPeek(id, video){
  const v = (video === undefined) ? !!gal.video : !!video;
  return GAL_MEMO.get(galMemoKey(id, v)) || null;
}
function galMemoTouch(){
  if(gal.album == null || !gal.idx || !gal.idx.days || !gal.idx.days.length) return;
  GAL_MEMO.set(galMemoKey(gal.album, gal.video), {
    idx: gal.idx, dayItems: gal.dayItems, items: gal.items,
    order: gal.order, ranges: gal.ranges, at: Date.now(),
  });
  if(GAL_MEMO.size > GAL_MEMO_MAX){
    let oldest = null, oldAt = Infinity;
    GAL_MEMO.forEach((v, k) => { if((v.at || 0) < oldAt){ oldAt = v.at || 0; oldest = k; } });
    if(oldest) GAL_MEMO.delete(oldest);
  }
}

/* 把某一天缓存里的照片直接贴进网格；返回 false 表示这天还没缓存过 */
function galFillDay(el, ymd){
  if(!el || !gal.dayItems) return false;
  const arr = gal.dayItems.get(ymd);
  if(!arr || !arr.length) return false;
  const grid = el.querySelector('.grid');
  if(!grid) return false;
  grid.innerHTML = arr.map(it => cardHTML(it)).join('');
  const cnt = el.querySelector('.dayh .n');
  if(cnt) cnt.textContent = arr.length + ' 项';
  gal.filled.add(ymd);
  return true;
}

/* 量一次几何：一天块 = 固定开销(base) + 行数 × 行高(rowH)
   用真实 DOM 探针量，CSS 改了不用回来改常量 */
function galMeasure(){
  const c = $('#content');
  const thumb = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--thumb')) || 148;
  const gap = 14;
  const usable = Math.max(140, (c.clientWidth || 900) - 88);   // .day 左右内边距 22 / 66
  const perRow = Math.max(1, Math.floor((usable + gap) / (thumb + gap)));
  let rowH = thumb + gap, base = 56;
  try{
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;left:-19999px;top:0;width:' + (c.clientWidth || 900) + 'px;'
      + 'visibility:hidden;pointer-events:none';
    const card = `<div class="card" style="width:${thumb}px;height:${thumb}px"></div>`;
    probe.innerHTML = `<div class="day"><div class="dayh">x<span class="n">1 项</span></div>`
      + `<div class="grid">${card}</div></div>`;
    c.appendChild(probe);
    const day = probe.querySelector('.day');
    const h1 = day.getBoundingClientRect().height;
    day.querySelector('.grid').insertAdjacentHTML('beforeend', card.repeat(perRow));
    const h2 = day.getBoundingClientRect().height;
    probe.remove();
    if(h2 > h1 + 10){ rowH = h2 - h1; base = h1 - rowH; }
  }catch(e){}
  return {thumb, gap, perRow, rowH, base};
}

/* ---- 索引：每天多少张（跟官方时间轴同一个接口） ---- */
function galIndexBuild(d){
  const dc = d.days || {};
  const days = [];
  Object.keys(dc).forEach(k => {
    if(!/^\d{8}$/.test(k)) return;
    const n = Number(dc[k]) || 0;
    if(n <= 0) return;
    days.push({ymd: k, y: +k.slice(0, 4), m: +k.slice(4, 6), dd: +k.slice(6, 8), n});
  });
  days.sort((a, b) => (a.ymd < b.ymd ? 1 : (a.ymd > b.ymd ? -1 : 0)));
  return {days, at: Date.now()};
}

function galIndexFromCache(albumId){
  try{
    const s = localStorage.getItem('galidx:v2:' + albumId + (gal.video ? ':video' : ''));
    if(!s) return null;
    const o = JSON.parse(s);
    if(o && o.days && o.days.length && Date.now() - (o.at || 0) < 6 * 3600 * 1000) return o;
  }catch(e){}
  return null;
}

/* 相簿索引后台核对：先用本地 6 小时缓存秒开，再悄悄拉一次月份统计。
   只有「日期或张数真的变了」才重画，正常情况一次请求就结束，画面不动。 */
async function revalidateGalIndex(id, seq){
  if(TAB !== 'gallery' || gal.seq !== seq || !gal.idx) return;
  let d;
  try{
    d = await api('/api/gallery_months?album=' + encodeURIComponent(id)
                  + (gal.video ? '&video=1' : ''));
  }catch(e){
    return;                                  // 网络抖动就保持缓存画面
  }
  if(TAB !== 'gallery' || gal.seq !== seq || String(gal.album) !== String(id)) return;
  const idx = galIndexBuild(d);
  const old = gal.idx;
  let same = !!(old && old.days.length === idx.days.length);
  if(same){
    for(let i = 0; i < idx.days.length; i++){
      if(idx.days[i].ymd !== old.days[i].ymd || idx.days[i].n !== old.days[i].n){ same = false; break; }
    }
  }
  if(same) return;
  const c = $('#content');
  const top = c.scrollTop;
  try{ localStorage.setItem('galidx:v2:' + id + (gal.video ? ':video' : ''), JSON.stringify(idx)); }catch(_){}
  /* 只把「张数变了」的日期丢掉重取，其它日期已经缓存的照片继续贴回去，
     不再整本清空重画（那样切回相册又要闪一遍骨架）。 */
  const oldN = new Map((old.days || []).map(d => [d.ymd, d.n]));
  for(const d of idx.days){
    if(oldN.get(d.ymd) !== d.n) gal.dayItems.delete(d.ymd);
  }
  gal.idx = idx;
  gal.filled = new Set();
  gal.ranges = [];               // 允许 galWindow 重新补可见区间；已有 dayItems 的日期直接贴真卡片
  galLayout();
  galPaint();
  c.scrollTop = top;
  galWindow();
  buildTimeline();
  galMemoTouch();
}

async function galGetIndex(albumId, fresh){
  const key = 'galidx:v2:' + albumId + (gal.video ? ':video' : '');   // 照片/视频两套索引不能共用
  if(!fresh){
    try{
      const s = localStorage.getItem(key);
      if(s){
        const o = JSON.parse(s);
        if(o && o.days && o.days.length && Date.now() - (o.at || 0) < 6 * 3600 * 1000) return o;
      }
    }catch(e){}
  }
  const d = await api('/api/gallery_months?album=' + encodeURIComponent(albumId)
                      + (gal.video ? '&video=1' : ''));
  const out = galIndexBuild(d);
  try{ localStorage.setItem(key, JSON.stringify(out)); }catch(e){}
  return out;
}

/* ---- 几何：每天的高度与 offset（一次算完，后面都查表） ---- */
function galLayout(){
  const g = galMeasure();
  gal.geo = g;
  const D = gal.idx.days;
  const dayH = new Array(D.length), dayOff = new Array(D.length);
  const byYm = new Map();
  let y = 0;
  for(let i = 0; i < D.length; i++){
    const d = D[i];
    const rows = Math.max(1, Math.ceil(d.n / g.perRow));
    const h = g.base + rows * g.rowH;
    dayH[i] = h; dayOff[i] = y; y += h;
    const k = ymkOf(d.y, d.m);
    let mo = byYm.get(k);
    if(!mo){ mo = {y: d.y, m: d.m, n: 0, w: 0, off: dayOff[i], days: []}; byYm.set(k, mo); }
    mo.n += d.n; mo.w += h; mo.days.push(i);
  }
  gal.dayH = dayH; gal.dayOff = dayOff; gal.total = y;
  gal.byYm = byYm;
  gal.byYmd = new Map();
  D.forEach((d, i) => gal.byYmd.set(d.ymd, {i, y: d.y, m: d.m, dd: d.dd, n: d.n, off: dayOff[i], h: dayH[i]}));
  gal.cells = [...byYm.values()];
}

/* ---- 画占位块：只有日期条是空的，卡片等滚到才灌 ---- */
function galPaint(){
  const c = $('#content');
  const D = gal.idx.days;
  const parts = new Array(D.length);
  for(let i = 0; i < D.length; i++){
    const d = D[i];
    const ms = new Date(d.y, d.m - 1, d.dd).getTime();
    parts[i] = `<div class="day" data-ymd="${d.ymd}" data-ym="${ymkOf(d.y, d.m)}"`
      + ` style="position:absolute;left:0;right:0;top:${gal.dayOff[i]}px;height:${gal.dayH[i]}px">`
      + `<div class="dayh">${fmtDayFull(ms)}<span class="n">${d.n} 项</span></div>`
      + `<div class="grid"></div></div>`;
  }
  c.innerHTML = `<div id="vpool" style="position:relative;height:${gal.total}px">${parts.join('')}</div>`;
}

/* ---- 视口窗口：按「日期区间」取数，取过的记成已覆盖，不重复请求 ---- */
function galCovered(ymd){
  const rs = gal.ranges;
  for(let i = 0; i < rs.length; i++){
    if(ymd >= rs[i][0] && ymd <= rs[i][1]) return true;
  }
  return false;
}

function galAddRange(lo, hi){
  if(lo > hi){ const t = lo; lo = hi; hi = t; }
  const rs = gal.ranges.concat([[lo, hi]]).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  const out = [];
  for(let i = 0; i < rs.length; i++){
    const last = out[out.length - 1];
    if(last && rs[i][0] <= last[1]){ if(rs[i][1] > last[1]) last[1] = rs[i][1]; }
    else out.push([rs[i][0], rs[i][1]]);
  }
  gal.ranges = out;
}

/* offset 落在 [lo, hi] 之间的日期下标区间 */
function galIndexRange(lo, hi){
  const off = gal.dayOff, hh = gal.dayH;
  let a = 0, b = off.length - 1, i0 = off.length;
  while(a <= b){
    const m = (a + b) >> 1;
    if(off[m] + hh[m] > lo){ i0 = m; b = m - 1; } else { a = m + 1; }
  }
  let c = i0, d = off.length - 1, i1 = i0 - 1;
  while(c <= d){
    const m = (c + d) >> 1;
    if(off[m] <= hi){ i1 = m; c = m + 1; } else { d = m - 1; }
  }
  return [Math.max(0, i0), Math.min(off.length - 1, i1)];
}

/* 不依赖 requestAnimationFrame：窗口被遮挡/最小化时 rAF 会被暂停，滚动就再也不补数 */
function galPump(){
  galWindow();
}

/* 视口里的空格先摆上占位卡片：日期条和图片位立刻有骨架，不是一块黑板 */
function galSkeletonDay(el, n){
  if(!el) return;
  const grid = el.querySelector('.grid');
  if(!grid || grid.children.length) return;
  const cnt = Math.max(1, Math.min(n || 1, 80));
  let h = '';
  for(let i = 0; i < cnt; i++) h += '<div class="card skc"></div>';
  grid.innerHTML = h;
}

function galWindow(){
  if(!gal.idx || !gal.dayOff.length) return;
  const c = $('#content');
  const BUF = 2000;
  const rng = galIndexRange(c.scrollTop - BUF, c.scrollTop + c.clientHeight + BUF);
  const i0 = rng[0], i1 = rng[1];
  const D = gal.idx.days;
  const pool = $('#vpool');
  let gapStart = -1, gapEnd = -1;
  let filledAny = false;
  for(let i = i0; i <= i1; i++){
    const d = D[i];
    if(!gal.filled.has(d.ymd) && pool){
      const el = pool.querySelector(`.day[data-ymd="${d.ymd}"]`);
      /* 有缓存就先贴真卡片，没有才铺占位卡：这是「切回相册不闪骨架」的关键 */
      if(galFillDay(el, d.ymd)) filledAny = true;
      else galSkeletonDay(el, d.n);
    }
    if(!galCovered(d.ymd)){
      if(gapStart < 0) gapStart = i;
      gapEnd = i;
    }else if(gapStart >= 0){
      break;                        // 一次只补一个空洞，补完再找下一个
    }
  }
  if(filledAny) bindCards();
  if(gapStart < 0) return;
  // 索引是日期倒序的：gapStart 的日期更新、gapEnd 更旧，接口要 startDate <= endDate
  galFetchRange(D[gapEnd].ymd, D[gapStart].ymd);
}

async function galFetchRange(sd, ed){
  if(gal.fetching) return;
  gal.fetching = true;
  const mySeq = gal.seq;
  const got = [];
  try{
    for(let page = 0; page < 12; page++){
      const r = await api(`/api/items?album=${encodeURIComponent(gal.album)}`
        + `&page=${page}&limit=200&sd=${sd}&ed=${ed}` + (gal.video ? '&video=1' : ''));
      if(gal.seq !== mySeq) return;
      const items = r.items || [];
      for(let j = 0; j < items.length; j++) got.push(items[j]);
      if(r.lastPage || !items.length) break;
    }
  }catch(e){
    gal.fetching = false;
    return;                         // 失败不记覆盖，下次滚动还会再试
  }
  gal.fetching = false;
  if(gal.seq !== mySeq) return;
  galAddRange(sd, ed);
  galTakeItems(got);
  galPump();
}

/* 拿到的一批照片：按天分组贴进各自的日期块 + 记进总表（重画时贴回用） */
function galTakeItems(items){
  const pool = $('#vpool');
  if(!pool) return;
  const byDay = new Map();
  for(let i = 0; i < items.length; i++){
    const it = items[i];
    const ek = ymdOf(it.date);
    let arr = byDay.get(ek);
    if(!arr){ arr = []; byDay.set(ek, arr); }
    arr.push(it);
    gal.items.set(it.id, it);
    let all = gal.dayItems.get(ek);
    if(!all){ all = []; gal.dayItems.set(ek, all); }
    /* 缓冲命中后同一批可能再拉一次，按 id 去重，别把同一天的照片贴两遍 */
    if(!all.some(x => String(x.id) === String(it.id))) all.push(it);
  }
  byDay.forEach((arr, ek) => {
    const el = pool.querySelector(`.day[data-ymd="${ek}"]`);
    if(!el) return;
    const grid = el.querySelector('.grid');
    if(grid){
      const all = gal.dayItems.get(ek) || arr;
      grid.innerHTML = all.map(it => cardHTML(it)).join('');
      const cnt = el.querySelector('.dayh .n');
      if(cnt) cnt.textContent = all.length + ' 项';
    }
    gal.filled.add(ek);
  });
  if(items.length){
    const have = new Set(gal.order.map(x => String(x.id)));
    items.forEach(it => {
      if(!have.has(String(it.id))){ gal.order.push(it); have.add(String(it.id)); }
    });
    gal.order.sort((x, y) => (y.date || 0) - (x.date || 0));
    state.items = gal.order;
    bindCards();
  }
  galMemoTouch();
}

/* 占位块重画之后（换缩略图档位 / 改窗口大小）：把已经拿到的照片贴回去，不重新请求 */
function galRefill(){
  const pool = $('#vpool');
  if(!pool) return;
  const need = [];
  gal.dayItems.forEach((arr, ek) => {
    if(pool.querySelector(`.day[data-ymd="${ek}"]`)) need.push(ek);
  });
  for(let i = 0; i < need.length; i++){
    const ek = need[i];
    const arr = gal.dayItems.get(ek);
    const el = pool.querySelector(`.day[data-ymd="${ek}"]`);
    const grid = el ? el.querySelector('.grid') : null;
    if(!grid) continue;
    grid.innerHTML = arr.map(it => cardHTML(it)).join('');
    const cnt = el.querySelector('.dayh .n');
    if(cnt) cnt.textContent = arr.length + ' 项';
    gal.filled.add(ek);
  }
  if(need.length) bindCards();
}

/* ---- 缩略图档位 / 窗口尺寸 / 列表宽度变了：原地改日期块位置，不重画卡片 ----
   旧实现是 galPaint() 整块 innerHTML 重建，卡片的 blur-up 会重新触发，
   所以每次拖窗口都能看到缩略图闪一下。这里只改 .day 的 top/height 和
   pool 高度，已贴上的缩略图 DOM 原样保留，CSS 网格自己回流。 */
function galRelayout(){
  if(!gal.idx || !gal.idx.days || !gal.dayOff.length) return;
  const box = $('#content');
  const pool = $('#vpool');
  if(!box || !pool) return;
  const top0 = box.scrollTop;
  let a = 0, b = gal.dayOff.length - 1, cur = 0;
  while(a <= b){
    const mid = (a + b) >> 1;
    if(gal.dayOff[mid] <= top0 + 4){ cur = mid; a = mid + 1; } else { b = mid - 1; }
  }
  const ymd = gal.idx.days[cur].ymd;
  const within = Math.max(0, top0 - gal.dayOff[cur]);
  const oldH = gal.dayH[cur] || 1;
  galLayout();
  const D = gal.idx.days;
  for(let i = 0; i < D.length; i++){
    const el = pool.querySelector(`.day[data-ymd="${D[i].ymd}"]`);
    if(!el) continue;
    el.style.top = gal.dayOff[i] + 'px';
    el.style.height = gal.dayH[i] + 'px';
    /* 已有真卡片的日期不动；已经铺过骨架的日期才按新的每行数量补齐。
       空白的日期不要在这里铺，交给 galWindow 只补视口内的几块。 */
    const grid = el.querySelector('.grid');
    if(grid && !gal.filled.has(D[i].ymd) && !gal.dayItems.has(D[i].ymd) && grid.children.length){
      const need = Math.max(1, Math.min(D[i].n || 1, 80));
      if(grid.children.length !== need){
        let h = '';
        for(let k = 0; k < need; k++) h += '<div class="card skc"></div>';
        grid.innerHTML = h;
      }
    }
  }
  pool.style.height = gal.total + 'px';
  const d = gal.byYmd.get(ymd);
  const keep = d ? Math.min(within, Math.max(0, d.h - 8)) : 0;
  box.scrollTop = d ? d.off + keep : 0;
  galWindow();
  renderTimeline();
  updateTimelineActive();
}

let galRzT = 0;
window.addEventListener('resize', () => {
  clearTimeout(galRzT);
  galRzT = setTimeout(() => {
    if(TAB === 'gallery' && $('#vpool') && gal.idx) galRelayout();
  }, 180);
});

/* ---- 打开一本相册 ---- */
async function loadAlbum(id, opts){
  const o = opts || {};
  const c = $('#content');
  const top0 = c.scrollTop;
  const sameAlbum = String(gal.album) === String(id) && gal.video === !!o.video;
  /* 换相簿前记住上一本滚到哪；同一本重新加载（刷新/删除后）就沿用当前高度 */
  if(gal.album != null && gal.idx && !sameAlbum){
    gal.scroll.set(String(gal.album) + (gal.video ? ':v' : ''), top0);
  }
  const savedMap = gal.scroll.get(String(id) + (o.video ? ':v' : '')) || 0;
  /* 同一本：刷新/删除后用当前高度；从页签切回来时 renderTab 已把高度清零，
     这时改用记住的位置。 */
  const savedTop = sameAlbum ? (top0 > 0 ? top0 : savedMap) : savedMap;
  if(gal.album != null && gal.idx) galMemoTouch();     // 离开前把这一本的照片条目留在内存里
  const mySeq = ++gal.seq;
  state.album = id;
  state.videoOnly = !!o.video;
  state.trashView = false;
  state.loading = false; state.ended = false; state.page = 0;
  state.items = [];
  gal.album = id; gal.video = !!o.video;
  gal.idx = null; gal.byYm = new Map(); gal.byYmd = new Map(); gal.cells = [];
  gal.dayH = []; gal.dayOff = []; gal.total = 0;
  gal.filled = new Set(); gal.ranges = []; gal.fetching = false;
  gal.dayItems = new Map(); gal.items = new Map(); gal.order = [];
  gal.flowDay = null; gal.flowEl = null;
  /* 同一本相簿这次已经加载过：把索引 + 已取到的照片条目恢复回来，
     切回页签/换回相簿时直接贴真卡片，不再先铺 .card.skc 骨架。 */
  const memo = o.fresh ? null : galMemoPeek(id, !!o.video);
  if(memo && memo.idx && memo.idx.days && memo.idx.days.length){
    gal.idx = memo.idx;
    gal.dayItems = memo.dayItems || new Map();
    gal.items = memo.items || new Map();
    gal.order = memo.order || [];
    gal.ranges = memo.ranges || [];
    state.items = gal.order;
  }
  sel.clear(); updSel();
  c.style.overflow = 'auto';
  c.scrollTop = 0;
  tlState.album = null; tlState.months = []; tlState.cells = [];

  const alb = (state.albums || []).find(a => a.id === id);
  let title = alb ? alb.name : '相册';
  let sub = alb ? (alb.count + ' 项') : '';
  if(o.video){ title = '视频'; sub = ''; }
  else if(String(id) === '0'){ title = '全部照片'; sub = ''; }   // 不带 albumId 的整库视图
  setHead(title, sub);
  state.selHint = alb ? '· ' + alb.name : '';
  galleryChrome();

  // 索引优先用这次已加载过的；没有再读本地 6 小时缓存；都没有才等接口
  const fastIdx = o.fresh ? null : (gal.idx || galIndexFromCache(id));
  if(fastIdx){
    gal.idx = fastIdx;
    galLayout();
    galPaint();
    c.scrollTop = savedTop;
    galWindow();
    buildTimeline();
    c.onscroll = () => { galPump(); updateTimelineActive(); };
    /* 缓存索引最多 6 小时：先用它把画面顶出来，过一会儿再悄悄和云端核一次。
       手机上刚拍的照片就能补进当前相簿，不用等缓存过期或手动刷新。 */
    if(!o.fresh){
      clearTimeout(gal.revalT);
      gal.revalT = setTimeout(() => revalidateGalIndex(id, mySeq), 900);
    }
    return;
  }
  let idx;
  try{
    idx = await galGetIndex(id, !!o.fresh);
  }catch(e){
    if(String(e.message) === 'auth') return;
    if(gal.seq !== mySeq) return;
    if(TAB !== 'gallery') return;      // 页签已经切走，别把错误占位画到别的页
    hideTimeline();
    c.innerHTML = `<div class="empty">
      <div class="big2">${ICO('i-cloud','xl')}</div>
      相册索引读取失败
      <div class="ehint">网络或登录态波动时会出现，重试一次通常就好</div>
      <button class="btn outline sm" id="galRetry" style="margin-top:16px">重试</button>
    </div>`;
    const rb = $('#galRetry');
    if(rb) rb.onclick = () => loadAlbum(id, {fresh:true});
    return;
  }
  if(gal.seq !== mySeq) return;
  if(TAB !== 'gallery') return;        // 页签已经切走，迟到的索引不要再画
  if(!idx.days || !idx.days.length){
    hideTimeline();
    c.innerHTML = `<div class="empty"><div class="big2">${ICO('i-empty-photo','xl')}</div>这个相簿是空的<div class="ehint">照片上传后会自动出现在这里</div></div>`;
    return;
  }
  gal.idx = idx;
  if(gal.video) setHead('视频', idx.days.reduce((a,d)=>a+d.n,0) + ' 项');
  galLayout();
  galPaint();
  c.scrollTop = savedTop;
  galWindow();
  buildTimeline();
  c.onscroll = () => { galPump(); updateTimelineActive(); };
}

/* 相册右侧时间轴：月份刻度 + 年份标签 + 悬停气泡 + 拖动跳转
   刻度高度、蓝线位置、跳转目标都来自同一份几何（gal.byYm / gal.dayOff），
   所以三者永远对得上——这正是官方 gallery.js 的做法。 */
let tlState = { months: [], cells: [], album: null, dragging: false };

function hideTimeline(){
  const tl = $('#tl');
  if(tl){ tl.classList.remove('on'); tl.innerHTML = ''; }
  tlState.album = null; tlState.cells = [];
}

function buildTimeline(){
  const tl = $('#tl');
  if(!tl) return;
  if(typeof TAB === 'undefined' || TAB !== 'gallery' || !gal.cells.length){ hideTimeline(); return; }
  renderTimeline();
}

function renderTimeline(){
  const tl = $('#tl');
  if(!tl) return;
  if(typeof TAB === 'undefined' || TAB !== 'gallery'){ hideTimeline(); return; }
  const cells = gal.cells || [];
  if(!cells.length){ hideTimeline(); return; }
  tl.classList.add('on');
  const total = gal.total || 1;
  const H = Math.max(120, (tl.clientHeight || 600) - 20);
  let acc = 0;
  const out = [];
  for(let i = 0; i < cells.length; i++){
    const c = cells[i];
    const w = c.w / total;
    const hpx = H * w;
    // 官方阈值 10px：月份太薄不画线（以前 6px 是因为高度是猜的，现在按真实渲染算）
    let hidden = false;
    if(hpx + acc < 10){ acc += hpx; hidden = true; } else { acc = 0; }
    const next = cells[i + 1];
    const isYearLast = !next || String(next.y) !== String(c.y);
    out.push({y: c.y, m: c.m, n: c.n, w, off: c.off, hidden, isYearLast, hpx});
  }

  /* 年份标签：官方挂在「年界那个月」上；那个月太薄被隐藏时官方整个年份就不显示，
     本机实测 16 个年份只剩 2 个标签（12 月照片少，年界线全被吞掉）。
     这里挂在「该年最后一个可见月份」上，按 88px 最小间距稀释，最老的年份必留——
     滚到最底下也得看得到年份。 */
  const cand = [];
  let i = 0;
  while(i < out.length){
    const y = out[i].y;
    let j = i;
    while(j + 1 < out.length && out[j + 1].y === y) j++;
    let hit = -1;
    for(let k = j; k >= i; k--){ if(!out[k].hidden){ hit = k; break; } }
    if(hit >= 0){
      let pos = 0;
      for(let k = 0; k <= hit; k++) pos += out[k].hpx;
      cand.push({k: hit, y: y, pos: pos});
    }
    i = j + 1;
  }
  cand.sort((a, b) => a.pos - b.pos);
  const keep = [];
  let lastPos = -1e9;
  for(let n = 0; n < cand.length; n++){
    if(cand[n].pos - lastPos >= 88){ keep.push(cand[n]); lastPos = cand[n].pos; }
  }
  const oldest = cand[cand.length - 1];
  if(oldest && keep.indexOf(oldest) < 0){
    while(keep.length && oldest.pos - keep[keep.length - 1].pos < 88) keep.pop();
    keep.push(oldest);
  }
  const labels = new Map();
  keep.forEach(c => labels.set(c.k, c.y));

  tl.innerHTML = '<div class="track">' + out.map((c, i) => {
    const cls = 'tick' + (c.isYearLast ? ' last' : '') + (c.hidden ? ' hidden' : '') + (c.n ? ' has' : '');
    const lb = labels.has(i) ? `<span class="yr">${labels.get(i)}</span>` : '';
    return `<div class="${cls}" data-i="${i}" data-y="${c.y}" data-m="${c.m}" data-n="${c.n}"
      style="flex:${c.w.toFixed(6)} 0 0px">${lb}<i></i></div>`;
  }).join('') + '</div><div class="poscur"></div><div class="bubble"></div>';
  tlState.cells = out;
  tlState.years = labels.size;
  tlState.album = gal.album;
  bindTimeline(out);
  updateTimelineActive();
}

function bindTimeline(cells){
  const tl = $('#tl');
  if(!tl || !cells.length) return;
  const bubble = tl.querySelector('.bubble');
  const track = tl.querySelector('.track');
  const ticks = [...tl.querySelectorAll('.tick')];

  const idxAt = (clientY) => {
    const tr = track.getBoundingClientRect();
    if(tr.height <= 0) return -1;
    const ratio = Math.max(0, Math.min(1, (clientY - tr.top) / tr.height));
    let acc = 0;
    for(let i = 0; i < cells.length; i++){
      acc += cells[i].w;
      if(ratio <= acc + 1e-9) return i;
    }
    return cells.length - 1;
  };

  const showBubble = (clientY, idx) => {
    const c = cells[idx];
    if(!c) return;
    // 单位跟媒体类型走：视频不是「张」
    const unit = gal.video ? '个' : '张';
    bubble.innerHTML = `${c.y} 年 ${c.m} 月` + (c.n ? ` <b>${c.n} ${unit}</b>` : '');
    bubble.style.top = clientY + 'px';
    bubble.classList.add('on');
    ticks.forEach((t, k) => t.classList.toggle('hv', k === idx));
  };
  const hideBubble = () => {
    bubble.classList.remove('on');
    ticks.forEach(t => t.classList.remove('hv'));
  };

  tl.addEventListener('mousemove', e => {
    if(tlState.dragging) return;
    const i = idxAt(e.clientY);
    if(i >= 0) showBubble(e.clientY, i);
  });
  tl.addEventListener('mouseleave', hideBubble);

  // 内容全在（只是还没画），跳转就是一次赋值，不需要请求、不需要防抖
  const go = (idx) => {
    const c = cells[idx];
    if(!c) return;
    $('#content').scrollTop = c.off;
    galWindow();
    updateTimelineActive();
  };

  let curIdx = -1;
  tl.addEventListener('mousedown', e => {
    if(e.button !== 0) return;
    e.preventDefault();
    tlState.dragging = true;
    document.body.style.cursor = 'grabbing';
    const i0 = idxAt(e.clientY);
    curIdx = i0;
    if(i0 >= 0){ showBubble(e.clientY, i0); go(i0); }
    const onMove = ev => {
      const i = idxAt(ev.clientY);
      if(i < 0 || i === curIdx) return;
      curIdx = i;
      showBubble(ev.clientY, i);
      go(i);
    };
    const onUp = () => {
      tlState.dragging = false;
      document.body.style.cursor = '';
      hideBubble();
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  tl.addEventListener('wheel', e => {
    e.preventDefault();
    $('#content').scrollTop += e.deltaY;
  }, {passive: false});
}

/* 当前位置：官方就是「滚动进度」（scrollTop / scrollHeight）。滚动条现在等于
   整本相册，所以进度同时就是日期位置；刻度高亮另外按日期二分算。 */
function updateTimelineActive(){
  const tl = $('#tl');
  if(!tl || !tl.classList.contains('on')) return;
  const cells = tlState.cells || [];
  if(!cells.length) return;
  const c = $('#content');
  const track = tl.querySelector('.track');
  const poscur = tl.querySelector('.poscur');
  if(!track || !poscur) return;

  const maxTop = c.scrollHeight - c.clientHeight;
  const ratio = maxTop > 0 ? Math.max(0, Math.min(1, c.scrollTop / maxTop)) : 0;
  const tr = track.getBoundingClientRect();
  const tlR = tl.getBoundingClientRect();
  poscur.style.top = ((tr.top - tlR.top) + ratio * tr.height).toFixed(1) + 'px';
  poscur.classList.add('on');

  const off = gal.dayOff || [];
  if(!off.length || !gal.idx) return;
  let a = 0, b = off.length - 1, cur = 0;
  while(a <= b){
    const mid = (a + b) >> 1;
    if(off[mid] <= c.scrollTop + 4){ cur = mid; a = mid + 1; } else { b = mid - 1; }
  }
  const d = gal.idx.days[cur];
  if(!d) return;
  const k = ymkOf(d.y, d.m);
  const ticks = [...tl.querySelectorAll('.tick')];
  ticks.forEach((t, i) => {
    const cc = cells[i];
    if(!cc) return;
    t.classList.toggle('on', ymkOf(cc.y, cc.m) === k);
  });
}
$('#content').addEventListener('scroll', updateTimelineActive, {passive:true});

let _thumbPx = 0, _thumbKey = '';
function thumbPx(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--thumb');
  if(v !== _thumbKey){ _thumbKey = v; _thumbPx = parseFloat(v) || 148; }
  return _thumbPx;
}
/* 卡片底部一行：字号跟着缩略图大小走；窄到放不下就只留日期，绝不折成两行 */
function cardMetaHTML(it){
  const t = thumbPx();
  return `<span class="meta"><span>${fmtShort(it.date)}</span>${
    t < 150 ? '' : `<span>${fmtSize(it.size)}</span>`}</span>`;
}
function cardHTML(it){
  const isVid = it.type==='video';
  return `<div class="card${sel.has(it.id)?' sel':''}" data-key="${esc(it.id)}" tabindex="0">
    <div class="ph"></div>
    ${it.thumbUrl?`<img loading="lazy" decoding="async" src="${esc(it.thumbUrl)}" alt=""
        draggable="true" onload="imgOk(this)" onerror="imgFail(this)">`:''}
    ${isVid?`<span class="vt">${ICO('i-play','fill')}视频${it.dur? ' '+fmtClock(it.dur) : ''}</span>`:''}
    <span class="tick" role="checkbox" aria-checked="${sel.has(it.id)}" title="选择">${ICO('i-check')}</span>
    ${cardMetaHTML(it)}</div>`;
}

/* 卡片按 item.id 认，不按数组下标认：虚拟滚动下同一张卡会随月份重新渲染，
   下标会变，id 不会。 */
function bindCards(){
  $$('#content .card').forEach(c=>{
    if(c.dataset.bound) return;
    if(!c.dataset.key) return;            // 占位卡片（.skc）不绑事件
    c.dataset.bound='1';
    const key = c.dataset.key;
    const get = () => gal.items.get(key) || state.items.find(x => String(x.id) === String(key));
    c.onclick = e => {
      const it = get(); if(!it) return;
      if(e.shiftKey){
        e.preventDefault();
        const view = selViewKey();
        if(selAnchor && selAnchorView === view){
          galleryRangeSelect(it.id).then(ok => {
            if(!ok && selViewKey() === view){ sel.add(it.id); selSetAnchor(it.id); applySelToCards(); }
          });
        }else{ sel.add(it.id); selSetAnchor(it.id); applySelToCards(); }
        return;
      }
      if(e.target.closest('.tick')){ toggleSelById(it.id, c); return; }
      openViewer(it, {from: c});
    };
    c.addEventListener('keydown', e => {
      const it = get(); if(!it) return;
      if(e.key === ' '){ e.preventDefault(); toggleSelById(it.id, c); return; }
      if(e.key === 'Enter'){ e.preventDefault(); openViewer(it); return; }
      if(e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        e.preventDefault();
        const all = $$('#content .card[data-key]');
        const idx = all.indexOf(c);
        if(idx < 0) return;
        const per = (gal.geo && gal.geo.perRow) ? gal.geo.perRow : 1;
        const step = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1
                   : e.key === 'ArrowUp' ? -per : per;
        const t = all[idx + step];
        if(t){ t.focus(); t.scrollIntoView({block:'nearest'}); }
      }
    });
    const it0 = get();
    const img = c.querySelector('img');
    if(img && it0){
      img.addEventListener('dragstart', e => {
        const url = it0.fullUrl || it0.bigUrl || it0.thumbUrl;
        if(url) dragPayload(e, mediaName(it0), url, 'image/jpeg');
      });
    }
    c.addEventListener('contextmenu', e=>{
      e.preventDefault();
      const cur = get();
      if(!cur) return;
      const many = sel.size > 1 && sel.has(cur.id);
      const ids = many ? [...sel] : [cur.id];
      showCtx(e.clientX, e.clientY, [
        {text: many ? `删除选中的 ${ids.length} 项` : '删除', icon:'i-close', danger:true,
         run: ()=> askConfirm(`把 ${ids.length} 项移进回收站？可以在回收站里恢复。`, '删除',
           async ()=>{
             try{ await api('/api/photo_delete', {method:'POST',
               headers:{'Content-Type':'application/json'},
               body:JSON.stringify({ids})});
               toast('已移入回收站'); sel.clear(); updSel(); await loadAlbum(state.album, {fresh:true});
             }catch(err){ toast('删除失败：' + (err.message||'')); }
           })},
        '-',
        {text:'移动到相簿…', icon:'i-folder', run: ()=>{
          pickTarget('移动到哪本相簿', albumPickRows([cur.id, state.album]), async aid=>{
            try{ await api('/api/photo_move', {method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({ids, album:aid})});
              toast('已移动'); sel.clear(); updSel(); await loadAlbum(state.album, {fresh:true});
            }catch(err){ toast('移动失败：' + (err.message||'')); }
          });
        }},
        {text:'复制到相簿…', icon:'i-copy', run: ()=>{
          pickTarget('复制到哪本相簿', albumPickRows([cur.id, state.album]), async aid=>{
            try{ await api('/api/photo_copy', {method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({ids, album:aid})});
              toast('已复制');
            }catch(err){ toast('复制失败：' + (err.message||'')); }
          });
        }},
        '-',
        {text:'复制文件名', icon:'i-copy', run: async ()=>{
          const ok = await copyText(cur.name||'');
          toast(ok ? '已复制' : '复制失败');
        }},
      ]);
    });
  });
}

function albumPickRows(excludeId){
  // 排除当前所在相簿和系统相簿（相机/截屏）；「全部照片」不是真实相簿，不能当目标
  const skip = new Set((Array.isArray(excludeId) ? excludeId : [excludeId])
    .filter(v=>v!=null).map(String));
  return (state.albums||[])
    .filter(a=>!skip.has(String(a.id)) && a.id!=='2' && a.id!=='1')
    .map(a=>({id:a.id, name:a.name, count:a.count,
              icon:a.private?'i-lock':'i-photo'}));
}
function imgOk(img){
  img.classList.add('ready');
  const ph=img.parentNode.querySelector('.ph'); if(ph) ph.remove();
  const bad=img.parentNode.querySelector('.imgfail'); if(bad) bad.remove();
}
function imgFail(img){
  img.style.display='none';
  const card=img.parentNode;
  const ph=card.querySelector('.ph');
  if(ph){ ph.style.animation='none'; ph.style.background='var(--surface-2)'; }
  if(card.querySelector('.imgfail')) return;
  const b=document.createElement('button');
  b.type='button'; b.className='imgfail'; b.textContent='加载失败 · 点击重试';
  b.onclick=(e)=>{
    e.stopPropagation(); e.preventDefault();
    b.remove(); img.style.display='';
    const src=img.getAttribute('src')||'';
    const base=src.replace(/([?&])r=\d+/,'').replace(/[?&]$/,'');
    img.classList.remove('ready');
    img.setAttribute('src', base + (base.includes('?')?'&':'?') + 'r=' + Date.now());
  };
  card.appendChild(b);
}
function toggleSelById(id, el){
  if(id == null) return;
  const t = el ? el.querySelector('.tick') : null;
  if(sel.has(id)){ sel.delete(id); if(el) el.classList.remove('sel'); if(t) t.setAttribute('aria-checked','false'); }
  else { sel.add(id); if(el) el.classList.add('sel'); if(t) t.setAttribute('aria-checked','true'); }
  selSetAnchor(id);
  updSel();
}

/* ===== 批量选择：Shift+点选区间 =====
   和文件管理器一致：普通点击设锚点；Shift+点把锚点到目标之间全部选上，
   并替换原来的选择；锚点保持不变，再 Shift 点另一头可以重新划。 */
let selAnchor = null, selAnchorView = '';
function selViewKey(){
  if(TAB === 'gallery') return 'g:' + (state.trashView ? 't' : (state.videoOnly ? 'v' : String(state.album)));
  if(TAB === 'drive') return 'd:' + String(state.parent || 0);
  if(TAB === 'record') return 'r';
  return TAB || '';
}
function selSetAnchor(id){ selAnchor = id; selAnchorView = selViewKey(); }
function selRangeIds(list, fromId, toId){
  const arr = list || [];
  const a = arr.findIndex(x => String(x.id) === String(fromId));
  const b = arr.findIndex(x => String(x.id) === String(toId));
  if(a < 0 || b < 0) return null;
  const lo = Math.min(a,b), hi = Math.max(a,b);
  return arr.slice(lo, hi+1).map(x => x.id);
}
function applySelToCards(){
  $$('#content .card').forEach(c=>{
    const id = c.dataset.key || c.dataset.id;
    const on = sel.has(id);
    c.classList.toggle('sel', on);
    const t = c.querySelector('.tick');
    if(t) t.setAttribute('aria-checked', on ? 'true' : 'false');
  });
  $$('#content .dcard').forEach(c=>{
    const on = sel.has(c.dataset.id);
    c.classList.toggle('sel', on);
    const t = c.querySelector('.dtick');
    if(t) t.classList.toggle('on', on);
  });
  $$('#content .tick2').forEach(t=>t.classList.toggle('on', sel.has(t.dataset.id)));
  $$('#content .item').forEach(it=>it.classList.toggle('sel', sel.has(it.dataset.id)));
  updSel();
}
/* 相册是虚拟滚动：锚点和目标之间还没加载的日子，先按天补上再选 */
async function galleryRangeSelect(toId){
  if(selAnchorView !== selViewKey() || selAnchor == null) return false;
  const listNow = () => state.items || [];
  const a0 = listNow().find(x=>String(x.id) === String(selAnchor));
  const b0 = listNow().find(x=>String(x.id) === String(toId));
  if(!a0 || !b0) return false;
  const d1 = ymdOf(a0.date), d2 = ymdOf(b0.date);
  const sd = d1 < d2 ? d1 : d2, ed = d1 < d2 ? d2 : d1;
  const days = ((gal.idx && gal.idx.days) || []).filter(d => d.ymd >= sd && d.ymd <= ed);
  const missing = days.filter(d => !galCovered(d.ymd));
  if(missing.length){
    toast('正在载入这段区间的照片 …');
    for(const d of missing){
      for(let i=0; i<25 && gal.fetching; i++) await new Promise(r=>setTimeout(r,80));
      await galFetchRange(d.ymd, d.ymd);
      if(selAnchorView !== selViewKey() || TAB !== 'gallery' || state.trashView) return false;
    }
  }
  const ids = selRangeIds(listNow(), selAnchor, toId);
  if(!ids) return false;
  /* 只「加选」不清空：1~5 已选，点 8，再 Shift 点 10 → 1~5 + 8~10 */
  ids.forEach(id => sel.add(id));
  applySelToCards();
  return true;
}
function driveRangeSelect(toId){
  if(selAnchorView !== selViewKey() || selAnchor == null){
    sel.add(toId); selSetAnchor(toId); applySelToCards(); return true;
  }
  const list = (state.driveItems || []).filter(x => !x.isFolder);
  const ids = selRangeIds(list, selAnchor, toId);
  if(!ids){
    sel.add(toId); selSetAnchor(toId); applySelToCards(); return true;
  }
  ids.forEach(id => sel.add(id));
  applySelToCards();
  return true;
}
function recordRangeSelect(id){
  if(selAnchorView !== selViewKey() || selAnchor == null){
    sel.add(id); selSetAnchor(id); applySelToCards(); return true;
  }
  const ids = selRangeIds(state.records || [], selAnchor, id);
  if(!ids){
    sel.add(id); selSetAnchor(id); applySelToCards(); return true;
  }
  ids.forEach(x => sel.add(x));
  applySelToCards();
  return true;
}

/* ============ 笔记 / 代办 ============ */
/* 笔记正文内存缓存：读过的笔记再点开先给正文，不用每次都等接口。
   只放最近 30 条，切页签或重启就没了——不在磁盘上留正文。 */
const NOTE_BODY = new Map();
const NOTE_BODY_MAX = 30;
function noteBodyGet(id){ return NOTE_BODY.get(String(id)) || null; }
function noteBodyPut(id, n){
  id = String(id);
  if(!n) return;
  NOTE_BODY.delete(id);
  NOTE_BODY.set(id, n);
  while(NOTE_BODY.size > NOTE_BODY_MAX) NOTE_BODY.delete(NOTE_BODY.keys().next().value);
}
function noteBodyDrop(id){ NOTE_BODY.delete(String(id)); }

/* 笔记列表底部：读取中的一行，形状跟真实的一条笔记一样，
   不铺相册式的方块骨架，避免「骨架屏 → 笔记页」这种跳变。 */
function noteListLoading(){
  const box = $('#noteList');
  if(!box) return;
  box.innerHTML = `<div class="nhead"><div class="notefilter" id="noteFilter"></div></div>
    <div class="note-load"><span class="spinner"></span>正在读取笔记 …</div>`;
}
function noteShellEmpty(){
  const rd = $('#noteReader');
  if(rd && !rd.innerHTML.trim()){
    rd.innerHTML = `<div class="empty"><div class="big2">${ICO('i-note','xl')}</div>左边点一条笔记就开始读</div>`;
  }
}

/* 本地新建/改名/删除后先把手上的列表对齐：不等整表刷新，界面立刻一致。
   select=true 时顺手把这条标成当前选中。 */
function upsertNoteLocal(n, select){
  if(!n || n.id == null) return;
  const id = String(n.id);
  const list = state.notes = state.notes || [];
  const item = {
    id,
    title: n.title || '（无标题）',
    preview: n.preview != null ? n.preview : '（空）',
    modified: n.modified || Date.now(),
    created: n.created || n.modified || Date.now(),
    folder: String(n.folder != null ? n.folder : '0'),
    enc: !!n.enc
  };
  const i = list.findIndex(x => String(x.id) === id);
  if(i >= 0) list[i] = Object.assign({}, list[i], item);
  else list.unshift(item);
  list.sort((a, b) => (b.modified || 0) - (a.modified || 0));
  if(select) state.noteId = id;
  drawNoteList(false);        // 保留正在读的那条，不跳回第一条
}

function removeNotesLocal(ids){
  const dead = new Set((ids || []).map(String));
  state.notes = (state.notes || []).filter(n => !dead.has(String(n.id)));
  dead.forEach(noteBodyDrop);
  if(dead.has(String(state.noteId))) state.noteId = null;
}

/* 先把数据写进 state 再重画列表；silent=true 表示后台补数据，别动正在读的正文。 */
function applyNotesData(d, silent){
  if(TAB !== 'note') return;
  state.notes = d.notes || [];
  state.folders = d.folders || [];
  state.notesAt = d.at || state.notesAt || 0;
  const box = $('#noteList');
  const sc = box ? box.scrollTop : 0;
  drawNoteList(false);
  if(box) box.scrollTop = sc;
  if(silent){
    const cur = state.noteId;
    const hit = cur && state.notes.find(n => String(n.id) === String(cur));
    // 后台刷新发现当前这条改过，正文悄悄更新一次，不闪整页
    const readAt = (state.noteReadAt || {})[String(cur)];
    if(hit && readAt && hit.modified && hit.modified !== readAt) showNote(cur, {quiet:true});
  }
}

/* 打开笔记页签：
   1) 同步画出真实的双栏布局（不等接口）；
   2) 有上次的列表就先画出来（秒开），再让接口在后台补数据；
   3) 完全没有缓存时才显示「正在读取笔记」那一行。
   以前是：整块骨架屏 → 等 /api/notes 把所有页翻完 → 整页重画。 */
async function renderNotes(opt){
  const o = opt || {};
  setHead('笔记'); setDl(false);
  showBtn('#btnNew', true, '新建笔记', 'i-plus');
  if(!state.noteView) state.noteView = {folder:'all', todo:false};
  $('#left').style.display = 'none';        // 分类改用列表顶部的 chips
  const c = $('#content');
  c.style.overflow = 'hidden';
  if(!$('#noteShell') || !$('#noteLeft')) c.innerHTML = '';
  showNotePane();                           // 真实布局：列表 + 多选条 + 阅读栏
  noteShellEmpty();
  const warm = !!(state.notes && state.notes.length);
  if(warm){
    drawNoteList(false);                      // 用上次的列表直接画，保留当前选中
    // 上次读到一半的那篇也直接放回来（有正文缓存就同步画，没有才走一次接口）
    const cur = state.noteId;
    if(cur && !$('#noteEdit') && state.notes.some(n => String(n.id) === String(cur))){
      const openHit = noteBodyGet(cur);
      if(openHit) paintNote(openHit); else showNote(cur);
    }
  }else noteListLoading();
  /* 每次进页签都去云端核一遍：后端那个 5 分钟缓存只用来「先画出来」，
     不能拿它当最终结果，否则在手机上新建的笔记切回来根本看不到。整表只有
     几十条，强制刷新也就两三百毫秒。 */
  const req = api('/api/notes?refresh=1');
  if(o.fresh || !warm){
    try{ applyNotesData(await req); }
    catch(e){
      if(String(e.message) === 'auth') return;
      const box = $('#noteList');
      if(box && !(state.notes && state.notes.length)) box.innerHTML = `<div class="empty">读取笔记失败</div>`;
    }
    return;
  }
  // 有缓存就不挡着：接口回来静默补上（这次带 refresh=1，拿到的就是云端最新）
  req.then(d => applyNotesData(d, true)).catch(e => {
    if(String(e.message) !== 'auth') console.log('笔记后台刷新失败', e);
  });
}

function filteredNotes(){
  const v = state.noteView || {folder:'all'};
  const q = uxNorm((window.UX && UX.q) || '').trim();
  let list = v.folder==='all' ? state.notes : state.notes.filter(n=>n.folder===v.folder);
  if(q){
    list = list.filter(n =>
      uxNorm(n.title).indexOf(q) >= 0 || uxNorm(n.preview).indexOf(q) >= 0);
  }
  return list;
}

function drawNoteFilters(){
  // 分类已经挪到笔记列表顶部的 chips（drawNoteChips），这里只保留兼容调用
  if($('#noteFilter')) drawNoteChips();
}

/* 分类 chips：一条横向滚动条，比左侧一整栏省地方，正文能拿到更宽的行宽 */
function drawNoteChips(){
  const box = $('#noteFilter');
  if(!box) return;
  const v = state.noteView || {folder:'all'};
  /* 逻辑：全部固定第一，其余分类按条数从多到少；同数量按名称，刷新后顺序稳定 */
  const cats = (state.folders || []).slice().sort((a, b) =>
    (Number(b.count) || 0) - (Number(a.count) || 0) ||
    String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hans-CN'));
  const chips = [{id:'all', name:'全部', count:state.notes.length}]
    .concat(cats.map(f => ({id:f.id, name:f.name, count:f.count})));
  box.innerHTML = chips.map(c => `<button class="chip${v.folder===c.id?' on':''}" data-f="${c.id}">${
      `<span class="cn">${esc(c.name)}</span>`}<em>${c.count}</em></button>`).join('');
  $$('#noteFilter .chip').forEach(b => b.onclick = () => {
    state.noteView = {folder: b.dataset.f};
    drawNoteList(true);
  });
}

function showNotePane(){
  const c=$('#content');
  c.style.overflow='hidden';
  if(!$('#noteShell') || !$('#noteLeft')){
    c.innerHTML = `<div id="noteShell">
      <div id="noteLeft">
        <div id="noteList"></div>
        <div class="notebar" id="noteSelBar">
          <span class="cnt">已选 0 项</span>
          <button class="btn outline xs" id="noteSelAll">全选</button>
          <button class="btn outline xs" id="noteSelNone">取消勾选</button>
          <button class="btn danger xs" id="noteDelSel" disabled>删除</button>
        </div>
      </div>
      <div id="noteReader"></div></div>`;
  }
  $('#noteList').style.display='';
  syncPanelGrip();
  setTimeout(syncPanelGrip, 0);
}

function drawNoteList(reselect){
  const list = filteredNotes();
  const box = $('#noteList');
  if(!box) return;
  if(!list.length){
    box.innerHTML = `<div class="nhead"><div class="notefilter" id="noteFilter"></div></div>
      <div class="empty" style="padding:60px 16px"><div class="big2">${ICO('i-note','xl')}</div>这个分类下没有笔记</div>`;
    drawNoteChips();
    $('#noteReader').innerHTML = `<div class="empty"><div class="big2">${ICO('i-note','xl')}</div>换一个分类看看</div>`;
    return;
  }
  box.innerHTML = `<div class="nhead">
      <div class="notefilter" id="noteFilter"></div>
    </div>` + list.map(n=>`
    <div class="note${state.noteSel && state.noteSel.has(n.id)?' sel':''}" data-id="${esc(n.id)}">
      <span class="ncb" data-id="${esc(n.id)}">${ICO('i-check')}</span>
      <div class="nmain">
        <div class="h"><span class="ti">${esc(n.title||'无标题')}</span>
          <span class="dt">${fmtShort(n.modified)}</span></div>
        <div class="pv">${esc(n.preview||'（空）')}</div>
      </div>
    </div>`).join('');
  if(!state.noteSel) state.noteSel = new Set();
  drawNoteChips();
  const selBar = $('#noteSelBar');
  const syncSel = () => {
    const n = state.noteSel.size;
    selBar.classList.toggle('on', n > 0);
    selBar.querySelector('.cnt').textContent = '已选 ' + n + ' 项';
    $('#noteDelSel').disabled = !n;
    // 一旦开始勾选，所有条目的勾选框都常驻显示，方便继续勾
    $('#noteList').classList.toggle('picking', n > 0);
  };
  $$('#noteList .ncb').forEach(cb => cb.onclick = e => {
    e.stopPropagation();
    const id = cb.dataset.id;
    if(e.shiftKey && state.noteAnchor && state.noteAnchor !== id){
      const ids = selRangeIds(list, state.noteAnchor, id);
      if(ids){
        ids.forEach(x => state.noteSel.add(x));
        $$('#noteList .note').forEach(el => el.classList.toggle('sel', state.noteSel.has(el.dataset.id)));
        syncSel();
        return;
      }
    }
    if(state.noteSel.has(id)) state.noteSel.delete(id); else state.noteSel.add(id);
    state.noteAnchor = id;
    cb.parentNode.classList.toggle('sel', state.noteSel.has(id));
    syncSel();
  });
  $('#noteSelAll').onclick = () => {
    const all = list.every(n => state.noteSel.has(n.id));
    list.forEach(n => all ? state.noteSel.delete(n.id) : state.noteSel.add(n.id));
    $$('#noteList .note').forEach(el => el.classList.toggle('sel', state.noteSel.has(el.dataset.id)));
    syncSel();
  };
  $('#noteSelNone').onclick = () => {
    state.noteSel.clear();
    state.noteAnchor = null;
    $$('#noteList .note').forEach(el => el.classList.remove('sel'));
    syncSel();
  };
  $('#noteDelSel').onclick = () => deleteNotes([...state.noteSel]);
  syncSel();
  $$('#noteList .note').forEach(el=>el.onclick=e=>{
    if(e.shiftKey){
      e.preventDefault();
      const id = el.dataset.id;
      if(state.noteAnchor){
        const ids = selRangeIds(list, state.noteAnchor, id);
        if(ids){
          ids.forEach(x => state.noteSel.add(x));
          $$('#noteList .note').forEach(x => x.classList.toggle('sel', state.noteSel.has(x.dataset.id)));
          syncSel();
          return;
        }
      }
      state.noteSel.add(id); state.noteAnchor = id;
      el.classList.add('sel'); syncSel();
      return;
    }
    if(e.target.closest('.ncb')) return;
    if(!leaveEditorIfNeeded()) return;          // 编辑中先确认，别把草稿冲掉
    $$('#noteList .note').forEach(x=>x.classList.toggle('on',x===el));
    showNote(el.dataset.id);
  });
  /* 重画后原来的 .on 已经随 DOM 一起没了，这里按 id 把「正在读的那条」找回来：
     后台补数据、改分类都只重画列表，不跳到第一条、也不重新请求正文。
     reselect=true（换分类/强制刷新）才回到第一条。 */
  let target = null;
  if(reselect){
    target = box.querySelector('.note');
  }else if(state.noteId != null){
    try{ target = box.querySelector(`.note[data-id="${CSS.escape(String(state.noteId))}"]`); }
    catch(_){ target = null; }
    if(!target){
      $$('#noteList .note').forEach(x => {
        if(x.dataset.id === String(state.noteId)) target = x;
      });
    }
  }
  if(!target && !reselect) target = box.querySelector('.note.on');
  // 正在编辑时不自动切到第一条，否则会把编辑器冲掉
  if(target && !$('#noteEdit')){
    $$('#noteList .note').forEach(x=>x.classList.toggle('on',x===target));
    if(String(target.dataset.id) !== String(state.noteId) || !$('#noteReader').innerHTML.trim()){
      showNote(target.dataset.id);
    }
  }
}

/* Markdown 渲染：尽量对齐小米笔记的显示（标题/列表/勾选/引用/代码/表格/图片/链接） */
function mdFixUrl(u){
  const m = String(u||'').match(/com\.miui\.notes\/image\/([0-9a-fA-F]+)/);
  return m ? ('/api/note_img?digest=' + m[1]) : u;
}

function mdInline(s){
  let h = esc(s);
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,
        (m, alt, url) => `<img class="mdimg" src="${mdFixUrl(url)}" alt="${alt}">`);
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,
        (m, t, url) => `<a class="mdlink" href="${url}" target="_blank">${t}</a>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  h = h.replace(/(^|[^*\w])\*([^*\n]+)\*(?=[^*\w]|$)/g, '$1<em>$2</em>');
  return h;
}

function renderMd(txt){
  const lines = String(txt||'').split(/\r?\n/);
  const out = [];
  let i = 0;
  const listStack = [];   // {indent, tag}
  const closeLists = (toIndent) => {
    while(listStack.length && listStack[listStack.length-1].indent >= toIndent){
      out.push(listStack.pop().tag === 'ol' ? '</ol>' : '</ul>');
    }
  };

  while(i < lines.length){
    const line = lines[i].replace(/\s+$/, '');
    const t = line.trim();

    // 代码块
    const fence = t.match(/^```(\w*)/);
    if(fence){
      closeLists(-1);
      const buf = [];
      i++;
      while(i < lines.length && !/^```/.test(lines[i].trim())) buf.push(lines[i++]);
      i++;
      out.push(`<pre class="mdpre"><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }

    // 表格
    if(/\|/.test(t) && i+1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])
       && /-/.test(lines[i+1])){
      closeLists(-1);
      const head = t.replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
      i += 2;
      const rows = [];
      while(i < lines.length && /\|/.test(lines[i]) && lines[i].trim()){
        rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim()));
        i++;
      }
      out.push('<div class="mdtable"><table><thead><tr>' +
        head.map(h=>`<th>${mdInline(h)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r=>'<tr>' + r.map(c=>`<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }

    // 标题
    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      closeLists(-1);
      const lv = h[1].length;
      out.push(`<h${lv} class="mdh">${mdInline(h[2])}</h${lv}>`);
      i++; continue;
    }

    // 分割线
    if(/^([-*_])\1{2,}$/.test(t)){ closeLists(-1); out.push('<hr>'); i++; continue; }

    // 引用
    if(/^>\s?/.test(t)){
      closeLists(-1);
      const buf = [];
      while(i < lines.length && /^>\s?/.test(lines[i].trim())) buf.push(lines[i++].trim().replace(/^>\s?/,''));
      out.push(`<blockquote>${mdInline(buf.join(' '))}</blockquote>`);
      continue;
    }

    // 列表（含勾选框）
    const li = line.match(/^(\s*)([-*+•]|\d+[.)])\s+(.*)$/);
    if(li){
      const indent = li[1].replace(/\t/g,'  ').length;
      const ordered = /\d/.test(li[2]);
      const tag = ordered ? 'ol' : 'ul';
      const body = li[3];
      while(listStack.length && listStack[listStack.length-1].indent > indent) {
        out.push(listStack.pop().tag === 'ol' ? '</ol>' : '</ul>');
      }
      if(!listStack.length || listStack[listStack.length-1].indent < indent){
        out.push(ordered ? '<ol class="mdlist">' : '<ul class="mdlist">');
        listStack.push({indent, tag});
      }
      const task = body.match(/^\[([ xX])\]\s*(.*)$/);
      if(task){
        const done = task[1].toLowerCase() === 'x';
        out.push(`<li class="task${done?' done':''}"><span class="cb">${done?'✓':''}</span><span>${mdInline(task[2])}</span></li>`);
      }else{
        out.push(`<li>${mdInline(body)}</li>`);
      }
      i++; continue;
    }
    closeLists(-1);

    if(!t){ out.push('<div class="mdgap"></div>'); i++; continue; }
    out.push(`<p>${mdInline(t)}</p>`);
    i++;
  }
  closeLists(-1);
  return out.join('');
}

/* 阅读页正文：如果正文第一行是一级标题、且内容和笔记标题完全一样，
   就把它去掉——标题已经在上面单独显示了，再显示一遍是重复。
   只改阅读时的展示，云端正文一个字都不动。 */
function noteDisplayBody(n){
  let body = (n && n.content) || '';
  const title = ((n && n.title) || '').trim();
  const lines = body.split('\n');
  const m = (lines[0] || '').match(/^\s*#\s+(.+?)\s*$/);
  if(title && m && m[1].trim() === title){
    lines.shift();
    while(lines.length && !lines[0].trim()) lines.shift();
    body = lines.join('\n');
  }
  return body;
}

/* 把一条笔记画进右侧阅读栏。options.quiet=true 表示后台刷新补正文：
   保留当前滚动位置，别把正在读的人甩回顶部。 */
function paintNote(n, options){
  const o = options || {};
  const r = $('#noteReader');
  if(!r || !r.isConnected) return;
  const keepScroll = o.quiet ? (($('#noteScroll') && $('#noteScroll').scrollTop) || 0) : 0;
  const bodyMd = noteDisplayBody(n);
  r.innerHTML = `<div id="noteScroll"><div id="notePad">
    <div class="nrow">
      <h2>${esc(n.title||'无标题')}</h2>
      <div class="nacts">
        <button class="btn sm primary" id="btnEditNote">编辑</button>
        <button class="btn sm danger" id="btnDelNote">删除</button>
      </div>
    </div>
    <div class="body mdbody" id="noteBody">${bodyMd?renderMd(bodyMd):'（这条笔记没有正文）'}</div>
  </div></div>
  <div id="noteMeta"><span>创建 ${fmtDate(n.created)}</span>
    <span>修改 ${fmtDate(n.modified)}</span>
    ${n.enc?'<span style="color:var(--accent)">· 已本地解密</span>':''}</div>`;
  const sc = $('#noteScroll'); if(sc) sc.scrollTop = keepScroll;
  state.noteReadAt = state.noteReadAt || {};
  if(n && n.id != null) state.noteReadAt[String(n.id)] = n.modified || 0;
  $$('#noteBody img.mdimg').forEach(img => {
    img.onclick = () => openViewer({id: img.src, name: '笔记图片', type: 'image',
                                    date: 0, fullUrl: img.src, bigUrl: img.src, thumbUrl: img.src});
  });
  $('#btnDelNote').onclick = () => deleteNotes([n.id]);
  $('#btnEditNote').onclick = () => openNoteEditor(n);
}

async function showNote(id, options){
  id = String(id);
  state.noteId = id;
  const r = $('#noteReader');
  if(r){
    /* 阅读页 = 上面可滚的正文 + 底下一根固定的信息栏 */
    r.style.display = 'flex';
    r.style.flexDirection = 'column';
    r.style.overflow = 'hidden';
  }
  // 读过的先画出来，点了立刻有内容；接口回来再核对有没有更新
  const hit = noteBodyGet(id);
  if(hit) paintNote(hit, options);
  if(state._notePending === id) return;   // 同一篇已在请求中，别重复发
  state._notePending = id;
  try{
    let n;
    try{ n = await api('/api/note?id='+encodeURIComponent(id)); }
    catch(e){
      if(String(e.message)!=='auth' && !hit) toast('这条笔记读不出来');
      if(!hit && r && r.isConnected) r.innerHTML =
        `<div class="empty"><div class="big2">${ICO('i-note','xl')}</div>这条笔记读不出来</div>`;
      return;
    }
    if(!r || !r.isConnected) return;    // 页面已经切走（例如快速切页签）
    if(state.noteId !== id) return;     // 连点两条：只画最后点的那条
    noteBodyPut(id, n);
    // 内容没变就不重绘，免得正文闪一下
    const changed = !hit || hit.title !== n.title || hit.content !== n.content
                    || (hit.modified|0) !== (n.modified|0);
    if(changed) paintNote(n, options);
  }finally{
    if(state._notePending === id) state._notePending = null;
  }
}

/* 同页编辑：左写右看，输入即渲染；新建也走这里，不再弹窗 */
const NOTE_TOOLS = [
  ['h1','H1','一级标题'],['h2','H2','二级标题'],['h3','H3','三级标题'],['sep'],
  ['b','<b>B</b>','加粗 Ctrl+B'],['i','<i>I</i>','斜体 Ctrl+I'],['s','<s>S</s>','删除线'],['sep'],
  ['ul','• 列表','无序列表'],['ol','1. 列表','有序列表'],['task','☑ 待办','待办项'],
  ['quote','❝ 引用','引用'],['sep'],
  ['code','`代码`','行内代码'],['pre','&lt;/&gt; 代码块','代码块'],
  ['link','链接','链接'],['table','表格','表格'],['hr','—','分割线'],
];
/* ---------- 富文本编辑器：HTML → Markdown ----------
   contenteditable 里编辑的是渲染后的 HTML，保存时要转回小米笔记存的 Markdown。
   只认我们自己支持的这几种标签，粘进来的外部样式会被 renderMd 重新规整掉。 */
function _mdInline(node){
  let s = '';
  for(const ch of node.childNodes){
    if(ch.nodeType === 3){ s += ch.nodeValue; continue; }
    if(ch.nodeType !== 1) continue;
    const t = (ch.tagName || '').toLowerCase();
    const inner = _mdInline(ch);
    if(t === 'strong' || t === 'b') s += inner ? '**' + inner + '**' : '';
    else if(t === 'em' || t === 'i') s += inner ? '*' + inner + '*' : '';
    else if(t === 's' || t === 'del' || t === 'strike') s += inner ? '~~' + inner + '~~' : '';
    else if(t === 'code') s += inner ? '`' + inner + '`' : '';
    else if(t === 'a') s += '[' + inner + '](' + (ch.getAttribute('href') || '') + ')';
    else if(t === 'img') s += '![' + (ch.getAttribute('alt') || '') + '](' + (ch.getAttribute('src') || '') + ')';
    else if(t === 'br') s += '\n';
    else s += inner;
  }
  return s;
}

function _mdBlock(node){
  const tag = (node.tagName || '').toLowerCase();
  const txt = _mdInline(node).replace(/\u00a0/g, ' ');
  if(/^h[1-6]$/.test(tag)) return '#'.repeat(Number(tag[1])) + ' ' + txt.trim() + '\n\n';
  if(tag === 'pre') return '```\n' + (node.textContent || '').replace(/\n+$/, '') + '\n```\n\n';
  if(tag === 'blockquote'){
    return txt.trim().split('\n').map(l => '> ' + l).join('\n') + '\n\n';
  }
  if(tag === 'ul' || tag === 'ol'){
    return [...node.children].map((li, i) => {
      /* 待办项：渲染成 <li class="task done"><span class="cb">✓</span><span>正文</span></li>，
         直接 _mdInline 会把勾号也写进正文，存回去就成了 "- ✓正文" */
      if(li.classList && li.classList.contains('task')){
        const done = li.classList.contains('done');
        const spans = li.querySelectorAll(':scope > span');
        const bodyEl = spans.length > 1 ? spans[spans.length-1] : li;
        return '- [' + (done ? 'x' : ' ') + '] ' + _mdInline(bodyEl).trim();
      }
      const mark = tag === 'ol' ? (i + 1) + '. ' : '- ';
      return mark + _mdInline(li).trim();
    }).join('\n') + '\n\n';
  }
  if(tag === 'hr') return '---\n\n';
  /* 表格在阅读/编辑区外面套了一层 <div class="mdtable">，要钻进去取 table，
     否则整张表会被当成普通段落拼成一行 */
  if(tag === 'div' && node.querySelector && node.querySelector('table')){
    return _mdBlock(node.querySelector('table'));
  }
  if(tag === 'table'){
    const rows = [...node.querySelectorAll('tr')];
    if(!rows.length) return '';
    const cells = r => [...r.children].map(c => _mdInline(c).trim().replace(/\|/g, '\\|'));
    const head = cells(rows[0]);
    let md = '| ' + head.join(' | ') + ' |\n| ' + head.map(() => '---').join(' | ') + ' |\n';
    for(const r of rows.slice(1)) md += '| ' + cells(r).join(' | ') + ' |\n';
    return md + '\n';
  }
  if(txt.trim()) return txt.trim() + '\n\n';
  return '';
}

function htmlToMd(root){
  const parts = [];
  for(const node of root.childNodes){
    if(node.nodeType === 3){
      const t = node.nodeValue.replace(/\u00a0/g, ' ').trim();
      if(t) parts.push(t + '\n\n');
      continue;
    }
    if(node.nodeType !== 1) continue;
    const md = _mdBlock(node);
    if(md) parts.push(md);
  }
  return parts.join('').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

/* 工具栏命令：直接用浏览器原生命令，撤销/重做也走原生栈 */
function mdExec(kind, ed){
  ed.focus();
  try{
    switch(kind){
      case 'h1': document.execCommand('formatBlock', false, 'H1'); break;
      case 'h2': document.execCommand('formatBlock', false, 'H2'); break;
      case 'h3': document.execCommand('formatBlock', false, 'H3'); break;
      case 'b':  document.execCommand('bold'); break;
      case 'i':  document.execCommand('italic'); break;
      case 's':  document.execCommand('strikeThrough'); break;
      case 'ul': document.execCommand('insertUnorderedList'); break;
      case 'ol': document.execCommand('insertOrderedList'); break;
      case 'quote': document.execCommand('formatBlock', false, 'BLOCKQUOTE'); break;
      case 'pre':   document.execCommand('formatBlock', false, 'PRE'); break;
      case 'hr':    document.execCommand('insertHorizontalRule'); break;
      case 'task':  document.execCommand('insertHTML', false, '☐ '); break;
      case 'code': {
        const sel = window.getSelection();
        const t = sel ? sel.toString() : '';
        const safe = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        document.execCommand('insertHTML', false, '<code>' + safe + '</code>');
        break;
      }
      case 'link': {
        const url = prompt('链接地址', 'https://');
        if(url) document.execCommand('createLink', false, url);
        break;
      }
    }
  }catch(_){}
}

let editorDirty = false;
let editingNoteId = null;      // 正在编辑的笔记 id（'' = 新建）；null = 没有编辑器
let noteNarrow = null;         // 笔记编辑器的窄屏切换，重开时替换掉旧的监听

/* Ctrl+S 的「临时保存」：只存本机（WebView 的 localStorage），不写云端。
   点「保存」才写云端；点「取消」会删掉暂存并重新读云端原文。 */
const noteDraftKey = id => 'miyun.draft.' + (id || 'new');
function readNoteDraft(id){
  try{ const s = localStorage.getItem(noteDraftKey(id)); return s ? JSON.parse(s) : null; }
  catch(_){ return null; }
}
function writeNoteDraft(id, title, body){
  try{ localStorage.setItem(noteDraftKey(id), JSON.stringify({title, body, at: Date.now()})); }
  catch(_){}
}
function dropNoteDraft(id){
  try{ localStorage.removeItem(noteDraftKey(id)); }catch(_){}
}

/* 退出笔记编辑器：恢复阅读栏的正常布局，并立刻清掉编辑器内容。
   左侧笔记列表一直保留（编辑时也不藏），所以这里不需要动 #noteList；
   全局 #left 在笔记页本来就该保持隐藏，不能显示回来。 */
function leaveNoteEditor(){
  const r = $('#noteReader');
  if(r){
    r.classList.remove('writing');
    r.style.display = '';
    r.style.flexDirection = '';
    r.style.overflow = 'auto';
    r.innerHTML = '';
  }
  const nl = $('#noteList'); if(nl) nl.style.display = '';
  $('#left').style.display = 'none';
}

/* 编辑中点别的笔记 / 切页签 / 新建之前先过这一关：
   有未保存的修改就问一句，避免草稿被无声丢掉。 */
function leaveEditorIfNeeded(){
  if(!$('#noteEdit')) return true;
  if(editorDirty && !confirm('还有没保存的修改，确定放弃？')) return false;
  editorDirty = false;
  if(editingNoteId !== null) dropNoteDraft(editingNoteId);   // 放弃时连本机暂存一起删
  editingNoteId = null;
  leaveNoteEditor();
  return true;
}

function openNoteEditor(note){
  const isNew = !note;
  const n = note || {id:'', title:'', content:''};
  editorDirty = false;
  editingNoteId = n.id || '';
  const draft = readNoteDraft(editingNoteId);
  const r = $('#noteReader');
  r.style.overflow = 'hidden';
  r.style.display = 'flex';
  r.style.flexDirection = 'column';
  /* 编辑时左侧笔记列表保持可见（只占右栏），切走时也看得见上下文 */
  $('#left').style.display = 'none';
  const nl = $('#noteList'); if(nl) nl.style.display = '';
  r.innerHTML = `<div id="noteEdit">
    <div class="ehead">
      <input id="neTitle" type="text" placeholder="标题" value="${esc(draft ? (draft.title||'') : (n.title||''))}">
      <span class="dirty" id="neDirty" style="display:none">未保存</span>
      <button class="btn sm ghost" id="neFull" title="全屏写作（Esc 退出）">全屏</button>
      <button class="btn sm ghost" id="neExport" title="导出为 Markdown 文件">导出</button>
      <button class="btn sm outline" id="neClose">取消</button>
      <button class="btn sm primary" id="neSave">保存</button>
    </div>
    <div class="etools">${NOTE_TOOLS.map(t => t[0]==='sep'
      ? '<span class="sep"></span>'
      : `<button data-md="${t[0]}" title="${t[2]}">${t[1]}</button>`).join('')}</div>
    <div class="esingle"><div id="neBody" contenteditable="true" spellcheck="false"
      data-ph="写点什么…"></div></div>
    <div class="efoot"><span id="neCount">0 字</span><span class="esep">·</span>
      <span id="neAuto">自动暂存已开启</span></div>
  </div>`;
  r.scrollTop = 0;

  const ed = $('#neBody'), titleIn = $('#neTitle');
  // 载入：有本机暂存就先显示暂存，否则显示云端原文
  ed.innerHTML = renderMd(draft ? (draft.body || '') : (n.content || ''));
  if(!ed.textContent.trim() && !ed.querySelector('img,video')) ed.innerHTML = '';
  const setDirtyTag = text => {
    const d = $('#neDirty');
    if(d){ d.textContent = text; d.style.display = ''; }
  };
  if(draft){ editorDirty = true; setDirtyTag('已暂存'); }
  const markDirty = () => {
    editorDirty = true;
    setDirtyTag('未保存');
  };
  ed.addEventListener('input', markDirty);
  titleIn.addEventListener('input', markDirty);
  /* Ctrl+S = 临时保存：只写本机暂存，不写云端，也不关编辑器 */
  const stage = () => {
    writeNoteDraft(editingNoteId, titleIn.value, htmlToMd(ed));
    editorDirty = true;
    setDirtyTag('已暂存');
    toast('已暂存到本机，点「保存」才写入云端');
  };
  const hookSave = el => el.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
      e.preventDefault();
      stage();
    }
  });
  hookSave(ed); hookSave(titleIn);

  /* 字数统计 + 1.5 秒自动暂存：只写本机草稿，不碰云端 */
  let autoT = null;
  const paintCount = () => {
    const c = $('#neCount');
    if(!c) return;
    const n = (ed.textContent || '').replace(/\s+/g, '').length;
    c.textContent = n + ' 字';
  };
  paintCount();
  const autoStage = () => {
    clearTimeout(autoT);
    autoT = setTimeout(() => {
      if(!editorDirty) return;
      writeNoteDraft(editingNoteId, titleIn.value, htmlToMd(ed));
      setDirtyTag('已自动暂存');
    }, 1500);
  };
  ed.addEventListener('input', () => { paintCount(); autoStage(); });
  titleIn.addEventListener('input', autoStage);
  ed.addEventListener('blur', () => {
    clearTimeout(autoT);
    if(editorDirty) writeNoteDraft(editingNoteId, titleIn.value, htmlToMd(ed));
  });

  /* 全屏写作：只隐藏左侧列表，不调系统全屏，退出时原样恢复 */
  const fullBtn = $('#neFull');
  if(fullBtn) fullBtn.onclick = () => {
    const r2 = $('#noteReader');
    const on = !r2.classList.contains('writing');
    r2.classList.toggle('writing', on);
    const nl = $('#noteList');
    if(nl) nl.style.display = on ? 'none' : '';
    fullBtn.textContent = on ? '退出全屏' : '全屏';
    if(on) ed.focus();
  };

  /* 导出 Markdown：标题 + 正文，文件名去掉非法字符 */
  const exBtn = $('#neExport');
  if(exBtn) exBtn.onclick = () => {
    const title = (titleIn.value || '').trim() || '未命名笔记';
    const md = `# ${title}\n\n${htmlToMd(ed)}`;
    const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = title.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) + '.md';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    toast('已导出 Markdown', {type:'ok'});
  };
  // 粘贴清洗：外部富文本先转 Markdown 再渲染回来，只保留我们支持的格式
  ed.addEventListener('paste', e => {
    const dt = e.clipboardData || window.clipboardData;
    if(!dt) return;
    const html = dt.getData('text/html');
    const text = dt.getData('text/plain');
    e.preventDefault();
    if(html && /<(h[1-6]|ul|ol|li|p|blockquote|pre|table|strong|b|em|i)/i.test(html)){
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      document.execCommand('insertHTML', false, renderMd(htmlToMd(tmp)));
    } else {
      document.execCommand('insertText', false, text);
    }
    markDirty();
  });
  $$('#noteEdit .etools button').forEach(b => b.onclick = () => {
    mdExec(b.dataset.md, ed);
    markDirty();
    ed.focus();
  });

  const close = () => {
    if(editorDirty && !confirm('还有没保存的修改，确定放弃？')) return;
    editorDirty = false;
    dropNoteDraft(editingNoteId);          // 取消 = 连本机暂存一起丢弃
    editingNoteId = null;
    /* 关键：先把编辑器的 flex/overflow 内联样式和内容一起清掉，再恢复列表。
       以前只把 #left 显示回来，编辑器还以 flex 列布局留在右栏里等接口，
       接口慢一点或失败就一直卡在错位状态。 */
    leaveNoteEditor();
    if(isNew){
      showNotePane();
      if($('#noteList')) drawNoteList(false);
      if(state.noteId){
        showNote(state.noteId);
      }else{
        const r = $('#noteReader');
        if(r) r.innerHTML = `<div class="empty"><div class="big2">${ICO('i-note','xl')}</div>左边点一条笔记就开始读</div>`;
      }
    }else{
      showNote(n.id);
    }
  };
  const save = async (btn) => {
    const title = titleIn.value.trim(), body = htmlToMd(ed);
    if(!title && !body.trim()){ titleIn.focus(); toast('写点什么再保存'); return; }
    btn.disabled = true; const old = btn.textContent; btn.textContent = '保存中 …';
    try{
      if(isNew){
        let folder = (state.noteView && state.noteView.folder) || 'all';
        if(folder === 'all') folder = '0';
        const res = await api('/api/note_create', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({title, content:body, folder})});
        editorDirty = false;
        dropNoteDraft(editingNoteId); editingNoteId = null;
        leaveNoteEditor();
        if(res.id){
          // 列表先本地插入，正文先用刚写完的，等接口在后台核对
          upsertNoteLocal(Object.assign({id:res.id, title, preview:body.trim().slice(0,180),
                                         content:body, folder}, res), true);
          noteBodyPut(res.id, {id:String(res.id), title, content:body,
            created:(res && res.created) || Date.now(), modified:(res && res.modified) || Date.now()});
          showNote(res.id);
        }
        toast('笔记已创建');
      }else{
        const r2 = await api('/api/note_save', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:n.id, title, content:body})});
        editorDirty = false;
        dropNoteDraft(editingNoteId); editingNoteId = null;
        leaveNoteEditor();
        const prev = noteBodyGet(n.id) || {};
        noteBodyPut(n.id, Object.assign({}, prev, {id:String(n.id), title, content:body,
          created:(prev && prev.created) || n.created || 0,
          modified:(r2 && r2.modified) || Date.now()}));
        upsertNoteLocal(Object.assign({id:n.id, title, preview:body.trim().slice(0,180)}, r2 || {}), true);
        showNote(n.id);
        toast('已保存');
      }
    }catch(e){
      toast('保存失败：' + errMsg(e));
    }finally{
      btn.disabled = false; btn.textContent = old;
    }
  };
  $('#neClose').onclick = close;
  $('#neSave').onclick = e => save(e.currentTarget);

  const narrow = () => {
    const box = $('#noteEdit');
    if(box) box.classList.toggle('narrow', r.clientWidth < 720);
  };
  narrow();
  // 每开一次编辑器都会挂一个监听，关掉时得摘掉，否则越积越多
  window.removeEventListener('resize', noteNarrow);
  noteNarrow = narrow;
  window.addEventListener('resize', noteNarrow);
  /* 这里原来残留着旧分栏编辑器的 paint() / ta.focus()，paint 和 ta 都不存在，
     每开一次编辑器就抛一次 ReferenceError，光标也不会自动落位。 */
  setTimeout(() => {
    const t = isNew ? $('#neTitle') : $('#neBody');
    if(t) t.focus();
  }, 40);
}

function newNote(){
  if(!leaveEditorIfNeeded()) return;           // 已经在写就别丢掉手上的草稿
  showNotePane();
  $$('#noteList .note').forEach(x => x.classList.remove('on'));
  openNoteEditor(null);
}

/* ---------- 代办 ---------- */
function todoRow(t){

      <span class="sdot">${ICO('i-check')}</span>
      <span>${esc(s.text)}</span></div>`).join('');
  return `<div class="todo${t.done?' done':''}" data-id="${esc(t.id)}">

      aria-checked="${!!t.done}" role="checkbox">${ICO('i-check')}</button>
    <div class="tx"><span class="ttl" title="${esc(t.title)}">${esc(t.title)}</span>
      ${subs?`<div class="sub">${subs}</div>`:''}</div>
    <span class="dt">${t.done ? (t.finished?fmtShort(t.finished):'已完成') : fmtShort(t.created)}</span>
    <span class="tck" data-id="${esc(t.id)}" role="checkbox" aria-checked="false"
      title="选中后可批量完成或删除">${ICO('i-check')}</span>
    <div class="acts">
      <button class="edit" data-id="${esc(t.id)}" title="编辑这条代办">
        <svg class="i"><use href="#i-note"/></svg></button>
